would suit people who wanted to grow food without giving up familiar surroundings.","zh":"我们的[[community|社区]]希望把一座[[empty|空的]][[garage|车库]]及其后方土地[[convert|转变]]成花园。想法很[[lofty|崇高]]，但资金[[limited|有限]]。一家本地[[institution|机构]]同意[[employ|雇用]]两位园丁，条件是居民协助[[management|管理]]。邻居开始为首次劳动日[[gather|聚集]]时，表现出了[[tremendous|极大的]]热情。一间[[closet|壁橱]]成为工具库，[[gray|灰色的]]墙面则留作绘画空间。花园将[[suit|适合]]那些想种植食物、又不愿离开[[familiar|熟悉的]]环境的人。"},{"en":"The first harvest was inferior to expectations. We asked students to analyze the soil and confirm whether shade was the problem. A lofty statue near the boundary blocked sunlight, but moving it might offend its donor. The gardeners used an analogy: just as people need balanced meals, plants require suitable conditions. The height of nearby trees and the beds' water intake both had a bearing on growth. We could deduce little from appearances alone, so measurements came before changes.","zh":"第一年的收成比预期[[inferior|更差]]。我们请学生[[analyze|分析]]土壤，并[[confirm|证实]]遮阴是否是问题所在。[[boundary|边界]]附近一尊[[lofty|高耸的]][[statue|雕像]]挡住了阳光，但搬动它可能[[offend|冒犯]]捐赠者。园丁作了一个[[analogy|类比]]：正如人需要均衡膳食，植物也[[require|要求]]合适的条件。附近树木的[[height|高度]]与种植床的水分[[intake|摄入量]]都和生长有[[bearing|关系]]。仅凭表象难以[[deduce|推断]]出多少结论，因此先测量，再改动。"},{"en":"We chose to automate watering with a timer and battery, move some beds, and leave the old trees standing. New equipment should not displace useful local knowledge. A deadline kept repairs moving, while lenient rules allowed beginners to learn. Nobody could violate the agreement by taking another family's crops. A visiting predator, a fox, reminded us that the site also belonged to wildlife. Children watched it from indoors instead of trying to chase it away.","zh":"我们决定利用定时器和[[battery|电池]]让浇水[[automate|自动化]]，移动部分种植床，并保留老树。新设备不应[[displace|取代]]有用的本地经验。[[deadline|最后期限]]推动维修进行，[[lenient|宽容的]]规则则让初学者有机会学习。任何人都不能拿走别家的作物而[[violate|违反]]约定。一只来访的[[predator|捕食性动物]]——狐狸——提醒我们，这里也是野生动物的家。孩子们在室内观察它，而不是试图把它赶走。"},{"en":"The next harvest produced a surplus. We sold berries, mushroom soup, dessert, and handicraft gifts at a fair beside an exhibition of contemporary art. Visitors would exclaim at the change, but we published a formal report rather than claim to have transformed the nation. When someone began to suspect fraud, receipts helped protect our reputation; anyone could duplicate the records. The magnitude of the improvement was real, although modest. Gardening gained a new connotation: cooperation. For two gardeners it also became a livelihood, so promises about fairness had to become practice, not hypocrisy.","zh":"下一次收获出现了[[surplus|盈余]]。我们在[[contemporary|当代的]]艺术展旁举办集市，出售浆果、[[mushroom|蘑菇]]汤、[[dessert|甜点]]和[[handicraft|手工艺品]]礼物。访客会为变化而[[exclaim|惊叹]]，但我们只是公布[[formal|正式的]]报告，没有宣称改变了整个[[nation|国家]]。当有人开始[[suspect|怀疑]]存在[[fraud|诈骗]]时，收据帮助保护了我们的[[reputation|声誉]]；任何人都可以[[duplicate|复制]]记录。改善的[[magnitude|程度]]虽不算大，却真实存在。园艺获得了新的[[connotation|内涵]]：合作。对两名园丁来说，它还成了[[livelihood|生计]]，因此有关公平的承诺必须落实为行动，而不是[[hypocrisy|虚伪]]。"}]},"15":{"title":"Filming the Wild","paras":[{"en":"A student film crew traveled to a remote valley to make a documentary for college credit. Their principal aim was to show why the forest mattered to nearby communities. A capable guide helped them construct a hide and check each item of equipment. The overall schedule had to align with reserve rules. This was no circus: they could not order animals to perform or chase them for a better shot. Respecting wildlife was an obligation, not merely a fascinating theme for a film.","zh":"一支学生摄制组前往[[remote|遥远的]]山谷，拍摄一部可获得大学[[credit|学分]]的纪录片。他们的[[principal|主要的]]目标，是展示森林为何对附近社区重要。一位[[capable|能干的]]向导帮助他们[[construct|建造]]隐蔽观察点，并检查每件[[item|物品]]。[[overall|整体的]]日程必须与保护区规则[[align|保持一致]]。这里不是[[circus|马戏团]]：他们不能[[order|命令]]动物表演，也不能为了更好的镜头而[[chase|追赶]]它们。尊重野生动物是一项[[obligation|义务]]，而不只是一个[[fascinating|迷人的]]电影主题。"},{"en":"At the first stage, intense heat threatened to exhaust the team. The ratio of usable footage to hours spent waiting was disappointing. They had to endure solitary watches and tackle the issue of unreliable power. Solar panels could harness sunlight, but there was no guarantee of clear weather. When insects began to besiege the camp, the crew had to modify its routines. Nobody could blame the guide for natural conditions, and there was no simple trick to counteract every difficulty.","zh":"在第一[[stage|阶段]]，[[intense|强烈的]]暑热几乎使团队[[exhaust|筋疲力尽]]。可用镜头与等待时间的[[ratio|比例]]令人失望。他们必须[[endure|忍受]][[solitary|独处的]]守候，并[[tackle|处理]]供电不稳这一[[issue|问题]]。太阳能板能够[[harness|利用]]阳光，但晴天并无[[guarantee|保证]]。当昆虫开始[[besiege|包围]]营地时，团队不得不[[modify|调整]]日常安排。没有人能为自然条件[[blame|责怪]]向导，也不存在一种简单办法可以[[counteract|抵消]]所有困难。"},{"en":"Financial pressure created another temptation. A domestic broadcaster offered money for dramatic scenes, while an international distributor wanted a quick release. The producer made a bald statement: disturbing animals would be hypocritical in a film about compassion. The team would rectify misleading captions and ask specialists to certify factual claims. Potential sales were an incentive, but protecting the habitat was more significant. Local families who depended on the forest had economic reasons to plead for its survival, too.","zh":"[[financial|财务上的]]压力带来了另一种诱惑。一家[[domestic|国内的]]广播机构愿意出钱购买戏剧性场景，一家[[international|国际的]]发行商则要求尽快发行。制片人作了一个[[bald|直截了当的]]声明：在一部讲述[[compassion|怜悯]]的影片中干扰动物，是[[hypocritical|虚伪的]]。团队将[[rectify|纠正]]误导性字幕，并请专家[[certify|证实]]事实性说法。[[potential|潜在的]]销售收入是一种[[incentive|激励]]，但保护栖息地更有[[significant|重要的]]意义。依靠森林生活的本地家庭，也有[[economic|经济的]]理由[[plead|恳求]]保住森林。"},{"en":"Eventually, patience produced scenes worth keeping: a tapir stopping to chew, various birds feeding, and a small minority of animals appearing only after dark. The director could immerse himself in observation without controlling it. Some camera angles looked weird, but honest images helped viewers appreciate the place. When the producer could finally announce the release, the crew understood what it must preserve. Never underestimate the value of waiting: the valley had supplied the story on its own terms.","zh":"[[eventually|最终]]，耐心换来了值得保留的场景：一只停下来[[chew|咀嚼]]的貘、[[various|各种各样的]]鸟类觅食，以及只在天黑后出现的[[minority|少数]]动物。导演可以让自己[[immerse|沉浸于]]观察，而不加以控制。有些拍摄角度看起来[[weird|奇怪]]，但真实的画面帮助观众[[appreciate|欣赏]]这个地方。当制片人终于能够[[announce|宣布]]发行时，团队明白了自己必须[[preserve|保护]]什么。不要[[underestimate|低估]]等待的价值：山谷以自己的方式提供了故事。"}]},"16":{"title":"The Paper Workshop","paras":[{"en":"After graduation, Mei hoped to enter the paper conservation profession. As an undergraduate, she had been asked to inspect a manuscript that a local citizen was about to inherit. It described an expedition through a swamp in a young republic. The pages were too damaged to exhibit. Her initial intention was simply to render them readable, but she discovered the scale of the work. From her standpoint, a beautiful cover was only an ornament if the words inside remained lost.","zh":"梅希望毕业后进入纸本文物修复这一[[profession|职业]]。还是[[undergraduate|本科生]]时，她就受邀检查一位本地[[citizen|公民]]即将[[inherit|继承]]的[[manuscript|手稿]]。它描述了一次在年轻[[republic|共和国]]境内穿越[[swamp|沼泽]]的[[expedition|远征]]。书页损坏严重，无法展出。她[[initial|最初的]][[intention|意图]]只是让文字重新[[render|变得]]可读，但后来才发现工作的[[scale|规模]]。从她的[[standpoint|角度]]看，如果内文仍然无法辨认，再漂亮的封面也只是[[ornament|装饰品]]。"},{"en":"She decided to seek a workshop rather than subordinate careful work to a rushed deadline. A small corporation offered a former cosmetics shop at low rent during a recession. It was a practical alternative to an expensive studio. A versatile machine, crude hand tools, and abundant patience formed the basis of her work. She learned to fold protective wrappers without pressing old pages and to examine every element of a binding. Experience would enhance her judgment more than impressive equipment.","zh":"她决定[[seek|寻找]]工作室，而不让细致修复[[subordinate|从属于]]仓促的期限。[[recession|经济衰退]]期间，一家小[[corporation|公司]]愿意低价出租原来的[[cosmetics|化妆品]]商店。这是昂贵工作室之外一个实用的[[alternative|选择]]。一台[[versatile|多功能的]][[machine|机器]]、一些[[crude|粗糙的]]手工工具，以及[[abundant|大量的]]耐心，构成了工作的[[basis|基础]]。她学习在不压迫旧书页的情况下[[fold|折叠]]保护封套，检查装订的每个[[element|组成部分]]。经验比显眼的设备更能[[enhance|提高]]她的判断力。"},{"en":"Then a plumbing breakdown exposed a grave shortcoming in the room. Paper was susceptible to damp, so she had to replace damaged shelving and ask specialists how to eradicate the mold. She could not neglect the problem or hide its extent from clients. A landlord notorious for vague promises initially refused repairs. Mei needed nerve to insist, but photographs helped convince him. The rent, minus the agreed repair allowance, finally left enough money to reopen.","zh":"随后，一次水管[[breakdown|故障]]暴露了房间的[[grave|严重的]]缺陷。纸张[[susceptible|易受]]潮气影响，因此她必须[[replace|更换]]受损书架，并请教专家如何[[eradicate|根除]]霉菌。她不能[[neglect|忽视]]问题，也不能向客户隐瞒损坏的[[extent|程度]]。房东以[[vague|含糊的]]承诺而[[notorious|声名狼藉]]，最初拒绝维修。梅需要[[nerve|勇气]]坚持要求，而照片帮助她[[convince|说服]]了房东。租金[[minus|减去]]商定的维修补贴后，终于留下了足够的重新开门资金。"},{"en":"At an open day, a miniature of a printing press and comic drawings attracted visitors. Mei made an appeal for volunteers to sort harmless packaging, not handle fragile originals. Clear instructions replaced ambiguous signs: bags must not occupy worktables, and litter belonged in bins. She could assure visitors that questions were welcome; nobody would expel an inexperienced helper for asking one. A retired archivist brought a civilian's wartime diary and offered advice. The workshop slowly earned a place in the conservation sector. Its success rested on showing honestly what repair could and could not achieve.","zh":"在开放日，一台印刷机的[[miniature|微缩模型]]和[[comic|滑稽的]]图画吸引了访客。梅发出[[appeal|呼吁]]，请志愿者整理无害的包装，而不是接触脆弱的原件。明确的说明取代了[[ambiguous|模棱两可的]]标志：包袋不得[[occupy|占用]]工作台，[[litter|垃圾]]应放进垃圾桶。她能够向访客[[assure|保证]]，这里欢迎提问，没有人会因为新手问问题就将其[[expel|驱逐]]。一位退休档案员带来一名[[civilian|平民]]的战时日记，并提供建议。工作室也逐渐在文物保护[[sector|领域]]站稳脚跟。它的成功建立在诚实说明修复能够做到什么、又不能做到什么之上。"}]},"17":{"title":"The Small Hotel","paras":[{"en":"At midday, severe weather closed the mountain road, leaving travelers at our small hotel. An agent called to ask whether a suite was available for a family delayed at customs. I used one click to check the bookings, then asked the tourism bureau to indicate a safe route to our door. The hotel's best feature was a cosy dining room, where a leaf pattern covered the walls and the smell of delicious soup began to permeate the air.","zh":"[[midday|中午]]，[[severe|严重的]]恶劣天气封住了山路，旅客滞留在我们的小旅馆。一位旅行[[agent|代理人]]来电询问，是否有一间[[available|可用的]][[suite|套间]]，供一个在[[customs|海关]]耽搁的家庭入住。我用一次[[click|单击]]查看预订，又请旅游[[bureau|局]][[indicate|指出]]通往旅馆的安全路线。旅馆最好的[[feature|特征]]是一间[[cosy|舒适的]]餐厅，墙上是树叶[[pattern|图案]]，[[delicious|美味的]]汤的香气开始[[permeate|弥漫]]在空气中。"},{"en":"Then a damaged cable cut the power. A diligent employee checked the main switch while I placed a candle where it could illuminate the reception desk. A brand-new emergency lamp provided better light once we found it. Staff were not ashamed to ask for help, and everyone present stayed calm. Our first principle was to cater to essential needs without making naive promises. The storm could be fatal to anyone trying the exposed road, so departures needed careful scrutiny.","zh":"随后，一根损坏的[[cable|电缆]]导致断电。一位[[diligent|勤勉的]]员工检查总[[switch|开关]]，我则把[[candle|蜡烛]]放在能够[[illuminate|照亮]]接待台的位置。找到一盏[[brand-new|全新的]]应急灯后，照明情况有所改善。员工并不因求助而[[ashamed|惭愧]]，所有[[present|在场的]]人都保持镇定。我们的首要[[principle|原则]]是[[cater|满足]]基本需要，不作[[naive|天真的]]承诺。对试图通过无遮蔽山路的人来说，风暴可能是[[fatal|致命的]]，因此离店计划需要[[scrutiny|仔细检查]]。"},{"en":"We had to devise a plan to manage supplies because the reservoir was low. Rather than expend energy on complaints, the cook offered simple local cuisine, with fruit as a supplement. She could introduce each dish and explain specific ingredients. A guest began to weep after losing contact with her children; another offered sympathy and a phone. We would not invade anyone's privacy, but a request for help usually found someone willing to oblige. Such kindness could nurture trust more effectively than luxury.","zh":"因为[[reservoir|水池]]水位很低，我们必须[[devise|设想]]一个[[manage|管理]]物资的方案。厨师没有在抱怨上[[expend|花费]]精力，而是提供简单的本地[[cuisine|菜肴]]，以水果作为[[supplement|补充]]。她能够[[introduce|介绍]]每道菜，说明[[specific|具体的]]食材。一位客人与孩子失去联系后开始[[weep|哭泣]]，另一位客人表达[[sympathy|同情]]，借给她手机。我们不会[[invade|侵犯]]任何人的隐私，但遇到求助，总有人愿意[[oblige|帮忙]]。这种善意比奢华设施更能[[nurture|培养]]信任。"},{"en":"Guests had to accustom themselves to different meal times, but we avoided a rigid schedule. Those eligible for a discount received it without having to argue. One visitor, acting on impulse, offered to buy the whole kitchen a new stove; we thanked him and suggested waiting. Our interest lay in a lasting relationship, not a dramatic gift. As conditions began to improve, I began to notice how much our manner mattered. We could pursue better equipment later; our immediate moral responsibility was to care for the people already here.","zh":"客人必须让自己[[accustom|习惯]]新的用餐时间，但我们避免采用[[rigid|刻板的]]日程。[[eligible|有资格的]]客人无须争论就能获得折扣。一位访客一时[[impulse|冲动]]，提出给厨房买一台新炉灶；我们表示感谢，并建议缓一缓。我们的[[interest|利益]]在于长久的关系，而不是引人注目的礼物。随着情况开始[[improve|改善]]，我[[notice|注意到]]待客[[manner|方式]]有多么重要。日后可以再[[pursue|追求]]更好的设备；眼前的[[moral|道德的]]责任，是照顾好已经来到这里的人。"}]},"18":{"title":"The Village Clinic","paras":[{"en":"On its tenth anniversary, a rural clinic faced a difficult choice. Should it expand the building or improve the awful road leading to its threshold? During floods, water could submerge the road and leave the clinic almost empty. Its current director invited each village to represent its residents at a forum. Staff would confer with them before choosing a strategy. A grand building alone could not accommodate people who were unable to reach it.","zh":"在成立十[[anniversary|周年纪念日]]之际，一家[[rural|乡村的]]诊所面临艰难选择：是[[expand|扩大]]建筑，还是改善通向[[threshold|门槛]]的那条[[awful|糟糕的]]道路？洪水期间，水会[[submerge|淹没]]道路，使诊所几乎空无一人。[[current|当前的]]负责人邀请各村派人[[represent|代表]]居民参加[[forum|论坛]]。工作人员将在确定[[strategy|策略]]之前与大家[[confer|协商]]。如果人们根本到不了，单有一座[[grand|宏大的]]建筑也无法真正[[accommodate|容纳]]他们。"},{"en":"Residents chose to opt for access first. They asked an expert to inspect a dangerous curve and estimate repair costs. The clinic could extend opening hours once transport improved. Donations were scarce, so a local contest and food fair would provide a means of raising funds. One family offered a regional delicacy; another donated an antique coin bearing a former sovereign's portrait. Every transaction would be recorded, and a public certificate would acknowledge each contribution without revealing secret personal details.","zh":"居民决定[[opt|选择]]优先改善通行。他们请一位[[expert|专家]][[inspect|检查]]一个危险的道路[[curve|弯道]]，并[[estimate|估计]]维修费用。交通改善后，诊所就能[[extend|延长]]开放时间。捐款[[scarce|不足]]，因此一场本地[[contest|比赛]]和美食集市将成为筹款的[[means|方法]]。一家提供地方[[delicacy|美食]]，另一家捐赠一枚印有昔日[[sovereign|君主]]肖像的[[antique|古董]]硬币。每笔[[transaction|交易]]都会记录在案，并用公开的[[certificate|证书]]致谢，同时不泄露[[secret|机密的]]个人信息。"},{"en":"Inside the clinic, a new code guided daily work. Staff had to wipe work surfaces, manage stock, and check each prescribed dose rather than alter it when supplies ran low. They would acquire medicines through approved suppliers. Digital technology helped extract totals from purchase records and consolidate the accounts. Disagreements arose over spending, but the director tried to reconcile competing needs. She could not abide careless bookkeeping: money for the road must remain within the agreed domain of that project.","zh":"诊所内部，一套新的[[code|行为准则]]指导着日常工作。员工必须[[wipe|擦拭]]工作表面，[[manage|管理]]库存，并核对每次处方规定的[[dose|剂量]]，而不是在物资紧张时擅自改动。他们将通过获认可的供应商[[acquire|获得]]药品。数字[[technology|科技]]帮助从采购记录中[[extract|提取]]汇总数据，并[[consolidate|加强]]账目管理。支出问题引起分歧，但负责人努力[[reconcile|调和]]不同需要。她无法[[abide|容忍]]草率记账：修路的钱必须用于该项目约定的[[domain|范围]]。"},{"en":"On fair day, clouds began to disperse, and wind threatened to scatter the leaflets. Volunteers moved the registration desk indoors, beside a mirror from the old waiting room. Visitors rested in the shade, and an elderly guest received a blanket. The turnout offered a dramatic spur to fundraising. More important was the change in attitude: people could endorse a plan they had helped shape. Their concern for one another would inspire the next improvement long after the anniversary decorations came down.","zh":"集市当天，云层开始[[disperse|散开]]，风差点把传单[[scatter|吹散]]。志愿者把登记桌搬到室内，放在旧候诊室的一面[[mirror|镜子]]旁。访客在[[shade|阴凉处]]休息，一位年长的客人得到了一条[[blanket|毯子]]。参与人数为筹款带来了[[dramatic|巨大的]][[spur|激励]]。更重要的是[[attitude|态度]]的变化：人们能够[[endorse|支持]]自己参与制定的计划。即使[[anniversary|周年纪念日]]的装饰早已撤下，大家彼此的[[concern|关心]]仍会[[inspire|激发]]下一次改善。"}]},"19":{"title":"Night School","paras":[{"en":"A night school opened in a building the council had agreed to rehabilitate. Low tuition attracted workers who could not leave their jobs. During an interview, an immigrant named Sara explained that she wanted to graduate from a catering course and open a shop. She was close to despair after repeated rejection elsewhere. The tutor did not predict instant success, but said competent teachers could help her overcome gaps in her training. Regardless of background, students could expect honest feedback.","zh":"一所夜校在市议会同意[[rehabilitate|修复]]的建筑里开办了。低廉的[[tuition|学费]]吸引了无法放下工作的劳动者。在一次[[interview|面试]]中，一位名叫萨拉的[[immigrant|移民]]说，她想从餐饮课程[[graduate|毕业]]后开店。在别处屡次遭拒后，她几乎陷入[[despair|绝望]]。导师没有[[predict|预测]]她会立刻成功，但表示[[competent|有能力的]]教师可以帮助她[[overcome|克服]]训练上的不足。[[regardless|不管]]背景如何，学生都可以[[expect|预期]]获得诚实的反馈。"},{"en":"Access was the first test of that promise. Steep stairs could pose problems, and one blind student needed accessible materials. The school would install better lighting and provide recordings as a substitute for printed instructions when appropriate. Such changes did not satisfy everyone immediately, but the staff's stance was clear: exclusion was not an acceptable shortcoming. Some neighbors were indignant about the expense until the school explained the economic benefits of helping more adults find work.","zh":"无障碍通行是对承诺的第一次考验。[[steep|陡峭的]]楼梯可能[[pose|造成]]问题，一位[[blind|失明的]]学生也需要无障碍材料。学校将[[install|安装]]更好的照明，并在适合时提供录音作为纸质说明的[[substitute|代替物]]。这些改变没有马上[[satisfy|使每个人都满意]]，但员工的[[stance|立场]]很清楚：把人排除在外是不可接受的[[shortcoming|缺点]]。一些邻居起初对费用感到[[indignant|愤怒]]，直到学校解释帮助更多成年人就业能够带来的[[economic|经济上的]]好处。"},{"en":"Sara had to commit time every evening and repeat unfamiliar tasks. She learned to fold a napkin, handle a sharp knife, and use herbs for flavor. A garden class taught students to irrigate beds and study each plant as a living organism with its own needs. In the repair room, another tutor helped students diagnose equipment faults and examine a composite worktop. Sara read a cook's biography during breaks, finding encouragement in someone else's slow progress.","zh":"萨拉必须[[commit|承诺投入]]每晚的时间，[[repeat|重复]]陌生的操作。她学习折叠[[napkin|餐巾]]，使用[[sharp|锋利的]]刀具，以及用香草增添[[flavor|味道]]。园艺课教学生[[irrigate|灌溉]]种植床，理解植物也是[[organism|生物]]，需要适当的生长条件。在维修室，另一位导师帮助学生[[diagnose|诊断]]设备故障，检查一张[[composite|复合材料制成的]]工作台。萨拉在休息时阅读一位厨师的[[biography|传记]]，从他人缓慢进步的经历中得到鼓励。"},{"en":"The breakthrough came at a fair where students could exhibit their merchandise to retail buyers. They had to dispatch an urgent order without letting mistakes creep into the packing. Sara refused to obsess over a minor delay or let it spoil the day. Teachers could attribute the result to practice, but confidence was an intangible gain. A local shelter ordered regular meals, giving her business its first steady customer.","zh":"在一场允许学生向[[retail|零售]]买家[[exhibit|展出]][[merchandise|商品]]的集市上，[[breakthrough|突破]]终于出现了。大家必须[[dispatch|发出]]一笔[[urgent|紧急的]]订单，同时避免错误悄悄[[creep|溜进]]包装流程。萨拉不肯为一次小延误而[[obsess|过分纠结]]，也不让它[[spoil|破坏]]这一天。教师可以把结果[[attribute|归因于]]练习，但自信是另一种[[intangible|无形的]]收获。一家本地[[shelter|避难所]]开始定期订餐，为她的生意带来第一位稳定客户。"},{"en":"At a teachers' congress, the head refused to declare that every difficulty was solved. A rising enrollment trend was encouraging, but they still had to deliberate before expanding and consider how to inject new funds responsibly. The school would remain a place where progress could be slow without being dismissed as failure.","zh":"在一次教师[[congress|代表大会]]上，校长没有[[declare|宣称]]所有困难都已解决。报名人数上升的[[trend|趋势]]令人鼓舞，但在扩张之前，他们仍须[[deliberate|深思熟虑]]，[[consider|仔细考虑]]如何负责任地[[inject|投入]]新资金。学校将继续[[remain|保持]]这样一种环境：允许进步缓慢，而不会轻率地把它当成失败。"}]},"20":{"title":"The Science Fair","paras":[{"en":"During the vacation, students decided to share a hall for a science fair. They had to rent it, so only a viable plan within their financial capacity could proceed. Their teacher challenged the orthodox idea that a huge machine made an experiment worthy of attention. A simple magnet could reveal a noteworthy pattern if the test was thorough. The students wanted an image of science based on integrity, not expensive displays. They began a chronicle of the project, recording changes as they happened.","zh":"[[vacation|假期]]期间，学生们决定[[share|共享]]一个大厅，举办科学展。他们必须支付[[rent|租金]]，因此只有在财务[[capacity|能力]]范围内[[viable|可行的]]方案才能推进。老师质疑了一种[[orthodox|传统的]]观念：实验必须有[[huge|巨大的]]机器才值得关注。只要测试[[thorough|彻底]]，一块简单的[[magnet|磁铁]]也能揭示[[noteworthy|值得注意的]]规律，使实验[[worthy|有价值]]。学生们希望建立以[[integrity|诚实]]为基础的科学[[image|形象]]，而不是依靠昂贵展品。他们开始编写项目[[chronicle|编年记录]]，及时记下变化。"},{"en":"Preparations exposed difficulties. A damaged component could hinder one display, while a violent storm threatened the roof. The remedy was to postpone outdoor tests and inspect each object indoors. The teacher would not impose one design on every team, but everyone had to adhere to the safety rules. A curtain made of silk shaded an optical exhibit; students checked that its frame would not scratch the lens. A model globe helped another group recognize the northern hemisphere.","zh":"筹备暴露出困难。一个损坏的[[component|部件]]可能[[hinder|妨碍]]展示，一场[[violent|猛烈的]]风暴则威胁着屋顶。[[remedy|解决方法]]是推迟室外测试，在室内检查每件[[object|物体]]。老师不会把同一种设计[[impose|强加于]]每组，但所有人都必须[[adhere|遵守]]安全规则。一幅[[silk|丝绸]][[curtain|窗帘]]为光学展品遮光，学生检查框架是否会[[scratch|刮伤]]镜头。一个地球模型则帮助另一组[[recognize|识别]]北[[hemisphere|半球]]。"},{"en":"Each team had to rehearse its explanation and reproduce its results. Intuition could suggest an idea, but it could not replace evidence. Students were anxious when a trial gave the opposite result. Their teacher tried to console them: an unexpected outcome could have a profound implication for their design. They should not discard awkward data or ignore a fault merely because doubts might linger. Awards could tempt anyone to exaggerate, but two classmates refused a suggestion to conspire in faking a demonstration.","zh":"每组都必须[[rehearse|练习]]讲解，并[[reproduce|复制]]自己的实验结果。[[intuition|直觉]]能够提示想法，却不能替代证据。一次试验产生[[opposite|相反的]]结果时，学生感到[[anxious|焦虑]]。老师试图[[console|安慰]]他们：意外结果可能对设计具有[[profound|深远的]][[implication|含义]]。他们不应仅仅因为疑虑可能[[linger|继续留存]]，就[[discard|丢弃]]不合预期的数据或[[ignore|忽视]]故障。奖项可能[[tempt|诱惑]]任何人夸大成果，但两名同学拒绝了一项共同[[conspire|密谋]]伪造演示的建议。"},{"en":"On opening day, the media asked whether one device could surpass a commercial product. The team explained its limits instead of accepting a literal reading of an enthusiastic slogan. Excessive confidence could deplete trust as quickly as a bad test drained a battery. Labels identified each device's default settings and an emergency scenario. One display explained why illegal dumping harmed rivers; the refreshments table sold bread made from local flour. Visitors could swallow a mouthful between questions, while the lesson became evident: honest uncertainty was part of good science.","zh":"开幕当天，[[media|媒体]]询问一个装置是否能够[[surpass|超过]]商业产品。团队解释了局限，而不是接受对热情口号的[[literal|字面意义的]]理解。[[excessive|过度的]]自信会迅速[[deplete|耗尽]]信任，就像糟糕的测试耗空电池。标签注明了各装置的[[default|默认值]]和一种紧急[[scenario|可能发生的情况]]。一项展示解释了[[illegal|非法的]]倾倒如何损害河流；茶点桌出售用本地[[flour|面粉]]做的面包。访客在提问间隙可以[[swallow|吞下]]一口面包，而这一道理也逐渐[[evident|清楚]]起来：诚实承认不确定性，也是好科学的一部分。"}]},"21":{"title":"The Old Gym","paras":[{"en":"After a factory layoff, our town's boxing club lost members and income. Its narrow profit margin could not cover a damaged roof, which might collapse in heavy rain. Some people wanted to close the hall, but a young coach offered a different glimpse of its future. A legitimate community club could attract families without chasing prestige. To overcome years of inertia, members used the constitution to call a vote and define what a safe, welcoming club should be.","zh":"工厂一次[[layoff|裁员]]后，小镇的[[boxing|拳击]]俱乐部失去了会员和收入。微薄的[[margin|利润]]不足以修理受损屋顶，而屋顶可能在大雨中[[collapse|倒塌]]。一些人想关掉场馆，一位年轻教练却让大家[[glimpse|瞥见]]了另一种未来。一个[[legitimate|合法的]]社区俱乐部能够[[attract|吸引]]家庭参与，无须追逐[[prestige|声望]]。为了克服多年的[[inertia|惰性]]，会员依照[[constitution|章程]]发起投票，给安全、友善的俱乐部[[define|下定义]]。"},{"en":"The situation required honest figures. We could not fabricate attendance records or distort costs to win a grant. Fuel prices had raised the bus fare, so the club helped younger members share transport. Coaches would converse with parents and demonstrate a gentle beginner's workout before anyone joined harder sessions. A biology teacher helped children decode a simple diagram of muscles. Nobody had to lose excess weight to belong, and anyone afraid of competition could choose a different activity.","zh":"当前[[situation|情况]]要求诚实的数据。我们不能为了获得资助而[[fabricate|编造]]出勤记录或[[distort|歪曲]]费用。[[fuel|燃料]]涨价推高了公交[[fare|票价]]，因此俱乐部帮助年轻会员安排共同出行。教练会与家长[[converse|交谈]]，并在任何人参加更难的课程前，[[demonstrate|展示]]温和的入门[[workout|锻炼]]。一位[[biology|生物学]]教师帮助孩子[[decode|解读]]简单的肌肉示意图。归属感不以减掉[[excess|多余的]]体重为前提，[[afraid|害怕]]比赛的人也可以选择其他活动。"},{"en":"Repairs came first because a flood could devastate the hall. Engineers checked the metal frame, and staff learned to operate a new drainage device. Solar panels reduced costs, allowing us to retain experienced coaches. Each safety parameter was recorded; nobody could be negligent about an injury or aggravate it through pressure. We would confine advanced sessions to supervised hours and shield beginners from intimidation. Dental injuries were discussed during safety training, rather than treated as an unavoidable sacrifice to tradition.","zh":"维修优先进行，因为洪水可能[[devastate|严重破坏]]场馆。工程师检查[[metal|金属]][[frame|框架]]，员工学习[[operate|操作]]新的排水[[device|装置]]。[[solar|太阳能的]]板降低了费用，让我们得以[[retain|保留]]经验丰富的教练。每项安全[[parameter|参数]]都作了记录；任何人都不得对伤情[[negligent|疏忽]]，更不能通过施压使其[[aggravate|恶化]]。我们将把进阶训练[[confine|限制]]在有人监督的时段，并[[shield|保护]]初学者免受恐吓。安全培训讨论了[[dental|牙齿的]]损伤，而不是把它当作维护[[tradition|传统]]所必需的[[sacrifice|牺牲]]。"},{"en":"At the reopening ceremony, children and parents shared a meal made with organic produce. From the balcony, we watched a flock of pigeons scatter as a hawk searched for prey to feed its offspring. Inside, the once silent hall had become dynamic again. A former member who hoped to graduate that summer returned to help with the demonstrations. Families could wander between demonstrations and meet people from the opposite side of town. The roof was repaired, but a common purpose was what truly held the club together.","zh":"在重新开放的[[ceremony|典礼]]上，孩子和家长分享了用[[organic|有机的]]农产品制作的饭菜。从[[balcony|阳台]]上，我们看见一[[flock|群]]鸽子在鹰为[[offspring|后代]]寻找[[prey|猎物]]时飞散。室内，一度[[silent|安静的]]大厅重新变得[[dynamic|充满活力]]。一位希望当年夏天[[graduate|大学毕业]]的老会员，回来协助演示。各家可以在演示场地之间[[wander|漫步]]，认识来自小镇[[opposite|另一边的]]居民。屋顶修好了，但真正让俱乐部团结起来的，是[[common|共同的]]目标。"}]},"22":{"title":"The Estate Sale","paras":[{"en":"After their father's death, two sisters needed to sell part of his estate. Unemployment had left them unable to repair the magnificent house or prolong its costly upkeep. The last tenant had already moved out. Given these circumstances, a sale seemed sensible, but grief threatened to overwhelm them. They asked an adviser to transform the hall into a small gallery and dedicate one room to their father's intellectual interests, preserving something of his life while settling the bills.","zh":"父亲去世后，两姐妹需要出售他的部分[[estate|地产及遗产]]。[[unemployment|失业]]使她们无力[[repair|修理]]这座[[magnificent|壮丽的]]房屋，也无法[[prolong|延续]]昂贵的维护。最后一位[[tenant|租户]]已经搬走。[[given|鉴于]]这些情况，出售似乎很合理，但悲伤几乎要将她们[[overwhelm|压倒]]。她们请顾问把大厅[[transform|转变]]成小画廊，并将一个房间[[dedicate|献给]]父亲的[[intellectual|智识]]兴趣，在支付账单的同时保留他的一些生活印记。"},{"en":"Their prime concern was a credible catalog. Painstaking research established which objects were genuine, and the adviser refused to manufacture a story about anything uncertain. Dim light had hidden a distinct crack in a sculpture; he pointed to it with his finger and wrote a concise description. A mature landscape painting seemed to embody the artist's best period, though one buyer called its bright colors vulgar. The sisters learned to tolerate differences in taste while remaining sceptical about unsupported claims.","zh":"她们[[prime|首要的]]关切，是制作一份[[credible|可信的]]目录。[[painstaking|费力的]]研究确认了哪些物品是真品，顾问拒绝为任何不确定的物件[[manufacture|制造]]故事。[[dim|昏暗的]]光线掩盖了[[sculpture|雕塑]]上一条[[distinct|明显的]]裂缝；他用[[finger|手指]]指出它，并写下[[concise|简洁的]]描述。一幅风格[[mature|成熟的]][[landscape|风景]]画似乎[[embody|体现]]了画家最好的创作阶段，尽管一位买家认为鲜艳的色彩很[[vulgar|庸俗]]。姐妹俩学着[[tolerate|容忍]]审美差异，同时对缺乏依据的说法保持[[sceptical|怀疑]]。"},{"en":"Foresight made the sale calmer. Staff would distribute catalogs, isolate fragile items behind ropes, and insure the valuable pieces. A barrier would divert visitors away from a damaged stair. They removed an old medicine bottle with a loose tablet inside, and planned to recycle empty packing boxes. The adviser showed due care for guests with cognitive difficulties, giving them extra time and clear signs. No affluent collector could bully another bidder, and everyone received equal access to information.","zh":"[[foresight|先见之明]]让拍卖更加有序。工作人员将[[distribute|分发]]目录，用绳栏[[isolate|隔离]]易碎物品，并为贵重藏品[[insure|投保]]。一道隔栏将[[divert|引导]]访客避开损坏的楼梯。他们移走了一只内有散落[[tablet|药片]]的旧药瓶，并计划[[recycle|循环利用]]空包装箱。顾问对有[[cognitive|认知]]困难的客人给予[[due|适当的]]关照，提供更充裕的时间和清楚的标志。任何[[affluent|富裕的]]收藏家都不能[[bully|欺负]]其他竞拍人，所有人都有[[equal|平等的]]获取信息机会。"},{"en":"At dawn on sale day, a herd of cattle crossed the distant fields. The sisters paused to wonder whether their father would approve. To their dismay, early offers were modest, and one mean bidder mocked the family tragedy. The adviser did not hesitate to insist on courtesy. When it was time to proclaim the sale open, he reminded those who came to attend that fairness mattered more than a dramatic performance. By evening, the sale had paid the urgent bills. Justice here meant honest treatment, not getting the highest possible price.","zh":"拍卖日[[dawn|黎明]]时分，一[[herd|群]]牛穿过远处的田野。姐妹俩停下来[[wonder|想知道]]，父亲是否会赞同这一切。令她们[[dismay|灰心]]的是，最初报价只有[[modest|些许]]，一位[[mean|吝啬的]]竞拍人还嘲讽她们家中的[[tragedy|悲剧]]。顾问没有[[hesitate|犹豫]]，立即要求对方保持礼貌。到了[[proclaim|宣布]]开拍的时候，他提醒前来[[attend|参加]]的人，公平比夸张的[[performance|表现]]更重要。到晚上，销售所得已支付了紧急账单。在这里，[[justice|公正]]意味着诚实对待他人，而不是得到尽可能高的价格。"}]},"23":{"title":"Power for the Valley","paras":[{"en":"The families who inhabit our valley depend on livestock and small farms. A joint energy project began with a natural question: could they generate some of their own electricity? The idea did not originate with a large company, but with residents tired of unreliable supplies. They asked a technical institute to evaluate it. An elegant drawing could illustrate the proposed structure, yet the majority wanted figures before making an investment. Nobody intended to rush a decision involving their savings.","zh":"[[inhabit|居住于]]山谷的家庭依靠[[livestock|牲畜]]和小农场生活。一项[[joint|共同的]]能源项目始于一个[[natural|自然的]]问题：他们能否自己[[generate|产生]]部分电力？想法并非[[originate|起源于]]大公司，而是来自受够了不稳定供电的居民。他们请一家技术[[institute|机构]][[evaluate|评估]]可行性。一张[[elegant|优雅的]]图纸可以[[illustrate|举例说明]]拟建系统的[[structure|结构]]，但[[majority|多数]]人想在[[investment|投资]]前看到数据。没有人打算对涉及积蓄的决定[[rush|仓促行事]]。"},{"en":"Engineers made a video to explain output estimates and specific costs. Each potential client received a memorandum describing an initial allowance, payment terms, and when a refund would be available. A liberal policy allowed households to leave before construction, rather than intimidate them into signing. The council could sanction a pilot only after reviewing the site. We did not intend to promise that output would triple immediately, even though such a claim might astonish potential donors.","zh":"工程师制作[[video|视频]]，[[explain|解释]]发电量估算与[[specific|具体的]]费用。每位潜在[[client|客户]]都收到一份[[memorandum|备忘录]]，说明初期[[allowance|补助]]、付款条件，以及何时可以获得[[refund|退款]]。一项[[liberal|宽松自由的]]政策允许各家在开工前退出，而不是[[intimidate|恐吓]]他们签约。市议会只有审查场地后才能[[sanction|批准]]试点。我们并不[[intend|打算]]承诺产量会立即[[triple|增至三倍]]，尽管这样的说法可能[[astonish|使潜在捐助者吃惊]]。"},{"en":"Installation revealed practical risks. A meter in a basement needed protection, and an external cable route crossed wet ground. Storms could occur suddenly, so engineers would suspend work rather than expose workers to danger. Once, a bang from a fallen branch stopped a test. The delay was frustrating, but shortcuts could be detrimental to the project. During commissioning, technicians recorded the temperature and learned to adjust the controls without treating each occasion as a chance to change everything.","zh":"安装暴露了实际风险。[[basement|地下室]]中的电表需要保护，一条[[external|外部的]]电缆路线还经过湿地。风暴可能突然[[occur|发生]]，所以工程师宁可[[suspend|暂停]]工作，也不会让工人[[expose|暴露]]于危险之中。有一次，树枝落下发出的[[bang|突然巨响]]中止了测试。延误令人沮丧，但走捷径可能对项目[[detrimental|有害]]。调试时，技术人员记录[[temperature|温度]]，学习[[adjust|调整]]控制装置，而不是把每个[[occasion|时机]]都当作全面改动的机会。"},{"en":"Two engineers continued to assist the team via remote calls. Volunteers would devote Friday afternoons to inspections and monitor waste so maintenance would not exhaust the fund. Their upright accounting earned praise, and residents voted to commend them. The benefits became manifest when outages declined, although no system could guarantee that nobody would suffer disruption again. A public discourse on capital and innovation now had a concrete example. Years of planning could finally culminate in a working service owned by the valley itself.","zh":"两位工程师继续[[via|通过]]远程通话[[assist|协助]]团队。志愿者将[[devote|把周五下午用于]]检查，并监控[[waste|浪费]]，避免维护工作[[exhaust|耗尽]]资金。[[upright|正直的]]记账方式赢得赞扬，居民投票决定[[commend|表扬]]他们。随着停电减少，收益变得[[manifest|明显]]，尽管没有任何系统能保证今后无人再[[suffer|遭受]]供电中断。一场关于[[capital|资本]]与[[innovation|创新]]的公开[[discourse|演讲]]如今有了具体实例。多年的规划终于能够[[culminate|以建成一项服务告终]]，而它属于山谷居民自己。"}]},"24":{"title":"The Food Kitchen","paras":[{"en":"An economic depression had reduced income across the town. Hunger could compel even proud families to seek help, so volunteers opened a temporary kitchen beneath the dome of an old market. Stalls used to sprawl across the floor; now tables formed a welcoming setting. The organizers had insight into local needs because they listened before acting. Public sentiment favored helping, but their budget deficit meant that goodwill alone would not suffice through the forthcoming winter.","zh":"经济[[depression|萧条]]使全镇[[income|收入]]下降。饥饿能够[[compel|迫使]]即使自尊心很强的家庭也来求助，因此志愿者在旧市场的[[dome|圆顶]]下开设了[[temporary|临时的]]厨房。摊位过去[[sprawl|蔓延]]占满地面，如今餐桌营造出友善的[[setting|环境]]。组织者先倾听再行动，因此对本地需求有了[[insight|洞察力]]。公众[[sentiment|情绪]]倾向于伸出援手，但预算[[deficit|赤字]]意味着，仅靠善意并不[[suffice|足以]]撑过[[forthcoming|即将来临的]]冬天。"},{"en":"They had to recruit helpers, negotiate with suppliers, and implement a clear schedule. Donations could augment supplies, while records showed how much fuel the kitchen would consume. Volunteers would weigh deliveries, keep only edible ingredients, and regulate the queue without humiliating anyone. They would ban filming that might interfere with a peaceful meal. A pregnant visitor who asked for immediate help received a meal before being asked to fill out any forms. The outcome mattered more than perfect paperwork.","zh":"他们必须[[recruit|招募]]帮手，与供应商[[negotiate|协商]]，并[[implement|实施]]明确的[[schedule|日程安排]]。捐赠能够[[augment|增加]]物资，记录则显示厨房会[[consume|消耗]]多少燃料。志愿者将对送货[[weigh|称重]]，只留下[[edible|可食用的]]食材，并在不羞辱任何人的前提下[[regulate|管理]]队列。他们将[[ban|禁止]]可能[[interfere|妨碍]]客人安静用餐的拍摄。一位请求[[immediate|立即的]]帮助的[[pregnant|怀孕的]]访客，在填写任何表格之前就得到了一餐。实际[[outcome|结果]]比完美的文书更重要。"},{"en":"Intensive shifts could injure tired workers, so well-off residents funded extra staff. A firm specializing in the manufacture of containers supplied reusable boxes for solid food and liquid alike. A garden group grew herbs; one donated plant was a clone of a productive parent. Seedlings needed regular care to flourish rather than perish in neglected trays. This extensive support relieved pressure. One family even sold an inherited treasure to fund a particular piece of equipment.","zh":"[[intensive|密集的]]班次可能使疲惫的工人[[injure|受伤]]，因此[[well-off|富裕的]]居民出资增聘人员。一家专门从事容器[[manufacture|制造]]的企业提供了可重复使用的盒子，既能盛固体食物，也能盛[[liquid|液体]]。园艺小组种植香草；一株获捐植物是高产母株的[[clone|克隆植物]]。幼苗需要定期照料，才能[[flourish|茁壮成长]]，而不是在被遗忘的育苗盘中[[perish|死亡]]。这种[[extensive|广泛的]]支持缓解了压力。一家人甚至变卖了一件继承的[[treasure|珍宝]]，专门资助一件[[particular|特定的]]设备。"},{"en":"To raise lasting support, a chef offered a cooking show. Each spectator could donate voluntarily; people seeking meals would incur no charge. A commercial sponsor proposed large advertisements, but the team feared they would derail the welcoming atmosphere. A subtle change could make guests feel like customers under pressure. The organizers would not deceive donors and could prove how funds were spent. Their logic was simple: every family had already tightened its belt enough. When the school offered its cafeteria, the kitchen finally gained a stable home.","zh":"为争取持续支持，一位厨师举办了烹饪展示。每位[[spectator|观众]]可以自愿捐款，求助用餐的人不会[[incur|产生]]费用。一家[[commercial|商业的]]赞助方提出张贴大型广告，但团队担心这会使友善服务的初衷[[derail|脱轨]]。一个[[subtle|细微的]]变化就可能让客人觉得自己是受到消费压力的顾客。组织者不会[[deceive|欺骗]]捐助者，并能[[prove|证明]]资金如何使用。他们的[[logic|逻辑]]很简单：各家早已把[[belt|腰带]]勒得够紧了。当学校提供[[cafeteria|自助餐厅]]时，厨房终于有了[[stable|稳定的]]落脚点。"},{"en":"With reliable space and staffing, volunteers could distribute meals regularly instead of improvising each day. The kitchen had become a dependable part of the town's response to hardship.","zh":"有了可靠的场地和人员，志愿者可以定期[[distribute|分配]]餐食，而不必每天临时应付。厨房已成为小镇应对困境的一项可靠服务。"}]},"25":{"title":"The Deep Collection","paras":[{"en":"A storm damaged the roof of our town's museum, threatening a collection that traced more than a billion years of Earth's history. Ancient rocks and the remains of extinct animals offered a clue to worlds that had vanished. The museum was a symbol of local curiosity, founded by a pioneer who had collected specimens near a mountain summit. Closing it permanently would deprive the next generation of that legacy, but opening damaged rooms would be stupid. Safety had to remain the supreme priority.","zh":"一场风暴损坏了小镇博物馆的屋顶，威胁着一批记录地球超过[[billion|十亿]]年历史的藏品。[[ancient|古老的]]岩石和[[extinct|灭绝的]]动物遗存，为已经消失的世界提供了[[clue|线索]]。博物馆是本地好奇心的[[symbol|象征]]，由一位曾在山地[[summit|顶峰]]附近采集标本的[[pioneer|先驱]]创立。永久关闭会[[deprive|剥夺]]下一[[generation|代]]继承这份遗产的机会，但开放受损房间又是[[stupid|愚蠢的]]。安全必须保持[[supreme|最高的]]优先级。"},{"en":"The director began to negotiate with the council and ask residents to contribute. A weak economy made every expense controversial. Some people expressed fury at the delay; others tried to agitate for immediate reopening. She would not yield to pressure or exclude critics from meetings. A safe entrance was a necessity, and specialists had to check old paint that might be toxic. Civil society groups helped explain the respective roles of staff and volunteers. Clear instruction was more useful than promises nobody could guarantee.","zh":"馆长开始与市议会[[negotiate|谈判]]，并请居民[[contribute|捐助]]。低迷的[[economy|经济]]让每笔支出都引发争议。有些人对延误表达[[fury|狂怒]]，另一些人试图[[agitate|煽动]]立即重新开放。她不会向压力[[yield|屈服]]，也不会把批评者[[exclude|排除]]在会议之外。安全的入口是一项[[necessity|必需条件]]，专家还必须检查可能[[toxic|有毒的]]旧油漆。[[civil|公民]]社会团体帮助说明员工和志愿者[[respective|各自的]]职责。明确的[[instruction|指示]]比无人能够[[guarantee|保证]]的承诺更有用。"},{"en":"Repairs included a sheltered terrace and artificial lighting for the displays. Routine inspections would continue beyond reopening, and staff would intervene if new cracks appeared. Contractors had to submit reports so the director could enforce the agreed standards. A large donation helped renew the roof without spending the museum's entire fortune. At a fundraising supper, a visiting astronaut spoke about exploration. His presence provided an incentive to attend, but the real attraction was the chance to help a familiar institution survive.","zh":"维修包括建设一处有遮蔽的[[terrace|平台]]，并为展柜安装[[artificial|人工的]]照明。[[routine|例行的]]检查将持续到重新开放[[beyond|之后]]，若出现新裂缝，员工便会[[intervene|干预]]。承包商必须[[submit|提交]]报告，使馆长能够[[enforce|强制执行]]约定标准。一笔大额捐款帮助[[renew|更新]]屋顶，没有花光博物馆的全部[[fortune|财富]]。在筹款[[supper|晚饭]]上，一位来访的[[astronaut|宇航员]]谈论了探索。他的到来提供了参加活动的[[incentive|动力]]，但真正的吸引力，是有机会帮助这家熟悉的机构[[survive|生存]]下去。"},{"en":"The advent of the renovated galleries brought a chance to tell fuller stories. Visitors could explore the founder's life as a dissident who had refused to resign from a scientific society under political pressure. An exhibit distinguished a fake fossil from a genuine one, using mistakes to stimulate questions. Staff would conduct tours and give children access to replicas rather than valuable stuff from storage. People increasingly came to investigate, not merely look. That willingness to ask questions became the museum's unique trait, and even those who had come to complain stayed to listen.","zh":"翻修后展厅的[[advent|出现]]带来了讲述更完整故事的机会。访客可以[[explore|探索]]创办人的人生：他曾是一位[[dissident|持不同政见者]]，拒绝在政治压力下从科学团体中[[resign|辞职]]。一个展区区分[[fake|伪造的]]化石与真品，利用错误[[stimulate|激发]]提问。员工将[[conduct|组织]]导览，让孩子有[[access|机会接触]]复制品，而不是库房里的贵重[[stuff|物品]]。人们[[increasingly|越来越多地]]前来探究，而非仅仅观看。提问的意愿成为博物馆[[unique|独一无二的]][[trait|特征]]，连前来[[complain|抱怨]]的人也留下来倾听。"}]},"26":{"title":"Above the Clouds","paras":[{"en":"A small aviation enterprise called Sky Bridge hoped to connect an isolated mountain town with the coast. Its founders considered the name apt, but the outlook was uncertain: debt was high and passenger numbers were low. At the outset, an intelligent planner proposed that two operators collaborate rather than compete for the same few customers. They would evaluate each route's altitude profile and costs before expanding. The business needed careful judgment, not the myth that every new flight must become profitable.","zh":"一家名为“空中桥梁”的小型[[aviation|航空]][[enterprise|企业]]希望把偏远山城与海岸连接起来。创办人认为这个名字[[apt|恰当]]，但[[outlook|前景]]并不确定：[[debt|债务]]很高，乘客数量却少。在[[outset|开端]]，一位[[intelligent|聪明的]]规划者提议，让两家运营方[[collaborate|合作]]，而不是争抢同一批为数不多的客户。他们将在扩张前评估各航线的[[altitude|海拔]]变化和费用。企业需要谨慎的[[judgment|判断]]，而不是相信每条新航线必然盈利的[[myth|神话]]。"},{"en":"A journalist arrived to investigate widespread complaints about fares. Good journalism required her to reveal the full amount travelers paid, not repeat promotional claims. An intense debate followed: should the company disguise extra charges to advertise cheaper tickets? Some passengers called this cruel to families with little money. The board reached a consensus that clear pricing was a prerequisite for trust. It would approve a trial in which customers saw the total before they chose to purchase a seat.","zh":"一位记者前来调查针对票价的[[widespread|广泛的]]投诉。好的[[journalism|新闻工作]]要求她[[reveal|揭示]]旅客实际支付的完整[[amount|数额]]，而不是重复宣传说法。随后展开了一场[[intense|激烈的]][[debate|辩论]]：公司是否应该[[disguise|掩饰]]附加收费，以宣传低价票？有些乘客认为，这对手头拮据的家庭很[[cruel|残忍]]。董事会达成[[consensus|共识]]：清晰定价是信任的[[prerequisite|前提]]。他们将[[approve|同意]]开展试行，让顾客在决定[[purchase|购买]]座位前看到总价。"},{"en":"On the first trial day, fog forced the staff to confront delays. A seemingly benign timetable change caused a consequent crowd at the gate. Staff gave prior notice whenever information changed and announced the interval before the next update. A free beverage and a warm towel helped refresh tired travelers. One visitor, unfamiliar with the alien surroundings, began to stumble over luggage. A worker guided her to an appropriate seat away from lights that could dazzle her. When a traveler reported physical discomfort, an airport doctor assessed whether to prescribe treatment.","zh":"试行首日，大雾迫使员工[[confront|面临]]延误。一次看似[[benign|良性的]]时刻表调整，引发了[[consequent|随之而来的]]登机口拥挤。信息有变时，员工尽可能发出[[prior|事先的]]通知，并宣布下一次更新前的[[interval|间隔]]。免费[[beverage|饮料]]和温热的[[towel|手巾]]帮助疲惫的旅客[[refresh|恢复精力]]。一位访客不熟悉[[alien|陌生的]]周围环境，在行李间走得[[stumble|跌跌撞撞]]。员工把她引导到一个[[appropriate|合适的]]座位，远离可能使她[[dazzle|目眩]]的灯光。一位旅客报告[[physical|身体的]]不适后，机场医生评估了是否需要[[prescribe|开处方]]治疗。"},{"en":"The delay felt like a defeat, but complaints were not the sole measure of service. A survey gave helpful staff a high score. They even helped a traveler find the warranty for a broken suitcase. Comfort need not be a luxury reserved for an elite; quiet doors that could slide shut mattered more than decoration. Noise could irritate anyone, especially after leisure plans were disrupted. The founders had reason to doubt their schedule, but chose not to dwell on embarrassment. It was necessary to improve it before they could proceed.","zh":"延误感觉像一次[[defeat|失败]]，但投诉并不是服务的[[sole|唯一的]]衡量标准。一项调查给乐于助人的员工打了很高的[[score|得分]]。他们甚至帮助一位旅客找到了损坏行李箱的[[warranty|保修单]]。舒适不必是专供[[elite|精英]]的[[luxury|奢侈享受]]；能够轻轻[[slide|滑动]]关上的门，比装饰更重要。噪声会[[irritate|使人烦恼]]，尤其当[[leisure|闲暇]]计划被打乱之后。创办人有理由[[doubt|怀疑]]时刻表，但选择不反复[[dwell|细想]]难堪之处。在继续[[proceed|前进]]之前，改进安排是[[necessary|必要的]]。"}]},"27":{"title":"The Planetarium","paras":[{"en":"Our island planned a planetarium, but rising costs threatened to make the project disappear. A supplier with a near monopoly could charge almost any price, and the budget began to soar. The director had to acknowledge that the original bargain was poor. Rather than boast about a future landmark, she chose to ditch the contract and seek local partners. People could condemn the delay, but a weak plan would not withstand another financial shock. The institution needed a clear guideline for spending.","zh":"我们的[[island|岛屿]]计划建一座天文馆，但上涨的成本几乎要让项目[[disappear|消失]]。一家接近[[monopoly|垄断]]的供应商几乎可以任意报价，预算开始[[soar|激增]]。负责人不得不[[acknowledge|承认]]，最初的[[bargain|交易]]并不划算。她没有继续[[boast|吹嘘]]未来的[[landmark|地标]]，而是选择[[ditch|丢弃]]原合同，寻找[[local|当地的]]伙伴。人们可以[[condemn|谴责]]延误，但薄弱的方案无法[[withstand|经受住]]另一次财务冲击。这家[[institution|机构]]需要明确的支出[[guideline|指导方针]]。"},{"en":"A diverse team helped resolve the problem. Engineers from the fishing industry designed supports to reinforce the dome, while teachers planned elementary lessons in physics. Construction could commence once inspections were complete. Staff would document decisions and monitor progress so hidden faults could not undermine the work. When evidence of forged invoices emerged, prosecutors considered whether to indict a contractor. The director would cooperate with the inquiry, not punish innocent workers. Problems could arise, but secrecy must not predominate.","zh":"一支成员[[diverse|多样的]]团队帮助[[resolve|解决]]问题。来自渔业[[industry|行业]]的工程师设计支撑结构，以[[reinforce|加固]]穹顶，教师则规划[[elementary|基础的]][[physics|物理学]]课程。检查完成后，施工才可以[[commence|开始]]。员工将[[document|记录]]决策、[[monitor|监控]]进展，避免隐藏的故障[[undermine|损害]]工作。当伪造发票的[[evidence|证据]]出现后，检方考虑是否[[indict|起诉]]一位承包商。负责人将配合调查，而不是[[punish|惩罚]]无辜工人。问题可能[[arise|出现]]，但隐瞒不能[[predominate|占主导地位]]。"},{"en":"Inside, the first slide placed the emphasis on our own planet as a shared resource. A display linked astronomy with agriculture through seasonal calendars. Another showed how authorities once tried to persecute thinkers whose observations challenged accepted beliefs. Guides would impart knowledge through questions, using folk stories as starting points but distinguishing them from scientific explanations. A tiny model suspended on an almost invisible thread could resemble a distant world. The focus was understanding, not simply an incredible spectacle.","zh":"馆内，第一张[[slide|幻灯片]]把[[emphasis|重视的重点]]放在我们共同拥有的[[planet|星球]]这一[[resource|资源]]上。一个展区通过季节历法把天文学与[[agriculture|农业]]联系起来。另一个展区说明，当观察挑战公认观念时，当权者曾如何试图[[persecute|迫害]]思想者。讲解员将通过提问[[impart|传授]]知识，以[[folk|民间的]]故事为起点，同时把故事与科学解释区分开。由一根几乎[[invisible|看不见的]]线悬挂的小模型，可以[[resemble|像]]一个遥远的世界。[[focus|焦点]]是理解，而不只是呈现[[incredible|难以置信的]][[spectacle|壮观景象]]。"},{"en":"Contrary to early fears, volunteers stayed, and staff turnover remained low. The museum could offer school visits even when bad weather threatened to hamper travel. On opening night, a storm began to strike the coast; nevertheless, the inspected building sheltered everyone safely. Visitors came to applaud the team, but the director refused to become complacent. The sky show mattered because it encouraged people to look more carefully at the world outside.","zh":"与早先的担忧[[contrary|相反]]，志愿者留了下来，员工[[turnover|流动率]]也保持较低水平。即使坏天气可能[[hamper|阻碍]]出行，馆方仍能[[offer|提供]]学校参观活动。开馆当晚，风暴开始[[strike|袭击]]海岸；[[nevertheless|然而]]，经过检查的建筑安全地为所有人遮风挡雨。访客前来为团队[[applaud|鼓掌]]，负责人却不肯变得[[complacent|自鸣得意]]。星空演示之所以重要，是因为它鼓励人们更加认真地观察外面的世界。"}]},"28":{"title":"The Shipyard","paras":[{"en":"An old shipyard won a contract for the overhaul of a passenger boat. The owner wanted to expand the business, but the lure of a large payment could not replace a concrete plan. An ancestor had built wooden boats there, and a stump from an old tree still stood beside the gate. Now the work involved an immense steel hull. The manager had to enlist skilled workers, lease a crane, and calculate lifting loads with an approved formula. Finishing ahead of schedule was desirable, but safety came first.","zh":"一家老船厂获得了客船[[overhaul|彻底检修]]合同。厂主想[[expand|扩大]]业务，但大额报酬的[[lure|诱惑力]]不能代替[[concrete|具体的]]计划。一位[[ancestor|祖先]]曾在这里造木船，门边至今还留着一棵老树的[[stump|树墩]]。如今，工作涉及一副[[immense|极大的]]钢制船体。经理必须[[enlist|招募]]熟练工人、[[lease|租用]]起重机，并用经过批准的[[formula|公式]]计算吊装载荷。[[ahead|提前]]完工固然理想，但安全优先。"},{"en":"Once aboard, mechanics began to dismantle the second-hand engine. They could detect corrosion that might have a serious impact on reliability. A young dropout, newly enrolled as an apprentice, noticed a minor crack and was reluctant to interrupt. The supervisor told everyone to refrain from jokes that might ridicule a beginner. Clear communication was a sacred rule: no observation was too trivial to report. An expert confirmed the crack, and the yard chose to withdraw the engine from service.","zh":"机械师一[[aboard|上船]]，便开始[[dismantle|拆卸]]那台[[second-hand|二手的]]发动机。他们能够[[detect|发现]]可能严重[[impact|影响]]可靠性的腐蚀。一位刚来当学徒的年轻[[dropout|辍学者]]注意到一条[[minor|较小的]]裂缝，却[[reluctant|不情愿]]打断别人。主管要求大家[[refrain|克制]]自己，不开可能[[ridicule|嘲笑]]新手的玩笑。清晰的[[communication|沟通]]是一条[[sacred|神圣的]]规则：没有哪项观察因过于[[trivial|微不足道]]而不值得报告。一位[[expert|专家]]确认了裂缝，船厂决定[[withdraw|撤回]]这台发动机，不再投入使用。"},{"en":"The discovery slowed momentum, and the team had to struggle with a revised timetable. A loophole in the supplier's agreement complicated replacement, so the manager sought a fair solution rather than an aggressive tactic. She refused a bizarre suggestion to conceal the defect before a royal visit to the harbor. Instead, she asked workers to compose a report and conceive a safer sequence of tasks. For instance, they could restore the cabin while waiting for parts. Exotic timber would be used only where its origin and suitability were documented.","zh":"这一发现减缓了进展[[momentum|势头]]，团队不得不[[struggle|努力应对]]修改后的时间表。供应协议中的一个[[loophole|漏洞]]使更换变得复杂，因此经理寻求公平的解决办法，而不是激进的[[tactic|策略]]。有人[[bizarre|怪异地]]建议，在[[royal|皇家]]访问团到达[[harbor|港口]]之前隐瞒缺陷，她拒绝了。相反，她请工人[[compose|撰写]]报告，[[conceive|构想]]更安全的作业顺序。举个[[instance|例子]]，等待零件时可以修复客舱。只有来源与适用性有记录的[[exotic|外来的]]木材才会被采用。"},{"en":"A formidable storm began to loom, and winds could intensify rapidly. Workers had to restrict access to vulnerable areas and transmit updates by radio. They checked that temporary frames stayed vertical and replaced a feeble light at the entrance. Training diagrams showed a clockwise rotation, but nobody operated unfamiliar equipment without supervision. They would contrive to keep the boat protected with the minimum crew necessary, not endeavor to finish outdoor tasks at any cost. This careful approach protected both the workers and the shipyard's future.","zh":"一场[[formidable|可怕的]]风暴开始[[loom|迫近]]，风力可能迅速[[intensify|增强]]。工人必须[[restrict|限制]]进入[[vulnerable|易受损的]]区域，并通过无线电[[transmit|传递]]最新情况。他们检查临时框架是否保持[[vertical|垂直]]，并更换入口处光线[[feeble|微弱的]]灯。培训图示展示了[[clockwise|顺时针方向的]]旋转，但任何人都不能在无人监督时操作陌生设备。他们将以必要的[[minimum|最少的]]人员[[contrive|设法做到]]保护船只，而不是不惜代价[[endeavor|努力]]完成室外任务。这种谨慎的[[approach|方法]]保护了工人，也保护了船厂的未来。"}]},"29":{"title":"A Small Studio","paras":[{"en":"Our software studio occupied a rented room in a coastal town. We had to renovate it, check the stock of test devices, and borrow a ladder to reach the shelves. Starting a business felt like an adventure, but an ideology of growth at any cost made us uneasy. Two large firms already dominate the market; we needed a better reason to exist than being aggressive. A contract with an automobile maker offered that chance: build an app that would liberate drivers from confusing controls.","zh":"我们的软件工作室租用了[[coastal|海岸的]]小镇里一个房间。我们必须[[renovate|翻新]]房间，检查测试设备的[[stock|库存]]，并借一架[[ladder|梯子]]够到书架。创业像一次[[adventure|冒险]]，但不惜代价追求增长的[[ideology|思想体系]]让我们不安。两家大企业已经[[dominate|占主导]]，我们需要比单纯[[aggressive|有进取心]]更充分的存在理由。与一家[[automobile|汽车]]制造商的合同带来了机会：开发应用，把司机从令人困惑的控制操作中[[liberate|解放]]出来。"},{"en":"Testing was vital. A weak signal could trap the app in a loop, and one remnant of old code kept causing failures. Our designer used her dissertation to enhance the interface, while internal teams learned to communicate findings clearly. We wanted to ensure consistent behavior before release. Nobody could hide a warning or call a careful tester lazy. Relentless checking took time, but an early launch could damage the trust we hoped to earn.","zh":"测试[[vital|至关重要]]。微弱的[[signal|信号]]可能让应用陷入[[loop|循环]]，旧代码的一处[[remnant|残余部分]]不断引发故障。设计师利用自己的[[dissertation|专业论文]]研究来[[enhance|改进]]界面，[[internal|内部的]]团队则学习清楚地[[communicate|沟通]]发现的问题。我们希望在发布前[[ensure|确保]]表现[[consistent|一致]]。任何人都不能[[hide|隐藏]]警告，也不能把认真测试的人说成[[lazy|懒惰]]。[[relentless|不懈的]]检查需要时间，但过早发布可能[[damage|损害]]我们希望建立的信任。"},{"en":"Then a headline made us stare: critics began to allege that the app enabled secret surveillance. In this context, silence would not help. We published the data flow and used independent findings to refute claims that were false. Some explanations were deficient, however, so we offered a sincere apology and rewrote them. Customer satisfaction depended on clear answers as much as clever features. We chose to seize the chance to improve, overcome the remaining faults, and meet a reasonable expectation of privacy. The first positive review brought delight because we had earned it through patient work.","zh":"随后，一则[[headline|标题]]让我们[[stare|盯着]]看了很久：批评者开始[[allege|声称]]，这款应用会进行秘密[[surveillance|监视]]。在这种[[context|背景]]下，沉默无济于事。我们公布数据流向，利用独立调查结果[[refute|驳斥]]不实说法。不过，有些解释确实[[deficient|不足]]，因此我们作出[[sincere|真诚的]]道歉，并重新编写说明。顾客的[[satisfaction|满意]]既取决于聪明的功能，也取决于清楚的答复。我们选择[[seize|抓住]]机会改进，[[overcome|解决]]剩余故障，满足人们对隐私的合理[[expectation|期望]]。第一条好评带来了[[delight|高兴]]，因为这是我们通过耐心工作赢得的。"}]}}}</script>
<script>
(function () {
  'use strict';

  var DATA;
  try {
    DATA = JSON.parse(document.getElementById('app-data').textContent);
  } catch (e) {
    document.body.innerHTML = '<p style="padding:24px;font:16px/1.6 -apple-system,sans-serif">这是模板文件，请先运行 build_app.py 生成正式 HTML。</p>';
    return;
  }
  var WORDS = DATA.words;
  var TOTAL = WORDS.length;
  var byId = {};
  WORDS.forEach(function (w) { byId[w.id] = w; });

  var GROUP = 50;                 // 每 50 词一页
  var PAGES = Math.ceil(TOTAL / GROUP);
  /* 注：不再使用固定行高常量 —— 手机竖屏下行高随释义换行变化，
     惰性渲染改为按实际几何位置测量（见 fillVisible） */

  /* ================= 存储 ================= */
  var LS_CLICKS = 'kaoyan1500.clicks.v1';
  var LS_AUTO = 'kaoyan1500.autospeak.v1';
  var LS_DEFSHOW = 'kaoyan1500.defaultshow.v1';
  var LS_DEFMODE = 'kaoyan1500.defmode.v1';
  var LS_COUNTS = 'kaoyan1500.showcounts.v1';
  var LS_FAVS = 'kaoyan1500.favs.v1';
  var memClicks = null;

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  var lsOK = (function () {
    if (!lsSet('__t', '1')) return false;
    try { localStorage.removeItem('__t'); } catch (e) {}
    return true;
  })();
  var showCounts = lsGet(LS_COUNTS) === '1';

  var clicks = {};
  (function () {
    var s = lsGet(LS_CLICKS);
    if (s) { try { clicks = JSON.parse(s) || {}; } catch (e) { clicks = {}; } }
    memClicks = clicks;
  })();
  function persist() {
    lsSet(LS_CLICKS, JSON.stringify(clicks));
    memClicks = clicks;
  }

  /* 收藏（提前声明：fillDetail 构建行时需要读取） */
  var favs = {};
  (function () {
    var s = lsGet(LS_FAVS);
    if (s) { try { favs = JSON.parse(s) || {}; } catch (e) { favs = {}; } }
  })();
  function persistFavs() { lsSet(LS_FAVS, JSON.stringify(favs)); }

  /* ================= 同步内核（跨设备合并） =================
     数据模型（syncDoc）：
       { v:2, updatedAt, clicksResetAt,
         favs: { <id>: [on(0/1), ts] },                        // 收藏：按时间戳「后写优先」
         dev:  { <deviceId>: { t, clicks: { <id>: [c, ts] } } } } // 点击：按设备分桶
     要点：
       · 点击次数按设备分桶累加，各设备只写自己的桶 → 同步/重复导入都不会重复计数
       · 收藏用 LWW（最后操作者生效），因此「取消收藏」也能正确同步到另一台
       · clicksResetAt：清空记录的时间点，早于它的记录一律忽略 */
  var LS_SYNC = 'kaoyan1500.sync.v1';
  var LS_DEVID = 'kaoyan1500.devid.v1';
  var LS_GH = 'kaoyan1500.gh.v1';
  var DEV_ID = (function () {
    var s = lsGet(LS_DEVID);
    if (!s) {
      s = 'd' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36);
      lsSet(LS_DEVID, s);
    }
    return s;
  })();

  function emptyDoc() {
    return { app: 'kaoyan1500', v: 2, updatedAt: 0, clicksResetAt: 0, favs: {}, dev: {} };
  }
  function persistSyncDoc() { lsSet(LS_SYNC, JSON.stringify(syncDoc)); }
  function ownBucket() {
    var b = syncDoc.dev[DEV_ID];
    if (!b) b = syncDoc.dev[DEV_ID] = { t: 0, clicks: {} };
    if (!b.clicks) b.clicks = {};
    return b;
  }
  function hash32(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = (h * 16777619) >>> 0; }
    return h.toString(36);
  }

  var syncDoc = (function () {
    var d = null;
    try { var s = lsGet(LS_SYNC); if (s) d = JSON.parse(s); } catch (e) { d = null; }
    if (!d || d.v !== 2) d = emptyDoc();
    if (!d.favs) d.favs = {};
    if (!d.dev) d.dev = {};
    /* 首次启用同步：把本机既有数据迁入「本机分桶」与收藏表 */
    if (!d.dev[DEV_ID]) {
      var b = { t: Date.now(), clicks: {} };
      for (var k in clicks) {
        var r = clicks[k];
        if (r && r.c > 0) b.clicks[k] = [r.c, r.t || Date.now()];
      }
      d.dev[DEV_ID] = b;
    }
    var now = Date.now();
    for (var f in favs) { if (favs[f] && !d.favs[f]) d.favs[f] = [1, now]; }
    return d;
  })();

  /* 由 syncDoc 重算本机显示用数据（clicks / favs） */
  function applyDoc() {
    var ra = syncDoc.clicksResetAt || 0;
    var agg = {};
    for (var dev in syncDoc.dev) {
      var b = syncDoc.dev[dev];
      if (!b || !b.clicks) continue;
      for (var id in b.clicks) {
        var rec = b.clicks[id];
        if (!rec) continue;
        var c = Math.floor(Number(rec[0])) || 0;
        var t = Number(rec[1]) || 0;
        if (c <= 0 || t < ra) continue;          // 清空记录之后的才计入
        var cur = agg[id];
        if (!cur) cur = agg[id] = { c: 0, t: 0 };
        cur.c += c;
        if (t > cur.t) cur.t = t;
      }
    }
    clicks = agg;
    var f = {};
    for (var fid in syncDoc.favs) {
      var e = syncDoc.favs[fid];
      if (e && e[0]) f[fid] = 1;
    }
    favs = f;
    persist();
    persistFavs();
  }

  /* 合并两份文档（幂等 + 可交换，不会重复计数） */
  function mergeDocs(a, b) {
    var out = emptyDoc();
    a = a || emptyDoc();
    b = b || emptyDoc();
    out.updatedAt = Math.max(a.updatedAt || 0, b.updatedAt || 0);
    out.clicksResetAt = Math.max(a.clicksResetAt || 0, b.clicksResetAt || 0);
    [a, b].forEach(function (d) {
      var fs = d.favs || {}, i;
      for (i in fs) {                              /* 收藏：LWW */
        var e = fs[i];
        if (!e) continue;
        var cur = out.favs[i];
        var ts = Number(e[1]) || 0;
        if (!cur || ts > (Number(cur[1]) || 0)) out.favs[i] = [e[0] ? 1 : 0, ts];
      }
      var ds = d.dev || {}, dv;
      for (dv in ds) {                             /* 点击：同一设备的桶按词取较大值（只增） */
        var bk = ds[dv];
        if (!bk) continue;
        var ob = out.dev[dv] || (out.dev[dv] = { t: 0, clicks: {} });
        if ((Number(bk.t) || 0) > ob.t) ob.t = Number(bk.t) || 0;
        var cs = bk.clicks || {}, wi;
        for (wi in cs) {
          var r = cs[wi];
          if (!r) continue;
          var cNew = Math.floor(Number(r[0])) || 0;
          var c0 = ob.clicks[wi];
          if (!c0 || cNew >= (Number(c0[0]) || 0)) {
            ob.clicks[wi] = [cNew, Math.max(Number(r[1]) || 0, c0 ? (Number(c0[1]) || 0) : 0)];
          }
        }
      }
    });
    return out;
  }

  /* 旧版数据（v1：仅点击次数）→ 包成一个伪设备桶；重复导入不会重复计数 */
  function legacyToDoc(obj) {
    var src = (obj && obj.clicks && typeof obj.clicks === 'object') ? obj.clicks : obj;
    if (!src || typeof src !== 'object') return null;
    var bucket = { t: Date.now(), clicks: {} }, n = 0;
    for (var k in src) {
      if (!/^\d{1,5}$/.test(k)) continue;
      var r = src[k];
      if (!r || typeof r !== 'object') continue;
      var c = Math.floor(Number(r.c));
      if (!isFinite(c) || c <= 0) continue;
      bucket.clicks[k] = [c, Number(r.t) || 0];
      n++;
    }
    if (!n) return null;
    var doc = emptyDoc();
    doc.dev['legacy:' + hash32(JSON.stringify(bucket.clicks))] = bucket;
    return doc;
  }

  /* ================= 工具 ================= */
  function fmtDate(ts) {
    if (!ts) return '';
    var d = new Date(ts), n = new Date();
    if (d.toDateString() === n.toDateString()) return '今天';
    var y = new Date(n.getTime() - 86400000);
    if (d.toDateString() === y.toDateString()) return '昨天';
    return (d.getMonth() + 1) + '-' + d.getDate();
  }
  function stamp() {
    var d = new Date(), p = function (x) { return (x < 10 ? '0' : '') + x; };
    return '' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate());
  }
  var toastEl = document.getElementById('toast');
  var toastTimer = 0;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1700);
  }

  /* ================= 表格 ================= */
  var listEl = document.getElementById('list');
  var listWrapEl = document.getElementById('listwrap');   /* 真正的滚动容器 */
  var tblEl = document.getElementById('tbl');
  var subEl = document.getElementById('sub');
  var rowRefs = {};
  var SVG_SPEAK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M15.8 8.7a4.4 4.4 0 010 6.6M18.4 6a7.8 7.8 0 010 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>';
  var speakSvg = SVG_SPEAK;
  var starSvg = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.6 9.7l5.8-.8z"/></svg>';
  var rootSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.6"/><circle cx="18" cy="18" r="2.6"/><path d="M8.2 7.8l7.6 8.4"/><path d="M18 4.5v3M16.5 6h3"/></svg>';

  function makePageSep(unitNo) {
    var sep = document.createElement('div');
    sep.className = 'page-sep';
    sep.dataset.unit = unitNo;
    var s = document.createElement('span');
    s.textContent = 'Unit ' + unitNo;
    sep.appendChild(s);
    /* 右侧「文章」按钮：打开该 Unit 的串联文章页 */
    var ab = document.createElement('button');
    ab.type = 'button';
    ab.className = 'sep-art';
    ab.dataset.unit = unitNo;
    ab.textContent = '文章';
    ab.setAttribute('aria-label', '阅读 Unit ' + unitNo + ' 的文章');
    sep.appendChild(ab);
    return sep;
  }

  /* ================= 表格（主表 / 只看收藏，共用同一套渲染） =================
     favOnly = true 时把数据源换成「收藏的词」，其余完全一致：
     同样的 Unit 分组、三态显隐、词根气泡、★/读音按钮、惰性填充。
     切换视图 = 重建 DOM（收藏词通常只有几十个，重建很快）。 */
  var favOnly = false;
  var sepEls = [];      // 当前视图的 Unit 标签元素（侧边导航跳转用）
  var sepTops = [];     // 各 Unit 标签的文档纵坐标（滚动高亮用）
  var navOnIdx = -1;    // 当前高亮按钮的索引（= unit-1；导航 DOM 常驻，不随视图重建）
  var navEl = document.getElementById('unit-nav');

  function buildTable() {
    var ids = [], i;
    for (i = 0; i < WORDS.length; i++) {
      if (!favOnly || favs[WORDS[i].id]) ids.push(WORDS[i]);
    }
    tblEl.innerHTML = '';
    rowRefs = {};
    sepEls = [];
    sepTops = [];
    navOnIdx = -1;

    if (!ids.length) {
      var empty = document.createElement('div');
      empty.className = 'tbl-empty';
      empty.textContent = '还没有收藏的单词。点击单词右侧的 ★ 即可加入收藏。';
      tblEl.appendChild(empty);
      buildUnitNav();
      return;
    }

    var frag = document.createDocumentFragment();
    var unitBody = null;
    var lastUnit = 0;
    ids.forEach(function (w, i) {
      var unit = Math.floor((w.id - 1) / GROUP) + 1;
      if (unit !== lastUnit) {
        lastUnit = unit;
        var sep = makePageSep(unit);
        sepEls.push(sep);
        frag.appendChild(sep);
        unitBody = document.createElement('div');
        unitBody.className = 'unit-body';
        frag.appendChild(unitBody);
      }
      var row = document.createElement('div');
      row.className = 'row' + (i % 2 ? ' alt' : '');
      row.dataset.id = w.id;

      // 左列：单词 + 点击角标
      var cw = document.createElement('div');
      cw.className = 'cell-w';
      var t = document.createElement('span');
      t.className = 'w';
      t.textContent = w.word;
      var b = document.createElement('span');
      b.className = 'badge';
      cw.appendChild(t);
      cw.appendChild(b);

      // 右列：音标 + 发音按钮 + 释义（默认隐藏，随展开填充）
      var cd = document.createElement('div');
      cd.className = 'cell-d';
      row.appendChild(cw);
      row.appendChild(cd);
      unitBody.appendChild(row);
      rowRefs[w.id] = { row: row, badge: b, cellW: cw, cellD: cd, filled: false };
    });
    tblEl.appendChild(frag);

    refreshAllBadges();
    applyModeToRows();
    fillVisible();
    buildUnitNav();
  }

  /* ================= 侧边 Unit 导航（刻度点阵） ================= */
  var navToggle = document.getElementById('nav-toggle');
  var tipEl = document.getElementById('un-tip');

  function buildUnitNav() {
    /* 导航常驻 PAGES 个点：切到「只看收藏」时不重建 DOM（只是把没有的 Unit 变淡），
       避免整条侧栏在切换视图/滚动时反复重绘 —— iPad 上多重蓝条的根源。 */
    if (navEl.children.length !== PAGES + 1) {   // children[0] 是唯一的指示条
      navEl.innerHTML = '';
      hideUnTip();
      var pill = document.createElement('i');
      pill.className = 'un-pill';
      navEl.appendChild(pill);
      for (var u = 1; u <= PAGES; u++) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'un-item' + (u % 5 === 0 ? ' major' : '');
        b.dataset.unit = u;
        b.setAttribute('aria-label', '跳转到 Unit ' + u);
        b.title = '';                     /* 用自己的浮标，避免系统 tooltip 延迟 */
        var s = document.createElement('span');
        s.className = 'un-label';
        s.textContent = u + '-unit';
        b.appendChild(s);
        b.addEventListener('mouseenter', showUnTipFor);
        b.addEventListener('mouseleave', hideUnTip);
        b.addEventListener('focus', showUnTipFor);
        b.addEventListener('blur', hideUnTip);
        navEl.appendChild(b);
      }
      navOnIdx = -1;
    }

    /* 当前视图里存在哪些 Unit → 映射到 sepEls 索引；不存在则变淡禁用 */
    var map = {};
    for (var k = 0; k < sepEls.length; k++) map[Number(sepEls[k].dataset.unit)] = k;
    for (var n = 1; n <= PAGES; n++) {
      var btn = navEl.children[n];
      var idx = map[n];
      var off = (idx === undefined);
      btn.dataset.i = off ? -1 : idx;
      btn.classList.toggle('off', off);
      btn.disabled = off;
    }

    /* 清掉上一视图残留的高亮（导航 DOM 常驻，切视图时必须显式清除，
       否则会同时出现两个 .on） */
    var stale = navEl.querySelectorAll('.un-item.on');
    for (var s = 0; s < stale.length; s++) stale[s].classList.remove('on');
    navOnIdx = -1;

    navEl.classList.toggle('empty', !sepEls.length);
    navEl.classList.toggle('can-scroll', navEl.scrollHeight > navEl.clientHeight + 2);
    measureUnits();
    updateNavActive();
    /* 首次构建时布局可能还没稳定 → 下一帧强制重算一次指示条位置 */
    requestAnimationFrame(function () {
      navOnIdx = -1;
      var prev = navEl.querySelector('.un-item.on');
      if (prev) prev.classList.remove('on');
      measureUnits();
      updateNavActive();
    });
  }

  /* 点阵很窄，编号靠悬停/聚焦时的浮标显示（右侧小胶囊） */
  function showUnTipFor(e) {
    var b = e.currentTarget || e;
    if (!b || !b.dataset) return;
    var r = b.getBoundingClientRect();
    tipEl.textContent = b.dataset.unit + '-unit';
    tipEl.style.top = Math.round(r.top + r.height / 2) + 'px';
    tipEl.style.left = Math.round(r.right + 8) + 'px';
    tipEl.classList.add('show');
  }
  function hideUnTip() { tipEl.classList.remove('show'); }

  /* 记录每个 Unit 标签在**滚动内容**中的位置（供滚动高亮） */
  function measureUnits() {
    sepTops = [];
    var base = listWrapEl.getBoundingClientRect().top;
    for (var i = 0; i < sepEls.length; i++) {
      sepTops.push(sepEls[i].getBoundingClientRect().top - base + listWrapEl.scrollTop);
    }
  }

  function topbarH() {
    var bar = document.getElementById('topbar');
    return bar ? bar.offsetHeight : 0;
  }

  function updateNavActive() {
    /* 当前 Unit → 按钮索引（按钮与 Unit 编号一一对应：索引 = unit-1）。
       DOM 操作只有两处：给旧项 remove('on')、给新项 add('on')，
       指示条则只用 transform 移动 → 合成器完成，不重绘，iOS 不会留残影。 */
    var btnIdx = -1;
    if (sepTops.length) {
      var y = listWrapEl.scrollTop + 24;   /* 相对滚动内容顶部 */
      var idx = 0;
      for (var i = 0; i < sepTops.length; i++) { if (sepTops[i] <= y) idx = i; }
      btnIdx = Number(sepEls[idx].dataset.unit) - 1;
    }
    if (btnIdx === navOnIdx) return;

    var prev = navOnIdx >= 0 ? navEl.children[navOnIdx + 1] : null;
    if (prev) prev.classList.remove('on');
    navOnIdx = btnIdx;

    if (btnIdx < 0) {                          /* 空列表：把指示条移出可见区 */
      navEl.style.setProperty('--pill-y', '-40px');
      return;
    }
    var cur = navEl.children[btnIdx + 1];
    if (cur) {
      cur.classList.add('on');
      /* 用实际矩形定位指示条（不依赖行高常量，也不受 padding 影响） */
      var nr = navEl.getBoundingClientRect();
      var cr = cur.getBoundingClientRect();
      var y = (cr.top - nr.top + navEl.scrollTop + (cr.height - 17) / 2) - 6;
      navEl.style.setProperty('--pill-y', Math.round(y * 10) / 10 + 'px');
    }

    /* 让高亮项保持在导航可视范围内（不要用 scrollIntoView：会带着整页滚）。
       导航不需要滚动时直接跳过，避免无谓的 scrollTop 写入触发重绘 */
    if (cur && navEl.scrollHeight > navEl.clientHeight + 2) {
      var t = cur.offsetTop, h = cur.offsetHeight;
      if (t < navEl.scrollTop) navEl.scrollTop = Math.max(0, t - 6);
      else if (t + h > navEl.scrollTop + navEl.clientHeight) {
        navEl.scrollTop = t + h - navEl.clientHeight + 6;
      }
    }
  }

  /* 当前视口顶部对应哪个 Unit（与导航高亮同一套算法）。
     这里**实时测量**而不用 sepTops 缓存：sepTops 只在滚动事件的 rAF 里刷新，
     若用户在滚动惯性未停时就点 ★，缓存可能落后一帧甚至过期，导致算错 Unit。 */
  function currentUnitNo() {
    if (!sepEls.length) return 0;
    var line = listWrapEl.getBoundingClientRect().top + 24;
    var unit = Number(sepEls[0].dataset.unit);
    for (var i = 0; i < sepEls.length; i++) {
      if (sepEls[i].getBoundingClientRect().top <= line) unit = Number(sepEls[i].dataset.unit);
    }
    return unit;
  }

  /* 在当前视图的 Unit 里找「距离 fromUnit 最近」的那个（距离相同取较大的 Unit） */
  function nearestUnitIndex(fromUnit) {
    if (!sepEls.length) return -1;
    var best = 0, bestD = Infinity;
    for (var i = 0; i < sepEls.length; i++) {
      var u = Number(sepEls[i].dataset.unit);
      var d = Math.abs(u - fromUnit);
      if (d < bestD || (d === bestD && u > Number(sepEls[best].dataset.unit))) {
        best = i; bestD = d;
      }
    }
    return best;
  }
  /* 跳转到某个 Unit（sepEls 索引）。
     两个坑：①表格是惰性填充的，滚过去后行被填充 → 行高变化 → 落点会漂；
     ②iOS 上若用户手指刚抬起（惯性滚动仍在跑），程序化 scrollTop 会被惯性吞掉，
       表现为「点了没反应 / 又弹回去」。
     所以：只在偏差 >2px 时才写 scrollTop（避免每帧重绘），但**持续对齐约 0.4s**
     （惯性会不断把位置带偏，我们每次都拉回来），直到连续 6 帧稳定才收工。 */
  function jumpToUnit(idx) {
    var sep = sepEls[idx];
    if (!sep) return;
    hideUnTip();
    function goal() {
      var base = listWrapEl.getBoundingClientRect().top;
      return Math.max(0, sep.getBoundingClientRect().top - base + listWrapEl.scrollTop - 6);
    }
    function apply() {                    // 对齐一次；返回是否已对齐
      var g = goal();
      if (Math.abs(g - listWrapEl.scrollTop) > 2) listWrapEl.scrollTo(0, g);
      return Math.abs(g - listWrapEl.scrollTop) <= 2;
    }
    apply();
    var t0 = (window.performance && performance.now) ? performance.now() : Date.now();
    var stable = 0;
    function settle() {
      fillVisible();                      // 惰性填充会让落点漂移 → 每帧补一次
      if (apply()) stable++; else stable = 0;
      var t = ((window.performance && performance.now) ? performance.now() : Date.now()) - t0;
      if ((t < 420 || stable < 6) && t < 1200) { requestAnimationFrame(settle); return; }
      measureUnits();
      updateNavActive();                  // 落定后按真实位置同步侧栏高亮
    }
    requestAnimationFrame(settle);
    closeNavDrawer();                     // 窄屏点击后自动收起
  }

  /* 关闭窄屏抽屉（统一入口：保持按钮状态一致） */
  function closeNavDrawer() {
    document.body.classList.remove('nav-open');
    navToggle.classList.remove('on');
  }

  navEl.addEventListener('click', function (e) {
    var b = e.target.closest('.un-item');
    if (!b) return;
    jumpToUnit(Number(b.dataset.i));
  });
  navToggle.addEventListener('click', function () {
    var open = document.body.classList.toggle('nav-open');
    navToggle.classList.toggle('on', open);
    if (open) updateNavActive();
  });
  /* 窄屏抽屉：点击空白处关闭 */
  document.addEventListener('click', function (e) {
    if (!document.body.classList.contains('nav-open')) return;
    if (e.target.closest('#unit-nav') || e.target.closest('#nav-toggle')) return;
    closeNavDrawer();
  });

  function refreshBadge(id) {
    var ref = rowRefs[id];
    if (!ref) return;
    var rec = clicks[id];
    if (rec && rec.c > 0) {
      ref.badge.textContent = '×' + rec.c;
    } else {
      ref.badge.textContent = '';
      ref.badge.className = 'badge';
    }
  }
  function refreshAllBadges() { for (var k in rowRefs) refreshBadge(k); }

  function computeStats() {
    var seen = 0, tc = 0;
    for (var k in clicks) {
      var c = (clicks[k] && clicks[k].c) || 0;
      if (c > 0) { seen++; tc += c; }
    }
    return { seen: seen, total: tc };
  }
  function favCount() {
    var n = 0;
    for (var k in favs) if (favs[k]) n++;
    return n;
  }
  function updateSub() {
    var base = favOnly
      ? '只看收藏 · ' + favCount() + ' 词 · ' + sepEls.length + ' 个 Unit'
      : '共 ' + TOTAL + ' 词 · ' + PAGES + ' 个 Unit';
    if (favOnly) {
      /* 本次会话里已取消、但行还留着的词（下次进入收藏视图才消失） */
      var pend = tblEl.querySelectorAll('.row.unfav-pending').length;
      if (pend) base += ' · ' + pend + ' 个已取消（下次打开移除）';
    }
    if (!showCounts) { subEl.textContent = base; return; }
    var s = computeStats();
    subEl.textContent = base + ' · 已查 ' + s.seen + ' · 点击 ' + s.total;
  }

  /* ================= 发音 ================= */
  var voices = [];
  function pickVoice() {
    try { if (!voices.length) voices = window.speechSynthesis.getVoices() || []; } catch (e) { voices = []; }
    var i, v;
    for (i = 0; i < voices.length; i++) {
      v = voices[i];
      if (/^en[-_](US|GB)/i.test(v.lang) && /Samantha|Alex|Ava|Daniel|Karen|Moira|Google/i.test(v.name)) return v;
    }
    for (i = 0; i < voices.length; i++) { v = voices[i]; if (/^en[-_]US/i.test(v.lang)) return v; }
    for (i = 0; i < voices.length; i++) { v = voices[i]; if (/^en/i.test(v.lang)) return v; }
    return null;
  }
  function speak(text) {
    if (!('speechSynthesis' in window)) { toast('当前环境不支持朗读'); return; }
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = 0.9; u.pitch = 1; u.volume = 1;
      var v = pickVoice();
      if (v) u.voice = v;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  if ('speechSynthesis' in window) {
    try {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = function () {
        try { voices = window.speechSynthesis.getVoices() || []; } catch (e) {}
      };
    } catch (e) {}
  }
  var LS_AUTO_VAL = lsGet(LS_AUTO) === '1';
  var autoSpeak = LS_AUTO_VAL;
  var chkAuto = document.getElementById('chk-auto');
  chkAuto.checked = autoSpeak;
  chkAuto.addEventListener('change', function () {
    autoSpeak = chkAuto.checked;
    lsSet(LS_AUTO, autoSpeak ? '1' : '0');
  });

  /* ================= 行内展开 / 收起（支持多个单词同时展开） ================= */
  function fillDetail(ref, w) {
    if (ref.filled) return;
    var cd = ref.cellD;

    // 左：音标 + 释义（单行流式，超出省略，保证行高不变）
    var flow = document.createElement('div');
    flow.className = 'd-flow';
    var ph = document.createElement('span');
    ph.className = 'd-phon';
    ph.textContent = '[' + w.phonetic + ']';
    flow.appendChild(ph);

    var defs = document.createElement('div');
    defs.className = 'd-defs';
    w.segs.forEach(function (s) {
      var line = document.createElement('div');
      line.className = 'def-line';
      if (s.pos) {
        var p = document.createElement('span');
        p.className = 'pos';
        p.textContent = s.pos;
        line.appendChild(p);
      }
      var d = document.createElement('span');
      d.className = 'def';
      d.textContent = s.def;
      line.appendChild(d);
      defs.appendChild(line);
    });
    flow.appendChild(defs);

    // 右：发音按钮 + 计数
    var sp = document.createElement('button');
    sp.className = 'speak';
    sp.type = 'button';
    sp.setAttribute('aria-label', '朗读');
    sp.innerHTML = speakSvg;
    sp.addEventListener('click', function (e) {
      e.stopPropagation();   // 发音按钮不触发行折叠
      speak(w.word);
    });

    // 收藏按钮（与读音按钮并排，常显）
    var st = document.createElement('button');
    st.className = 'star' + (favs[w.id] ? ' on' : '');
    st.type = 'button';
    st.setAttribute('aria-label', '收藏');
    st.innerHTML = starSvg;
    st.addEventListener('click', function (e) {
      e.stopPropagation();   // 不触发行的显隐切换
      toggleFav(w.id);
    });
    ref.star = st;

    // 词根拆解按钮（收藏左侧）
    var rb = document.createElement('button');
    rb.className = 'root-btn';
    rb.type = 'button';
    rb.setAttribute('aria-label', '词根词缀拆解');
    rb.innerHTML = rootSvg;
    rb.addEventListener('click', function (e) {
      e.stopPropagation();   // 不触发行显隐
      var r = rb.getBoundingClientRect();
      toggleRootPop(w, r.left + r.width / 2, r.top, r.bottom);
    });
    ref.rootBtn = rb;

    // 按钮统一放进 .row-btns：桌面在行右端独立一列；手机竖屏跨两行排在右上
    var btns = document.createElement('div');
    btns.className = 'row-btns';
    btns.appendChild(rb);   // 词根
    btns.appendChild(st);   // 收藏
    btns.appendChild(sp);   // 读音（最右）
    cd.appendChild(flow);
    ref.row.appendChild(btns);
    ref.filled = true;
  }

  /* ================= 收藏 ================= */
  function toggleFav(id) {
    if (favs[id]) delete favs[id]; else favs[id] = 1;
    /* ① 先改界面，再做持久化/同步（存储或同步出错也不影响界面）。
       收藏视图里取消收藏 → **行先留着**：只把星标变空心 + 整行淡出，
       等下次重新进入收藏视图（buildTable 按 favs 过滤）才真正消失。 */
    var ref = rowRefs[id];
    var pending = favOnly && !favs[id];
    if (ref) {
      if (ref.star) ref.star.classList.toggle('on', !!favs[id]);
      if (ref.row) ref.row.classList.toggle('unfav-pending', pending);
    }
    refreshFavCount();
    /* ② 持久化 + 同步：各自独立兜底，任何异常都不该影响界面 */
    try { persistFavs(); } catch (e) { }
    try {
      /* 带时间戳的最后操作：取消收藏也能同步到另一台 */
      syncDoc.favs[id] = [favs[id] ? 1 : 0, Date.now()];
      persistSyncDoc();
      markSyncDirty();
    } catch (e) { }
  }

  function refreshFavCount() {
    var n = favCount();
    var btn = document.getElementById('btn-fav');
    btn.classList.toggle('on', favOnly);      /* 高亮 = 当前正处于「只看收藏」视图 */
    var label = favOnly ? '返回全部单词' : '只看收藏（' + n + '）';
    btn.setAttribute('aria-label', label);
    btn.title = label;
    if (favOnly) updateSub();
  }

  function countClick(id) {
    var rec = clicks[id];
    if (!rec) { rec = clicks[id] = { c: 0, t: 0 }; }
    rec.c += 1;
    rec.t = Date.now();
    persist();
    /* 同步用：只写「本机分桶」，另一台设备的计数不会被重复计 */
    var b = ownBucket();
    var r = b.clicks[id] || (b.clicks[id] = [0, 0]);
    r[0] = (Number(r[0]) || 0) + 1;
    r[1] = rec.t;
    b.t = rec.t;
    persistSyncDoc();
    markSyncDirty();
    refreshBadge(id);
    updateSub();
  }

  function expand(id, opts) {
    opts = opts || {};
    var w = byId[id];
    var ref = rowRefs[id];
    if (!w || !ref) return;

    if (opts.count !== false) countClick(id);

    fillDetail(ref, w);
    ref.row.classList.add('open');

    if (!opts.silent && autoSpeak) speak(w.word);
  }

  function collapseRow(id) {
    var ref = rowRefs[id];
    if (!ref) return;
    ref.row.classList.remove('open');
  }
