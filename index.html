<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="1500词">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>1500词</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="app-version" content="4a3144edf2e3">
<script>
(function () {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  var VER = (document.querySelector('meta[name="app-version"]') || {}).content || '';

  window.addEventListener('load', function () {
    /* updateViaCache:'none' —— 检查 sw.js 更新时不走 HTTP 缓存（GH Pages 固定 max-age=600） */
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(function () {});
  });

  /* 新版本提示条：仅当「之前已由 SW 控制」时才提示（首次安装不算更新） */
  var hadCtrl = !!navigator.serviceWorker.controller;
  var acted = false;   /* 用户是否已经操作过（还没操作时可以直接静默更新） */
  ['pointerdown', 'keydown', 'touchstart'].forEach(function (t) {
    document.addEventListener(t, function () { acted = true; }, { passive: true, once: true });
  });
  function showUpdateBar() {
    if (document.getElementById('sw-upd')) return;
    var bar = document.createElement('div');
    bar.id = 'sw-upd';
    bar.innerHTML = '<span>发现新版本，刷新后生效</span>' +
      '<button type="button" id="sw-upd-go">立即刷新</button>' +
      '<button type="button" id="sw-upd-no" aria-label="稍后">×</button>';
    document.body.appendChild(bar);
    bar.querySelector('#sw-upd-go').addEventListener('click', function () { location.reload(); });
    bar.querySelector('#sw-upd-no').addEventListener('click', function () { bar.remove(); });
  }
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!hadCtrl) { hadCtrl = true; return; }
    /* 刚打开、用户还没点任何东西 → 直接静默更新（否则用户很容易一直停在旧版本，
       以为新功能「无效」）。每次会话最多自动刷一次，之后退回提示条。 */
    try {
      if (!acted && !sessionStorage.getItem('swAutoReload')) {
        sessionStorage.setItem('swAutoReload', '1');
        location.reload();
        return;
      }
    } catch (e) { }
    showUpdateBar();
  });

  /* 回到前台时主动检查一次（iOS PWA 常常只是恢复内存页面，不会重新导航） */
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    navigator.serviceWorker.getRegistration().then(function (r) { if (r) r.update(); }).catch(function () {});
  });

  /* 统计面板底部：版本号 + 手动检查更新 */
  window.addEventListener('load', function () {
    setTimeout(function () {
      var foot = document.querySelector('#sheet .s-foot');
      if (!foot || foot.querySelector('.ver-line')) return;
      var line = document.createElement('div');
      line.className = 'ver-line';
      line.innerHTML = '版本 <code>' + VER + '</code> · <a href="#" id="sw-check">检查更新</a>';
      foot.appendChild(line);
      line.querySelector('#sw-check').addEventListener('click', function (e) {
        e.preventDefault();
        var r0 = navigator.serviceWorker.getRegistration();
        Promise.resolve(r0).then(function (r) { return r ? r.update() : null; })
          .then(function () {
            setTimeout(function () {
              if (!document.getElementById('sw-upd')) {
                alert('已是最新版本（' + VER + '）');
              }
            }, 1500);
          }).catch(function () {});
      });
    }, 600);
  });
})();
</script>
<style>
#sw-upd{
  position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:90;display:flex;align-items:center;gap:10px;max-width:calc(100vw - 24px);
  padding:10px 12px 10px 14px;border-radius:14px;background:#0a84ff;color:#fff;
  font:13px/1.2 -apple-system,BlinkMacSystemFont,"PingFang SC",Arial,sans-serif;
  box-shadow:0 10px 30px rgba(0,0,0,.28);
}
#sw-upd button{
  border:none;background:rgba(255,255,255,.22);color:#fff;
  font:600 12.5px/1 inherit;padding:7px 11px;border-radius:9px;
}
#sw-upd #sw-upd-no{background:none;font-size:16px;padding:2px 6px;opacity:.85}
.ver-line{margin-top:10px;font-size:11.5px;color:var(--text2);text-align:center}
.ver-line code{font-size:11px;background:rgba(120,120,128,.16);padding:1px 5px;border-radius:4px}
.ver-line a{color:var(--blue);text-decoration:none}
</style>

<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  color-scheme:light dark;
  --bg:#f2f2f7; --card:#fff; --text:#1c1c1e; --text2:#6e6e73;
  --sep:rgba(60,60,67,.16);
  --bar-bg:rgba(242,242,247,.85);
  --bar-solid:#f2f2f7;
  --blue:#007aff; --blue-tint:rgba(0,122,255,.12);
  --red:#ff3b30;
  --zebra-a:#ffffff; --zebra-b:#e6e6e6;
  --press-bg:#d7d7dc;
  --tbl-line:#999999; --tbl-border:#000000;
  /* PDF 字体: Segoe UI(西文)+SimSun(中文); Apple 回退: SF + Songti SC */
  --font-tbl:"PdfTable","Segoe UI","SimSun",-apple-system,BlinkMacSystemFont,
             "Songti SC","STSong","Songti TC","PingFang SC",
             "Helvetica Neue",Arial,sans-serif;
  /* PDF 字号 11.05pt, 行高 22.75pt; ×(46px/22.75pt)≈22px */
  --fs-tbl:22px;
  --badge1-bg:rgba(120,120,128,.14); --badge1-fg:#6e6e73;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000; --card:#1c1c1e; --text:#f2f2f7; --text2:#98989d;
    --sep:rgba(84,84,88,.5);
    --bar-solid:#000;
    --blue:#0a84ff; --blue-tint:rgba(10,132,255,.2);
    --red:#ff6961;
    --zebra-a:#1c1c1e; --zebra-b:#2c2c2e;
    --press-bg:#3a3a3c;
    --tbl-line:rgba(84,84,88,.65); --tbl-border:#8e8e93;
    --badge1-bg:rgba(120,120,128,.28); --badge1-fg:#a1a1a6;
  }
}
html{
  background:var(--bg);
  /* 始终为滚动条预留空间：切换收藏视图时内容高度会从数万像素变成不足一屏，
     否则滚动条消失会让内容宽度突变 */
  scrollbar-gutter:stable;
  height:100%;
}
body{
  margin:0;background:var(--bg);color:var(--text);
  height:100%;
  /* 页面本身不滚动：滚动全部发生在 #listwrap 内，
     顶栏因此不需要 fixed/sticky，彻底避免 iOS 上 fixed 层“补画”造成的闪烁 */
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;touch-action:manipulation;
}
/* 顶栏 + 提示条 + 滚动区 的纵向布局 */
#app{
  display:flex;flex-direction:column;
  height:100vh;height:100dvh;
  overflow:hidden;
}
#listwrap{
  flex:1 1 auto;min-height:0;
  /* 独立层叠上下文：把表格的所有重绘关在滚动容器内，
     避免大规模 DOM 变化（切换收藏/三态）时与顶栏的绘制交错 */
  position:relative;z-index:0;
  isolation:isolate;
  overflow-y:auto;overflow-x:hidden;
  /* 注意：不要加 -webkit-overflow-scrolling:touch —— iOS 13+ 默认就有惯性滚动，
     该属性反而会创建特殊的滚动合成层，导致内容闪/层破裂 */
  overscroll-behavior:contain;
  scrollbar-gutter:stable;
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}

/* ---------- 顶栏 ---------- */
/* 顶栏在 #app 的 flex 流里，页面本身不滚动（滚动发生在 #listwrap）。
   背景用**具体色值**而不是 CSS 变量：iOS 上变量背景在重绘时需要重新解析，
   偶发出现“先透明、后填充”的一帧。 */
#topbar{
  position:relative;z-index:30;flex:0 0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top) + 8px) clamp(36px,8vw,112px) 10px;
  background:#f2f2f7;
  border-bottom:.5px solid var(--sep);
  /* 让顶栏成为最后一个绘制的“普通”元素：不建合成层，避免与滚动层抢顺序 */
  -webkit-transform:none;transform:none;
}
@media (prefers-color-scheme:dark){
  #topbar{background:#000}
}
#topbar h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.01em}
#sub{display:block;font-size:12px;color:var(--text2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{
  width:38px;height:38px;border-radius:50%;border:none;padding:0;
  background:var(--blue-tint);color:var(--blue);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.icon-btn svg{display:block}
.icon-btn:active{transform:scale(.94)}
.icon-btn.on{background:var(--blue);color:#fff}
.topbar-actions{display:flex;align-items:center;gap:10px}

/* ---------- 提示条 ---------- */
#banner{
  flex:0 0 auto;
  background:rgba(255,159,10,.16);padding:10px clamp(36px,8vw,112px);font-size:13px;line-height:1.45;
  border-bottom:.5px solid var(--sep);cursor:pointer;
}

/* ---------- PDF 对应字体（unicode-range 分段映射） ----------
   PDF 原文：西文 Segoe UI + 中文 SimSun（宋体），11.05pt，regular
   Apple 对应：西文 SF / Helvetica Neue + 中文 Songti SC（宋体）
   分段映射可保证中西文各自使用对应字体，而非统一 fallback */
@font-face{
  font-family:"PdfTable";
  src:local("Segoe UI"),local("SF Pro Text"),local("Helvetica Neue");
  unicode-range:U+0000-024F,U+0250-02FF,U+0300-036F,U+1E00-1EFF,U+2000-206F,U+2100-214F;
}
@font-face{
  font-family:"PdfTable";
  src:local("SimSun"),local("Songti SC"),local("STSong"),local("Songti TC"),local("Noto Serif CJK SC");
  unicode-range:U+3000-303F,U+3400-4DBF,U+4E00-9FFF,U+FF00-FFEF;
}

/* ---------- 单词表格：完全还原 PDF 结构 ----------
   PDF 实测参数（fitz 解析，A4 595.3×841.9pt）：
     · 左右外框竖线：#000000，0.72pt，2 条、贯穿整表
     · 横分割线：#999999，0.72pt（表顶 + 每行之间 + 表底）
     · 行底色：#FFFFFF / #E6E6E6 交错；行高 22.75pt；表宽 459.3pt
     · 字体：Segoe UI（西文）+ SimSun（中文）；11.05pt；regular（全篇无粗体）
   线宽换算：0.72pt / 22.75pt ≈ 3.2% → 行高 46px 时 ≈ 1.5px。
   字号换算：11.05pt × (46 / 22.75) ≈ 22px → --fs-tbl
   左列宽度：最长单词 notwithstanding 158px + 角标 ≈42px + 间距 ≈ 240px 下限
   实现：竖线画在 .tbl 容器（与 PDF 的 2 条竖线一一对应）；
         横线画在每行底部（+首行顶部），用渐变绘制以保证亚像素精度。 */
#list{
  position:relative;z-index:0;   /* 隔离表格内部的层叠，确保永远在 fixed 顶栏之下 */
  max-width:1180px;margin:0 auto;
  padding:0 clamp(36px,8vw,112px) calc(60px + env(safe-area-inset-bottom));
}
.tbl{position:relative}
/* 表格线统一用渐变背景绘制（与 PDF 一致：0.72pt ≈ 1.5px）：
   · 左右竖线：#000，每行各画 1.5px，叠加成贯穿 Unit 的竖线
   · 行间横线：#999
   与上下边线同机制绘制，保证各 DPR 下粗细表现一致 */
.row{
  /* 三列：单词 | 音标+释义 | 按钮组（按钮独立成列，便于手机端改为跨行布局） */
  display:grid;grid-template-columns:clamp(240px,24%,300px) 1fr auto;height:46px;
  font-family:var(--font-tbl);font-size:var(--fs-tbl);font-weight:400;
  background-color:var(--zebra-a);
  background-image:
    linear-gradient(var(--tbl-border),var(--tbl-border)),
    linear-gradient(var(--tbl-border),var(--tbl-border)),
    linear-gradient(var(--tbl-line),var(--tbl-line));
  background-size:1.5px 100%,1.5px 100%,100% 1.5px;
  background-position:left top,right top,left bottom;
  background-repeat:no-repeat;
  cursor:pointer;-webkit-user-select:none;user-select:none;overflow:hidden;
}
/* 每 50 词一个 Unit：区块之间留空，左上标注 Unit N + 下方装饰断线 */
.page-sep{
  position:relative;
  height:34px;display:flex;align-items:flex-start;justify-content:flex-start;
  padding:6px 0 0 2px;
  background:transparent;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
  font-size:13px;font-weight:600;letter-spacing:.05em;color:var(--text2);
}
/* Unit 标签下方的短横线：一条短实线，与标签左对齐，长度适中 */
.page-sep::after{
  content:"";position:absolute;left:2px;bottom:8px;width:44px;height:1.5px;
  background:var(--tbl-line);border-radius:1px;
}
/* Unit 栏右侧的「文章」按钮 */
.sep-art{
  position:absolute;right:2px;top:4px;
  display:inline-flex;align-items:center;height:24px;padding:0 11px;border-radius:12px;
  border:.5px solid var(--sep);background:var(--card);color:var(--blue);
  font-size:12px;font-weight:600;letter-spacing:.02em;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.sep-art:active{transform:scale(.95)}
/* Unit 首行：顶部边线（#000，1.5px，与侧边同粗细）+ 左右竖线 + 底部行线 */
.unit-body>.row:first-child{
  background-image:
    linear-gradient(var(--tbl-border),var(--tbl-border)),
    linear-gradient(var(--tbl-border),var(--tbl-border)),
    linear-gradient(var(--tbl-border),var(--tbl-border)),
    linear-gradient(var(--tbl-line),var(--tbl-line));
  background-size:1.5px 100%,1.5px 100%,100% 1.5px,100% 1.5px;
  background-position:left top,right top,left top,left bottom;
}
/* Unit 末行：底部边线（#000，1.5px，与侧边同粗细）+ 左右竖线 */
.unit-body>.row:last-child{
  background-image:
    linear-gradient(var(--tbl-border),var(--tbl-border)),
    linear-gradient(var(--tbl-border),var(--tbl-border)),
    linear-gradient(var(--tbl-border),var(--tbl-border));
  background-size:1.5px 100%,1.5px 100%,100% 1.5px;
  background-position:left top,right top,left bottom;
}
/* 单行 Unit（如收藏视图只有一个词）：同时需要上边线与下边线 */
.unit-body>.row:first-child:last-child{
  background-image:
    linear-gradient(var(--tbl-border),var(--tbl-border)),
    linear-gradient(var(--tbl-border),var(--tbl-border)),
    linear-gradient(var(--tbl-border),var(--tbl-border)),
    linear-gradient(var(--tbl-border),var(--tbl-border));
  background-size:1.5px 100%,1.5px 100%,100% 1.5px,100% 1.5px;
  background-position:left top,right top,left top,left bottom;
}
/* 手机竖屏（≤600px）的所有覆盖规则统一放在样式表末尾（见文件结尾），
   避免被后面的桌面同特异性规则按层叠顺序覆盖 */
.row.alt{background-color:var(--zebra-b)}
.row:active{background-color:var(--press-bg)}
/* 默认显示模式：所有行直接显示内容（滚动懒加载填充） */
body.defshow .row .cell-d{display:flex}
/* 两侧显隐（点击独立切换；均保留列宽；读音按钮常显、不参与切换）：
   · .whide = 隐藏左侧单词
   · .rhide = 隐藏右侧（音标+词性+翻译）
   三态模式 = 给所有行批量设置这两个类（left→rhide；right→whide；both→无）
   注：用 opacity 而非 visibility —— iPad Safari 上 visibility 切换偶发不重绘
   （需切屏回来才显示），opacity 为合成属性，配合 applyModeToRows 的强制 reflow 稳定刷新 */
.row.whide .cell-w .w{opacity:0}
.row.rhide .d-flow{opacity:0}
/* 左列右侧分隔线（单词|释义 之间）：与行间线同色，加强表格感 */
.cell-w{
  display:flex;align-items:center;gap:8px;padding:0 12px;min-width:0;
  background-image:linear-gradient(var(--tbl-line),var(--tbl-line));
  background-size:1.5px 100%;
  background-position:right top;
  background-repeat:no-repeat;
}
/* 语音按钮前的计数/时间已移除；按钮紧跟在释义之后 */
.d-flow{flex:1 1 auto;display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden}
/* 按钮组：行内独立一列，常显（不随释义显隐变化）；手机上跨两行排在右上。
   左右 padding 与原来的 .cell-d 间距保持一致（释义与按钮之间 8px） */
.row-btns{display:flex;flex:0 0 auto;align-items:center;gap:8px;padding:0 8px}
.cell-w .w{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 点击次数默认隐藏（顶栏按钮切换 body.showcounts 后显示） */
.badge{
  display:none;flex:0 0 auto;margin-left:auto;min-width:34px;text-align:center;font-size:13px;font-weight:600;
  padding:2px 7px;border-radius:10px;background:var(--badge1-bg);color:var(--badge1-fg);
}
body.showcounts .badge:not(:empty){display:inline-block}
.cell-d{display:none;align-items:center;gap:8px;padding:0 0 0 12px;min-width:0}
.row.open .cell-d{display:flex;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.d-flow{flex:1 1 auto;display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden}
.d-phon{flex:0 0 auto;color:var(--text2)}
.d-defs{flex:0 1 auto;display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden}
.def-line{display:flex;align-items:baseline;gap:5px;min-width:0}
.def-line .def{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 词性与读音同格式：普通灰色文本，不做特殊强调 */
.pos{flex:0 0 auto;color:var(--text2)}
/* 已移除 .d-meta（语音按钮前的计数/时间文字） */
/* 读音按钮：锁定在最右（不被计数文本宽度影响） */
.speak{
  flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;
  background:var(--blue-tint);color:var(--blue);
  display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;
}
.speak svg{width:17px;height:17px}
.speak:active{transform:scale(.92)}
/* 收藏按钮（放在读音按钮旁，样式一致；已收藏时星标填充为实心蓝色） */
.star{
  flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;
  background:var(--blue-tint);color:var(--blue);
  display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;
}
.star svg{width:17px;height:17px}
.star:active{transform:scale(.92)}
.star.on svg path{fill:currentColor}
/* 收藏视图里刚取消收藏、行暂时保留（下次进入收藏视图才消失） */
.row.unfav-pending{opacity:.45}
.row.unfav-pending .star{opacity:1}
/* 词根按钮（与读音/收藏同款，放在收藏左侧） */
.root-btn{
  flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;
  background:var(--blue-tint);color:var(--blue);
  display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;
}
.root-btn svg{width:17px;height:17px}
.root-btn:active{transform:scale(.92)}

/* ---------- 词根词缀气泡窗口 ---------- */
#root-pop{
  position:fixed;z-index:70;width:min(420px, calc(100vw - 32px));
  background:var(--card);color:var(--text);
  border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.22);
  border:.5px solid var(--sep);
  padding:14px 16px 16px;display:none;
}
body.root-open #root-pop{display:block}
/* 小三角（指向按钮，水平位置由 --ax 控制） */
#root-pop::after{
  content:"";position:absolute;width:12px;height:12px;
  left:var(--ax, 50%);margin-left:-6px;
  background:var(--card);border-right:.5px solid var(--sep);border-bottom:.5px solid var(--sep);
  transform:rotate(45deg);
}
#root-pop.below::after{ top:-7px;border:none;border-left:.5px solid var(--sep);border-top:.5px solid var(--sep); }
#root-pop.above::after{ bottom:-7px; }
.rp-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.rp-word{font-size:19px;font-weight:700;letter-spacing:.01em}
.rp-phon{font-size:13px;color:var(--text2)}
.rp-parts{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap}
.rp-plus{align-self:center;color:var(--text2);font-size:15px;font-weight:600;padding:0 2px}
.rp-part{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:60px;padding:8px 10px;border-radius:10px;text-align:center;
}
.rp-part .rp-form{font-size:15.5px;font-weight:700;line-height:1.2;word-break:break-all}
.rp-part .rp-mean{font-size:11.5px;line-height:1.35;margin-top:4px;opacity:.85}
.rp-part.tp-p{background:rgba(0,122,255,.12);color:#0a63c9}
.rp-part.tp-r{background:rgba(52,199,89,.14);color:#1f7a3d}
.rp-part.tp-s{background:rgba(255,149,0,.14);color:#a35c00}
.rp-part.tp-st{background:rgba(120,120,128,.14);color:var(--text2)}
@media (prefers-color-scheme:dark){
  .rp-part.tp-p{color:#6cb2ff}
  .rp-part.tp-r{color:#5fd47f}
  .rp-part.tp-s{color:#ffb340}
}
.rp-tip{margin-top:11px;font-size:11.5px;color:var(--text2);line-height:1.5}
.rp-tip:empty{display:none}
.rp-legend{display:flex;gap:12px;font-size:11px;color:var(--text2)}
.rp-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.rp-empty{font-size:13.5px;color:var(--text2);line-height:1.6}

/* ---------- 侧边 Unit 导航（刻度点阵） ----------
   29 个 Unit 用「点 + 刻度」表示：每个 Unit 一个小圆点，每 5 项一个较大的
   刻度点，当前项是一条竖向胶囊。一屏即可放下全部 Unit，几乎不占横向空间，
   与 PDF 复刻的细线表格风格一致。
   窄屏（≤560px）自动折叠为左下角按钮 + 文字列表抽屉（规则见样式表末尾）。 */
#nav-toggle{
  position:fixed;left:8px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:22;
  display:none;box-shadow:0 4px 14px rgba(0,0,0,.18);
}
#unit-nav{
  position:fixed;left:10px;top:50%;transform:translateY(-50%);z-index:20;
  width:32px;
  max-height:min(78vh,700px);overflow-y:auto;overflow-x:hidden;
  /* 不加 -webkit-overflow-scrolling：fixed + 该属性会额外建滚动合成层，
     iPad 上容易与指示条的 transform 抢绘制顺序（残影/闪烁） */
  overscroll-behavior:contain;
  padding:6px 0;background:transparent;
  --pill-y:0px;                        /* 当前 Unit 指示条的位移（由 JS 更新） */
}
/* 只有真的能滚动时才加“上下渐隐”，否则首尾的点会被无谓地淡化 */
#unit-nav.can-scroll{
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 10px,#000 calc(100% - 10px),transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0,#000 10px,#000 calc(100% - 10px),transparent 100%);
}
#unit-nav::-webkit-scrollbar{width:0}
#unit-nav.empty{display:none}
/* 贯穿所有点的细竖线 */
#unit-nav::before{
  content:"";position:absolute;left:50%;top:10px;bottom:10px;width:1px;
  margin-left:-.5px;background:var(--text2);opacity:.18;pointer-events:none;
}
/* 唯一的「当前 Unit」指示条：整条导航里只有这一个元素，
   靠 transform 移动（合成器动画，不触发重绘）—— iOS 上不会留下多条残影 */
.un-pill{
  position:absolute;left:50%;top:6px;margin-left:-1.5px;
  width:3px;height:17px;border-radius:2px;background:var(--blue);
  transform:translateY(var(--pill-y));
  transition:transform .18s cubic-bezier(.32,.72,0,1);
  will-change:transform;pointer-events:none;z-index:1;
}
.un-item{
  position:relative;display:flex;align-items:center;justify-content:center;
  width:100%;height:21px;padding:0;margin:0;border:none;background:none;
  cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none;
}
.un-item::before{                     /* 视觉圆点 */
  content:"";
  width:5px;height:5px;border-radius:50%;
  background:var(--text2);opacity:.42;
  transition:opacity .18s,background .18s;
}
.un-item.major::before{                /* 每 5 个 Unit：稍大 */
  width:6px;height:6px;opacity:.62;
}
.un-item:not(.on):hover::before,.un-item:not(.on):focus-visible::before{
  opacity:.95;
}
/* 当前 Unit 的圆点让位给指示条 */
.un-item.on::before{opacity:0}
/* 「只看收藏」视图里不存在的 Unit：变淡且不可点 */
.un-item.off{opacity:.25;pointer-events:none}
/* 悬停/聚焦时右侧浮出的编号标签 */
#un-tip{
  position:fixed;z-index:23;transform:translateY(-50%);
  padding:3px 7px;border-radius:7px;pointer-events:none;
  background:rgba(28,28,30,.9);color:#fff;
  font:600 11px/1.25 -apple-system,BlinkMacSystemFont,"PingFang SC",Arial,sans-serif;
  letter-spacing:.02em;white-space:nowrap;
  opacity:0;transition:opacity .12s;
}
#un-tip.show{opacity:1}
@media (prefers-color-scheme:dark){
  #un-tip{background:rgba(235,235,245,.92);color:#000}
}
/* 抽屉里的文字（桌面点阵模式隐藏） */
.un-label{display:none}
/* 收藏视图（仅收藏词）空态提示 */
.tbl-empty{padding:60px 0;text-align:center;color:var(--text2);font-size:15px;line-height:1.8}

/* ---------- Unit 文章页 ---------- */
#art{
  position:fixed;inset:0;z-index:60;background:var(--bg);
  display:flex;flex-direction:column;
  transform:translateX(100%);visibility:hidden;
  transition:transform .28s cubic-bezier(.32,.72,0,1), visibility 0s linear .28s;
}
body.art-open #art{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.32,.72,0,1)}
.art-head{
  flex:0 0 auto;display:flex;align-items:center;gap:14px;
  padding:calc(env(safe-area-inset-top) + 10px) clamp(16px,5vw,64px) 10px;
  border-bottom:.5px solid var(--sep);background:var(--bg);
}
#art-back{
  flex:0 0 auto;border:none;background:none;color:var(--blue);
  font:600 16px/1 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
  padding:6px 2px;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.art-meta{display:flex;flex-direction:column;line-height:1.25;min-width:0}
#art-unit{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text2)}
#art-name{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art-body{
  flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;
  padding:20px clamp(20px,7vw,96px) calc(40px + env(safe-area-inset-bottom));
}
.art-body p{margin:0}
/* 需要比 .art-body p 更高优先级，否则 margin 被覆盖成 0 */
.art-body p.art-en{margin:0 0 1.9em}   /* ≈ 一行（line-height 1.95）空白 */
.art-body p.art-zh{margin:0 0 1.6em}
.art-en{
  /* 与下方译文之间留出约一行（行高 1.95）的空白 */
  margin:0 0 1.9em;
  font:19px/1.95 Georgia,"Songti SC","Times New Roman",serif;color:var(--text);
}
.art-zh{
  margin:0 0 1.6em;
  font:16px/2 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--text2);
}
.art-ph{font:15px/1.9 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--text2);margin:0}
/* 英文段里的目标词：只保留下划线，不改变颜色 */
.art-w{
  color:inherit;text-decoration:underline;text-decoration-thickness:1px;
  text-underline-offset:3px;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.art-w:active{background:var(--blue-tint);border-radius:4px}
/* 译文里的对应词：不标蓝、不加下划线（不抢阅读），仍可点开释义 */
.art-tw{
  text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
#art-tip{
  position:fixed;z-index:80;display:none;width:min(360px,calc(100vw - 32px));
  background:var(--card);color:var(--text);border:.5px solid var(--sep);
  border-radius:14px;box-shadow:0 10px 34px rgba(0,0,0,.24);padding:12px 14px 13px;
}
body.art-tip-open #art-tip{display:block}
.at-head{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.at-head b{font-size:17px}
.at-phon{font-size:13px;color:var(--text2)}
.at-defs{font-size:14.5px;line-height:1.68}
.at-def{margin:2px 0}
.at-def .pos{color:var(--text2);margin-right:6px;font-style:italic}


/* ---------- 统计面板（底部弹层） ---------- */
#sheet-scrim{
  position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;
  opacity:0;pointer-events:none;transition:opacity .28s;
}
body.sheet-open #sheet-scrim{opacity:1;pointer-events:auto}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--bg);border-radius:18px 18px 0 0;
  max-height:86vh;max-height:86dvh;display:flex;flex-direction:column;
  transform:translateY(110%);transition:transform .32s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -10px 40px rgba(0,0,0,.2);
}
body.sheet-open #sheet{transform:none}
.s-head{display:flex;flex:0 0 auto;align-items:center;justify-content:space-between;padding:14px 18px 6px}
.s-head h2{margin:0;font-size:17px;font-weight:700}
.s-done{border:none;background:none;color:var(--blue);font-size:16px;font-weight:600;cursor:pointer;padding:6px 2px}
.s-body{flex:1 1 auto;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 18px 12px}
.s-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 14px}
.s-card{background:var(--card);border-radius:14px;padding:12px 10px;text-align:center}
.s-num{font-size:22px;font-weight:700;letter-spacing:-.02em}
.s-lab{font-size:12px;color:var(--text2);margin-top:3px}
.chips{display:flex;gap:8px;margin:4px 0 10px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.chip{
  flex:0 0 auto;border:none;background:var(--card);color:var(--text);
  font-size:14px;font-weight:600;padding:7px 14px;border-radius:16px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.chip.on{background:var(--blue);color:#fff}
.chips-lab{font-size:12px;color:var(--text2);margin:8px 0 2px}
.s-cap{font-size:12px;color:var(--text2);margin:2px 0 8px;line-height:1.5}
.r-row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:.5px solid var(--sep);cursor:pointer}
.r-row:active{background:rgba(120,120,128,.1)}
.r-idx{flex:0 0 26px;font-size:13px;color:var(--text2);text-align:right}
.r-w{flex:1 1 auto;font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-c{flex:0 0 auto;font-size:13px;font-weight:700;color:var(--text2);min-width:34px;text-align:right}
.r-t{flex:0 0 auto;font-size:12px;color:var(--text2);min-width:40px;text-align:right}
.r-empty{padding:26px 0;text-align:center;color:var(--text2);font-size:14px}
.s-foot{
  flex:0 0 auto;border-top:.5px solid var(--sep);
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:12px;background:var(--bg);
}
.switch-line{display:flex;align-items:center;justify-content:space-between;font-size:14px;cursor:pointer}
.switch{position:relative;flex:0 0 auto;width:50px;height:30px}
.switch input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:2}
.switch .knob{position:absolute;inset:0;border-radius:15px;background:rgba(120,120,128,.32);transition:background .2s}
.switch .knob::before{
  content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;
  background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .2s;
}
.switch input:checked + .knob{background:#34c759}
.switch input:checked + .knob::before{transform:translateX(20px)}
.s-actions{display:flex;gap:10px}
.s-btn{
  flex:1 1 0;border:none;border-radius:12px;background:var(--card);color:var(--text);
  font-size:14px;font-weight:600;padding:11px 0;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.s-btn:active{transform:scale(.97)}
.s-btn.danger{color:var(--red)}
.s-btn.primary{background:var(--blue);color:#fff}

/* ---------- 导入 / 导出浮层 ---------- */
#io{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.45)}
body.io-open #io{display:flex}
.io-card{
  width:min(560px,100%);max-height:86vh;max-height:86dvh;background:var(--bg);border-radius:18px;
  padding:18px;display:flex;flex-direction:column;gap:10px;
}
.io-card h3{margin:0;font-size:17px}
.io-hint{margin:0;font-size:12.5px;color:var(--text2);line-height:1.5}
#io-text{
  width:100%;flex:1 1 auto;min-height:180px;resize:none;border-radius:12px;border:.5px solid var(--sep);
  background:var(--card);color:var(--text);
  font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:10px;
}
.io-btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.io-btns .s-btn{flex:0 0 auto;padding:11px 18px}

/* ---------- 云同步（设置浮层 + 统计面板状态行） ---------- */
#sync{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.45)}
body.sync-open #sync{display:flex}
#sync .io-card{width:min(460px,100%)}
#sync .io-card h3{margin:0;font-size:17px}
.sync-field{display:flex;align-items:center;gap:10px;font-size:13.5px}
.sync-field>span{flex:0 0 54px;color:var(--text2)}
.sync-field input{
  flex:1 1 auto;min-width:0;border:.5px solid var(--sep);border-radius:10px;background:var(--card);
  color:var(--text);font-size:14px;padding:9px 10px;
}
.sync-line{display:flex;align-items:center;gap:10px}
.sync-line .s-btn{flex:0 0 auto;padding:11px 16px}
.sync-status{flex:1 1 auto;min-width:0;font-size:12.5px;color:var(--text2);line-height:1.4}
.sync-status.ok{color:#34c759}
.sync-status.err{color:var(--red)}

/* ---------- Toast ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));z-index:70;
  transform:translateX(-50%) translateY(16px);opacity:0;pointer-events:none;
  background:rgba(28,28,30,.92);color:#fff;font-size:13.5px;
  padding:9px 16px;border-radius:20px;max-width:80vw;text-align:center;
  transition:opacity .25s,transform .25s;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-color-scheme:dark){#toast{background:rgba(235,235,245,.95);color:#000}}

/* ================= 手机竖屏（≤600px）覆盖规则 =================
   ⚠️ 必须放在样式表末尾：媒体查询本身不提升优先级，
   写在前面会被后面的桌面同特异性规则覆盖（如 .row-btns、按钮尺寸）。
   布局改为「单词行 + 释义行」两行卡片：
   原两列布局（左列 150px + 右侧按钮 ~140px）在 390px 竖屏下会把释义
   挤到只剩约 30px 几乎不可见；现改为单词独占第一行、三个按钮独立成列
   排在右上、音标+释义在第二行可换行完整显示（行高自适应，
   惰性渲染已改为按实际几何位置测量）。 */
@media (max-width:600px){
  :root{--fs-tbl:16px}
  /* 收窄页面左右留白（原 clamp 下限 36px 在手机上占掉近 1/5 宽度） */
  #topbar,#banner{padding-left:14px;padding-right:14px}
  #list{padding-left:12px;padding-right:12px}

  .row{
    grid-template-columns:1fr auto;grid-template-areas:"w b" "d b";
    column-gap:6px;height:auto;min-height:54px;padding:7px 8px 8px 10px;
  }
  .cell-w{grid-area:w;padding:0;background-image:none;min-height:24px}
  .cell-w .w{font-size:17px;font-weight:600;letter-spacing:.01em}
  /* 释义行：可换行完整显示（桌面为单行省略） */
  body.defshow .row .cell-d,.row.open .cell-d{grid-area:d;display:block;padding:1px 0 0;min-height:20px}
  .d-flow{display:block;white-space:normal;overflow:visible;font-size:15px;line-height:1.35}
  .d-phon{display:inline;margin-right:6px;font-size:13.5px}
  .d-defs{display:inline}
  .def-line{display:inline;margin-right:9px}
  .def-line .def{white-space:normal;overflow:visible;text-overflow:clip}
  /* 按钮组：右上角与单词同行（3×32 + 2×5 = 106px，触控尺寸与桌面一致） */
  .row-btns{grid-area:b;align-self:start;gap:5px;padding:0}
  .root-btn,.star,.speak{width:32px;height:32px}
  .root-btn svg,.star svg,.speak svg{width:16px;height:16px}
}

/* ================= 窄屏（≤560px）：Unit 点阵折叠为文字抽屉 =================
   手机竖屏空间太小，点阵热区也不够准 → 左下角悬浮按钮 + 竖排文字列表
   （1-unit / 2-unit…），点击后自动收起。
   ⚠️ 同样必须放在样式表末尾（媒体查询不提升优先级）。 */
@media (max-width:560px){
  #nav-toggle{display:flex}
  #unit-nav{
    left:8px;right:auto;bottom:calc(76px + env(safe-area-inset-bottom));
    top:auto;transform:none;width:auto;
    max-height:52vh;display:none;z-index:21;padding:6px;border-radius:14px;
    background:var(--bar-solid);border:.5px solid var(--sep);
    box-shadow:0 8px 28px rgba(0,0,0,.22);
    -webkit-mask-image:none;mask-image:none;
  }
  #unit-nav::before{display:none}
  .un-pill{display:none}
  body.nav-open #unit-nav{display:block}
  .un-item{
    display:flex;align-items:center;justify-content:center;
    width:66px;height:auto;padding:7px 6px;border-radius:8px;
  }
  .un-item::before{display:none}
  .un-label{display:block;font-size:11px;font-weight:600;color:var(--text2);white-space:nowrap}
  .un-item.on{background:var(--blue)}
  .un-item.on .un-label{color:#fff}
  .un-item.off{display:none}
  #un-tip{display:none}
}
</style>

<body>

<div id="app">

<header id="topbar">
  <div>
    <h1>1500词</h1>
    <span id="sub">加载中…</span>
  </div>
  <div class="topbar-actions">
    <button id="btn-counts" class="icon-btn" aria-label="显示点击次数" title="显示/隐藏点击次数">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16M4 15h16M10 3L8 21M16 3l-2 18"/></svg>

11":[["p","sin-","无（sine）"],["r","cer","蜡（cera）"],["s","-e","词尾"]],"1413":[["p","al-","朝向（ad 变体）"],["r","leg","派遣（legare）"],["s","-e","词尾"]],"1414":[["r","vit","生命（vita）"],["s","-al","后缀（…的/名词化）"]],"1416":[["p","en-","使…"],["r","hance","高（hauts）"]],"1417":[["r","seiz","抓（saisir）"],["s","-e","词尾"]],"1419":[["p","dis-","分开"],["r","sert","连接/论述（serere）"],["s","-ation","名词后缀（行为/状态）"]],"1424":[["r","liber","自由"],["s","-ate","动词后缀（使…）"]],"1426":[["r","commun","共同（communis）"],["s","-icate","动词后缀（使…）"]],"1428":[["p","en-","使…"],["r","sure","确定"]],"1430":[["p","re-","反"],["r","fut","击（futare）"],["s","-e","词尾"]],"1432":[["r","remn","留下（remanere 缩略）"],["s","-ant","名词后缀（…者/物）"]],"1433":[["r","domin","主人（dominus）"],["s","-ate","动词后缀（使…）"]],"1434":[["r","dam","损失（damnum）"],["s","-age","名词后缀（行为/集合）"]],"1435":[["p","de-","去除"],["r","fic","做"],["s","-ient","形容词后缀（…的）"]],"1436":[["p","re-","再"],["r","nov","新"],["s","-ate","动词后缀（使…）"]]},"articles":{"1":{"title":"The Porcelain Town","paras":[{"en":"The town's museum stood beside an old industrial kiln and a memorial to local potters. Inside, smoke stains marked the ceiling, and a clock's pendulum still swung. Once busy with frequent school visits, the building now attracted few people. One morning, as fog surrounded it, workers discovered a piece of porcelain: a fragile jar buried in a deposit of raw clay nearby. Its mysterious origin gave the curator an idea for a new exhibition.","zh":"小镇的博物馆坐落在一座旧[[industrial|工业]]窑炉和当地陶工的[[memorial|纪念碑]]旁。馆内[[ceiling|天花板]]留着烟熏痕迹，时钟的[[pendulum|钟摆]]仍在摆动。这里曾因学校[[frequent|频繁的]]参观而热闹，如今却少有人来。一天清晨，[[fog|雾]]笼罩着建筑，工人在附近一处[[raw|未经加工的]]黏土[[deposit|沉积物]]中发现了一件[[porcelain|瓷器]]：一只[[fragile|易碎的]]罐子。它[[mysterious|神秘的]]来历让馆长萌生了举办新展览的想法。"},{"en":"She wanted to give an account of the town's evolution and capture surviving traces of its past in photographs. Her hypothesis was that visitors considered the pottery outdated. To test this notion, she asked her team to compile a catalog of every specimen and select pieces for discussion. The feedback surprised her: visitors liked the objects but found the labels confusing. The exhibition needed to highlight the people behind the pottery.","zh":"她想对小镇的[[evolution|演变]]作出[[account|描述]]，并用照片[[capture|捕捉]]残存的历史痕迹。她的[[hypothesis|假说]]是：观众认为这些陶瓷已经[[outdated|过时]]。为了检验这一[[notion|看法]]，她请团队[[compile|汇编]]涵盖每件[[specimen|标本]]的目录，并[[select|挑选]]展品供人讨论。[[feedback|反馈]]令她意外：观众喜欢器物，却觉得说明文字难懂。展览需要[[highlight|突出]]陶瓷背后的人。"},{"en":"Families offered letters and memories. Many felt indebted to the potters who had taught them their craft. The curator asked staff to listen, not interrogate donors as though they were suspects. Some wanted scenes from historical fiction included as facts, but she would not appease them at the expense of accuracy. She set aside premature conclusions until supporting evidence could be found.","zh":"各家提供了书信和回忆。许多人对传授自己手艺的陶工充满[[indebted|感激]]。馆长请员工倾听，不要像对待嫌疑人一样[[interrogate|审问]]捐赠者。有些人希望把历史[[fiction|小说]]里的场景当作事实写入，但她不愿牺牲准确性来[[appease|安抚]]他们。在找到佐证前，她将[[premature|尚未成熟的]]结论暂时搁置。"},{"en":"Meanwhile, the fragile jar needed professional care. The museum therefore adopted a policy to curb rushed repairs and concentrate on the conventional practices that underlie careful restoration. Before specialists could transfer the jar to their workshop, they had to choose packing materials compatible with its delicate surface. They placed it in a padded plastic crate and used a soft sheet to cover it. Watching it depart, the curator worried that a long delay might cause the team's enthusiasm to evaporate.","zh":"与此同时，这只[[fragile|易碎的]]罐子需要专业养护。博物馆[[therefore|因此]]确立一项[[policy|方针]]：[[curb|抑制]]仓促修补，把精力[[concentrate|集中]]在[[conventional|传统的]]操作上，这些操作为细致修复[[underlie|奠定基础]]。将罐子[[transfer|转移]]到工作室前，专家必须选择与其脆弱表面[[compatible|相容的]]包装材料。他们把罐子放进带衬垫的[[plastic|塑料的]]箱子，用柔软布单[[cover|覆盖]]它。看着罐子[[depart|离开]]，馆长担心漫长的等待会让团队的[[enthusiasm|热情]]逐渐[[evaporate|消失]]。"},{"en":"A fortunate conjunction of school holidays and a local history festival kept the project moving. Staff could inform families about workshops and involve children in writing clearer labels. The students learned to underline key facts and explain unfamiliar terms. Those afraid of breaking something worked with replicas first, which helped them conquer their fear. Staff could reassure them that these activities would not disturb the original collection in secure storage.","zh":"学校假期与地方历史节幸运地[[conjunction|同时发生]]，使项目得以继续推进。员工可以把实践活动的消息[[inform|通知]]各家，让孩子们[[involve|加入]]编写更清楚的展品说明的工作。学生学习把关键事实[[underline|画底线标出]]，并解释陌生术语。害怕打碎东西的人先用复制品练习，这帮助他们[[conquer|战胜]]恐惧。员工能够[[reassure|使他们安心]]：这些活动不会[[disturb|干扰]]存放在[[secure|安全的]]库房中的原有藏品。"},{"en":"When the jar returned, the museum placed it beside photographs and records of the people who had worked at the kiln. It came to symbolize their skill and patience. In consequence, visitors could finally connect the objects with familiar names and places. Attendance rose, and the curator understood why: the town had never stopped caring about its past; the museum had simply needed to make that past understandable.","zh":"罐子修复归来后，博物馆将它与曾在窑场工作的人们的照片和档案放在一起展示。它由此开始[[symbolize|象征]]那些工匠的技艺与耐心。[[consequence|结果]]，观众终于能够将眼前的器物与熟悉的人名、地点联系起来。参观人数增加了，馆长也明白了原因：小镇居民从未停止关心自己的过去，博物馆需要做的，是让那段过去变得容易理解。"}]},"2":{"title":"The Campus Campaign","paras":[{"en":"A coalition of student groups met in a campus restaurant with an ambition: to organize a fair about healthy, affordable living. They wanted to assemble a team and find an economical method that was feasible on a small budget. The school board chose to delay its decision, then agreed to authorize the event. One member made a useful remark: a decent plan should help students maintain new habits after the fair ended.","zh":"一个由学生团体组成的[[coalition|联盟]]在[[campus|校园]]的[[restaurant|餐厅]]碰面，怀着一个[[ambition|雄心]]：举办介绍健康、节俭生活的活动。他们想[[assemble|集合]]一支团队，找到一种[[economical|节约的]]、在有限预算下也[[feasible|可行的]][[method|方法]]。学校[[board|董事会]]选择先[[delay|延迟]]决定，随后同意[[authorize|批准]]活动。一位成员给出了有用的[[remark|评论]]：一个[[decent|像样的]]方案应帮助学生在活动结束后继续[[maintain|维持]]新习惯。"},{"en":"The organization invited different departments to cooperate and contribute their expertise. Instead of long lectures, visitors could examine a leaf through a microscope, watch a delicate paper model unfold, and comment on displays about diabetes or infant care. A garden exhibit explained how pesticide use could harm the habitat of insects. Furthermore, a fashion club invited visitors to clear out a wardrobe and exchange unwanted clothes. Its flexible rules allowed each visitor to bring either clothing or a single banknote as a donation, so cost would not become a barrier.","zh":"这个[[organization|组织]]邀请不同院系[[cooperate|合作]]，贡献各自的[[expertise|专长]]。活动用互动体验[[instead|代替]]冗长讲座：参观者可以用[[microscope|显微镜]]观察树叶，看一个[[delicate|精致的]]纸模型[[unfold|打开]]，并对介绍[[diabetes|糖尿病]]或[[infant|婴儿]]护理的展板发表[[comment|评论]]。园艺展区说明[[pesticide|杀虫剂]]的使用如何损害昆虫的[[habitat|栖息地]]。[[furthermore|此外]]，一个[[fashion|时尚]]社团发起清理[[wardrobe|衣柜]]、交换衣物的活动。[[flexible|灵活的]]规则允许参与者捐赠衣物或一张[[banknote|钞票]]，避免费用成为[[barrier|障碍]]。"},{"en":"Preparations were interrupted by an odd message demanding money to prevent adverse publicity. The students reported this attempt to blackmail them rather than speculate about its author. They kept the message in case anyone needed to testify, but refused to let it distract them. Another concern was privacy: visitors did not have to include personal experiences in discussions, even with intimate friends present. Volunteers would defend anyone's choice to remain silent and encourage questions without pressuring people to speak.","zh":"筹备期间，一条[[odd|奇怪的]]信息要求他们付钱，以免遭到[[adverse|不利的]]宣传。学生们举报了这次试图[[blackmail|敲诈]]他们的行为，而没有[[speculate|猜测]]发信者是谁。他们保存信息，以备有人需要[[testify|作证]]，但不让此事[[distract|使他们分心]]。另一个问题是隐私：即使有[[intimate|亲密的]]朋友在场，参观者也无须让讨论[[include|包括]]自己的个人经历。志愿者会为任何人选择沉默的权利[[defend|辩护]]，并[[encourage|鼓励]]提问，而不强迫发言。"},{"en":"On opening day, even initially indifferent students stopped to look. Volunteers had to double their shifts, ventilate the busy hall, and remove cables that presented a hazard. They could provide useful information, but had no illusion that one fair would change every habit. Afterward, their survey persuaded the school to abolish a fee for refilling water bottles and decrease the price of fruit. These lasting changes made the work worthwhile.","zh":"活动开幕当天，连起初[[indifferent|漠不关心的]]学生也停下来观看。志愿者不得不把轮值班次数量[[double|加倍]]，给繁忙的大厅[[ventilate|通风]]，并移走构成[[hazard|危险]]的电线。他们可以[[provide|提供]]有用的信息，却没有抱着一场活动就能改变所有习惯的[[illusion|幻想]]。活动结束后，他们的调查说服学校[[abolish|废除]]饮水瓶续水收费，并[[decrease|降低]]水果价格。这些持续的改变让付出变得值得。"}]},"3":{"title":"The Flu Week","paras":[{"en":"The punctual headmaster arrived at his tidy office to find a long absence list. He had to admit that flu was spreading through the school. His objective was to identify the source of the reports and help health workers screen pupils, rather than solve a medical problem himself. What first looked like a rare individual case was becoming a visible pattern. He could not dismiss the figures or wait for the spread to accelerate.","zh":"一向[[punctual|准时的]][[headmaster|校长]]来到[[tidy|整洁的]]办公室，发现缺勤名单已经很长。他不得不[[admit|承认]]，[[flu|流感]]正在学校传播。他的[[objective|目标]]是[[identify|查明]]这些报告的[[source|来源]]，协助医务人员[[screen|筛查]]学生，而不是独自[[solve|解决]]医学问题。起初看似[[rare|罕见的]][[individual|个别]]病例，正呈现出[[visible|明显的]]规律。他不能[[dismiss|无视]]这些数字，也不能坐等传播[[accelerate|加速]]。"},{"en":"At a meeting, he proposed rules to govern the school's response and appoint two assistants. One would verify household contact details; the other would keep phones ready to charge. Staff could bypass routine purchasing paperwork to erect a reception tent, but clinical questions, including those about antibiotics, went to professionals. A sophisticated administrator helped profile the absences. As information began to emerge, the team could uncover which classes needed extra support.","zh":"在会议上，他提议制定规则以[[govern|管理]]学校的应对，并[[appoint|任命]]两名助理。一人核实[[household|家庭的]]联系资料，另一人做好手机[[charge|充电]]准备。员工可以[[bypass|避开]]常规采购文书流程，以便[[erect|搭建]]接待帐篷，但包括[[antibiotics|抗生素]]在内的临床问题都交给专业人员。一位[[sophisticated|老练的]]行政人员帮助[[profile|概述]]缺勤情况。随着信息开始[[emerge|出现]]，团队能够[[uncover|发现]]哪些班级需要额外支持。"},{"en":"Rumors threatened to arouse fear. Notwithstanding the pressure, the headmaster kept announcements neutral and distinguished confirmed reports from subjective impressions. He did not imply that parents were careless or cast blame on them. He knew he would encounter angry parents, but refused to evade questions and had to concede that lessons would be disrupted. He tried to discourage crowds at the gate, explaining that concern for children's welfare was an essential ingredient in any sensible decision.","zh":"谣言可能[[arouse|引起]]恐惧。[[notwithstanding|尽管]]面临压力，[[headmaster|校长]]仍让公告保持[[neutral|中立]]，区分已确认的报告与[[subjective|主观的]]印象。他没有[[imply|暗示]]家长粗心，也没有把责任[[cast|抛给]]他们。他知道自己会[[encounter|碰到]]愤怒的家长，却不肯[[evade|逃避]]问题，并不得不[[concede|承认]]课程会受影响。他设法[[discourage|阻止]]人群聚集在校门口，解释说，对孩子[[welfare|福祉]]的关心，是任何明智决定都应包含的必要[[ingredient|成分]]。"},{"en":"Practical problems remained. Staff had to wrestle with the timetable and shrink the number of shared activities. A moist storeroom was unsuitable for supplies, so a redundant office became a rest area conducive to quiet. The kitchen prepared meals to nourish pupils still at school and kept sufficient drinking water available. The board postponed a proposed maintenance levy and canceled a costly display about a local inventor's patent, redirecting those funds to temporary staffing.","zh":"实际问题仍未解决。工作人员必须[[wrestle|费力应对]]课程安排，[[shrink|缩减]]集体活动的数量。一间[[moist|潮湿的]]储藏室不适合存放物资，于是一间[[redundant|闲置多余的]]办公室被改成了[[conducive|有利于]]安静休息的区域。食堂准备饭菜，为仍在校的学生[[nourish|提供营养]]，并确保有[[sufficient|充足的]]饮用水。理事会推迟了一项拟议中的维修[[levy|征费]]，取消了介绍当地发明家[[patent|专利]]的昂贵展览，把相关资金用于临时人员配置。"},{"en":"As absences fell, the headmaster used the experience as an opportunity to improve emergency planning. A parent with poor vision had struggled to read notices, so larger print became standard. He was content with the cooperation, while leaving judgments about the outbreak itself to health professionals.","zh":"随着缺勤人数下降，[[headmaster|校长]]把这次经历视为改进应急预案的[[opportunity|机会]]。一位[[vision|视力]]不佳的家长曾难以看清通知，因此学校将大字号定为标准。他对大家的合作感到[[content|满意]]，同时把对疫情本身的判断留给卫生专业人员。"}]},"4":{"title":"The Old Station","paras":[{"en":"When the railway closed, the old terminal stood vacant. A robust locomotive that had once served a nuclear power station remained on the platform. The council wanted to sell the site, but a retired judge made a pledge to save it. His goal was a railway museum with rooms for community services. He knew that a shallow appeal to nostalgia would not persuade hostile officials, so he prepared a rough budget of one million pounds.","zh":"铁路关闭后，旧[[terminal|终点站]]便一直[[vacant|空着]]。一台曾为[[nuclear|核能]]发电站服务的[[robust|结实的]][[locomotive|机车]]还停在[[platform|站台]]上。市议会想出售场地，但一位退休[[judge|法官]]作出[[pledge|承诺]]，要保住它。他的[[goal|目标]]是建立一座铁路博物馆，并为社区服务留出房间。他知道，[[shallow|肤浅的]]怀旧呼吁无法[[persuade|说服]][[hostile|怀有敌意的]]官员，因此准备了一份总额为一[[million|百万]]英镑的[[rough|大致的]]预算。"},{"en":"At the hearing, he tried not to overstate the project's effect on the economy. In plain language, he explained what repairs would entail and accepted responsibility for raising funds. Roof damage was one circumstance that could delay opening. As a precaution, workers restricted entry in accordance with the engineer's instructions. The maximum was ten people at a time. An apology outside explained why visitors could not yet enter freely.","zh":"在听证会上，他尽量不[[overstate|夸大]]项目对经济的[[effect|影响]]。他用[[plain|清晰的]]语言解释维修会[[entail|牵涉]]哪些工作，并承担筹款的[[responsibility|责任]]。屋顶损坏是可能推迟开放的一个[[circumstance|情况]]。作为一项[[precaution|预防措施]]，工人[[accordance|按照]]工程师的指示限制入内人数，每次人数的[[maximum|最大值]]为十人。门外张贴的[[apology|道歉]]说明解释了访客暂时不能自由入内的原因。"},{"en":"A simultaneous appeal asked residents to contribute photographs that would portray railway culture. A psychology student helped interview former passengers, while volunteers displayed a driver's compass and uniform. To avoid dependence on transient tourism, the plan would incorporate a small acupuncture clinic and a cafe. This venture relied on mutual trust: tenants paid modest rent, and volunteers kept the building open. Complaints about stale bread and irregular opening hours led to better management.","zh":"一项[[simultaneous|同步的]]征集活动请居民[[contribute|贡献]]能够[[portray|描绘]]铁路[[culture|文化]]的照片。一名[[psychology|心理学]]学生协助采访昔日乘客，志愿者则展示了一位司机的[[compass|指南针]]和[[uniform|制服]]。为了避免依赖[[transient|短暂的]]旅游热潮，计划将[[incorporate|包含]]一家小型[[acupuncture|针灸]]诊所和一家咖啡馆。这项[[venture|创业项目]]依靠[[mutual|相互的]]信任运作：租户支付适中的租金，志愿者维持建筑开放。针对[[stale|不新鲜的]]面包和[[irregular|不规律的]]营业时间的投诉，促使管理得到改善。"},{"en":"Eventually, a small electric engine could propel visitors along a restored track. Engineers used empirical observations to check its velocity, and the workforce received training before insurance was arranged. A cluster of shops began to appear nearby, improving the street environment. Nobody could foresee every difficulty, but the museum did achieve a stable income. In retrospect, its greatest success was the pure pleasure of seeing neighbors use their station again.","zh":"最终，一台小型电动机车可以沿修复后的轨道[[propel|推动]]载客车辆。工程师通过[[empirical|基于经验观察的]]记录检查运行[[velocity|速度]]，[[workforce|全体员工]]也先接受培训，再安排[[insurance|保险]]。附近开始[[appear|出现]]一[[cluster|簇]]店铺，改善了街道[[environment|环境]]。没有人能够[[foresee|预料]]所有困难，但博物馆确实[[achieve|达到了]]收支稳定的目标。[[retrospect|回顾]]起来，它最大的成功，是让人们感受到邻里重新使用车站的那份[[pure|纯粹的]]快乐。"}]},"5":{"title":"The Map Room","paras":[{"en":"An old mansion held the map collection of a naval veteran. His granddaughter's chief task was to publish a catalog and preserve this tangible legacy. At a reception, an official paid her a compliment on an exquisite coastal map, then asked whether the whole collection was for sale. Conscious of her grandfather's wishes, she decided to resist the offer and advocate public access. She set an explicit scope for the catalog: maps from his voyages, with a sample of the letters that explained them.","zh":"一座旧[[mansion|大宅]]保存着一位海军[[veteran|老兵]]收藏的地图。他孙女的[[chief|主要的]]任务是[[publish|出版]]目录，保存这份[[tangible|有形的]][[legacy|遗产]]。在一次[[reception|招待会]]上，一位[[official|官员]]对一幅[[exquisite|精美的]]海岸地图给予[[compliment|称赞]]，随后询问整批藏品是否出售。她[[conscious|意识到]]祖父的心愿，决定[[resist|反对]]这项收购提议，并[[advocate|支持]]向公众开放。她为目录设定了[[explicit|明确的]][[scope|范围]]：祖父航行时使用的地图，以及解释地图背景的书信[[sample|样本]]。"},{"en":"One map showed a whole continent; another offered a panorama of a harbor. A magnifying lens could magnify a tiny figure beside a ship. An attached diary described an attempt to hijack that vessel and the blast that damaged its deck. Medical records explained why the voyage ended early. These papers gave the maps a human perspective. Using a dictionary, the granddaughter began to condense unfamiliar nautical descriptions into short notes that she could attach to each entry.","zh":"一幅地图展示整个[[continent|大陆]]，另一幅呈现港口的[[panorama|全景]]。放大镜能够[[magnify|放大]]船旁一个微小的[[figure|人物]]。随附的日记描述了一次企图[[hijack|劫持]]该船的行动，以及损坏甲板的[[blast|爆炸]]。[[medical|医疗的]]记录解释了那次航行为何提前结束。这些材料为地图增添了人的[[perspective|视角]]。孙女借助[[dictionary|字典]]，开始将陌生的航海描述[[condense|浓缩]]成简短注释，以便[[attach|附在]]每一条目录后面。"},{"en":"Damp caused a setback. A trace of mold appeared on several sheets, and an exceptional map needed specialist treatment. To combat the damage, conservators asked her to remove the affected boxes to a spare room. The work was tough, but delay would diminish the chances of saving them. She hired an expert to appraise their condition and check what preservation legislation required. The collection was not a private affair anymore: the town had promised funds, and every expense needed an explanation.","zh":"潮气带来了一次[[setback|挫折]]。几张地图出现霉菌的[[trace|踪迹]]，其中一幅[[exceptional|杰出的]]地图需要专业处理。为了[[combat|减轻]]损害，保护人员请她把受影响的箱子[[remove|移动]]到一间[[spare|备用的]]房间。工作很[[tough|艰苦]]，但拖延会[[diminish|减少]]挽救地图的机会。她请专家[[appraise|评价]]藏品状况，并核查文物保护[[legislation|立法]]的要求。这批收藏已不再是私人的[[affair|事情]]：小镇承诺提供资金，每项支出都需要说明。"},{"en":"The team chose to locate the reading room in the driest wing and enlarge it to increase seating. A transparent screen would guard the most delicate maps. They would amass digital copies rather than more fragile originals. An inevitable gap in the wartime records remained, but the catalog acknowledged it. As public opinion began to swing in her favor, the granddaughter added a final display about old sailors' superstition and their fear of contagious disease. Only a small proportion of the collection concerned battles; most of it concerned finding a way home.","zh":"团队决定将阅览室[[locate|设置]]在最干燥的一翼，并加以[[enlarge|扩大]]，以[[increase|增加]]座位。[[transparent|透明的]]隔板将[[guard|守护]]最脆弱的地图。他们将[[amass|积累]]数字副本，而不再增添易损的原件。战时记录中仍存在一段[[inevitable|不可避免的]][[gap|空缺]]，目录如实说明了这一点。随着公众意见开始向支持她的方向[[swing|改变]]，孙女补充了最后一个展区，介绍旧时水手的[[superstition|迷信]]，以及他们对[[contagious|可接触传染的]]疾病的恐惧。整批藏品只有很小的[[proportion|比例]]涉及战斗，大部分讲述的都是寻找归途。"}]},"6":{"title":"Water in the Desert","paras":[{"en":"In a desert village, water was a perpetual worry. Three consecutive dry seasons had made the well level plunge, and families struggled to feed their animals. An adolescent named Sami helped his mother carry water past a pile of broken furniture. Nobody would fancy making that journey in the harsh midday heat. His grandfather recalled a ruler whose greed had filled the palace around his throne while villages went thirsty. Such stories still had the power to appall Sami.","zh":"在一个[[desert|沙漠]]村庄，水是一个[[perpetual|持续的]]烦恼。三个[[consecutive|连续不断的]]旱季使井水水位[[plunge|骤降]]，各家连[[feed|喂养]]牲畜都很困难。一名叫萨米的[[adolescent|青少年]]帮助母亲搬水，经过一[[pile|堆]]破旧[[furniture|家具]]。没有人会[[fancy|想做]]这样一趟在正午[[harsh|严酷的]]热浪中搬水的苦差事。祖父回忆说，曾有一位统治者因[[greed|贪婪]]而把[[throne|王座]]周围的宫殿装满财物，村庄却饱受缺水之苦。这样的故事仍能[[appall|使人震惊]]，萨米也不例外。"},{"en":"The village formed a legal entity to apply for funding. Its council had to formulate a plan, establish fair rules, and function openly. Parliament approved a regional water campaign, giving the project a genuine prospect of success. Engineers examined a range of sites. The ground looked homogeneous, but tests helped them discern differences, including patches of acid soil. Marks on older wells could indicate past water levels; red signs would signify unsafe areas.","zh":"村庄成立了一个法律[[entity|实体]]来申请资金。村委会必须[[formulate|制定]]计划、[[establish|建立]]公平规则，并公开[[function|运作]]。[[parliament|议会]]批准了一项区域供水[[campaign|运动]]，使项目拥有了[[genuine|真正的]]成功[[prospect|前景]]。工程师检查了[[range|一系列]]地点。地面看似[[homogeneous|同质的]]，检测却帮助他们[[discern|辨别]]差异，包括一些[[acid|酸性的]]土壤。旧井上的标记能够[[indicate|表明]]过去的水位；红色标志则将[[signify|表示]]不安全的区域。"},{"en":"A previous flood had left one casualty and weeks of agony, so safety was the primary concern. Workers had to bind pipes securely for transport and protect equipment in transit. They also needed to upgrade an electrical circuit before the pumps could run. Critics could criticize the cost, but the council refused to exaggerate the benefits. One incident, when a loose fitting stopped a test, made the need for careful inspection obvious.","zh":"先前的一次洪水造成了一名[[casualty|死伤者]]和数周的[[agony|痛苦]]，因此安全是[[primary|主要的]]关注点。工人必须把管道牢牢[[bind|捆绑]]好以便运输，并保护处于[[transit|运输]]中的设备。他们还需要先[[upgrade|升级]]一段[[circuit|电路]]，水泵才能运行。批评者可以[[criticize|批评]]成本，但村委会不肯[[exaggerate|夸大]]收益。一次接头松动导致测试中止的[[incident|事件]]，使认真检查的必要性变得[[obvious|明显]]。"},{"en":"Sami helped interpret instructions in the native language while engineers explained how the controls interact. A mature volunteer taught younger children to record the normal flow and report any unusual phenomenon. The transition took months, but reliable taps finally replaced the daily queues. In contrast to the old privilege of wealthy families, every household now had access. Sami could breathe with relief. His elaborate drawing of the new system won a school prize and awakened an interest in architecture: he wanted to design places where basic needs came first.","zh":"萨米帮助用[[native|本地的]]语言[[interpret|解释]]说明，工程师则讲解各控制装置如何[[interact|相互作用]]。一位[[mature|成熟的]]志愿者教年幼的孩子记录[[normal|正常的]]流量，并报告异常[[phenomenon|现象]]。这场[[transition|转变]]持续了数月，但可靠的水龙头终于取代了每天排队取水的场景。与过去富裕家庭享有的[[privilege|特权]]形成[[contrast|对比]]的是，如今每户都能用上水。萨米终于可以轻松地[[breathe|呼吸]]。他绘制的[[elaborate|精心制作的]]供水系统图获得校内奖项，并唤起了他对[[architecture|建筑学]]的兴趣：他想设计把基本需求放在首位的生活空间。"}]},"7":{"title":"The Hill Clinic","paras":[{"en":"Before Nurse Lin could retire, she wanted the hill clinic to become a permanent service. From its upstairs window, she could see the mountain peak and the ferry that brought patients across the river. Visits were still arranged at random, and winter cancellations were bound to depress isolated residents. A recent epidemic had shown that the clinic needed more than goodwill. Lin invited villagers to participate in planning its future.","zh":"林护士希望在[[retire|退休]]之前，让山间诊所成为一项[[permanent|长久的]]服务。从诊所[[upstairs|楼上]]的窗户，她可以看见[[peak|山峰]]和运送患者过河的[[ferry|渡船]]。就诊仍是[[random|随机]]安排的，冬季取消服务[[bound|一定会]]让孤立的居民[[depress|感到沮丧]]。最近的一场[[epidemic|流行病]]表明，诊所需要的不只是善意。林护士邀请村民[[participate|参与]]规划诊所的未来。"},{"en":"Her original proposal was modest: a minimum of two nurses, regular transport, and a room for mental health consultations. Some called it a fantasy, but a local statute allowed shared funding. Lin's counterpart at the town clinic helped investigate costs and anticipate demand. A cooperative sold premium tea and offered part of its revenue. This made a stable service plausible without depending on the clinic's growing fame to attract donations.","zh":"她[[original|最初的]]提议很朴素：[[minimum|最少]]两名护士、定期交通，以及一间用于[[mental|精神]]健康咨询的房间。有些人称之为[[fantasy|幻想]]，但当地一项[[statute|法令]]允许共同出资。林护士在镇诊所的[[counterpart|对应同事]]协助[[investigate|调查]]成本、[[anticipate|预料]]需求。一家合作社销售[[premium|优质的]]茶叶，愿意拿出部分[[revenue|收入]]。这使稳定服务成为[[plausible|合理可行的]]设想，无须依赖诊所日益增长的[[fame|名声]]来吸引捐款。"},{"en":"Training helped the new team cope with daily work. Lin could distill decades of experience into a few lessons: listen first, distinguish facts from guesses, and never exploit a patient's trust. An explanation should precede each unfamiliar procedure. Volunteers learned to fetch supplies, use a broom, and demonstrate handwashing. They could measure waiting times, but needed deeper insight to understand why someone stayed away. Rules should orient staff toward service, not oppress the people seeking help.","zh":"培训帮助新团队[[cope|应付]]日常工作。林护士能把数十年的经验[[distill|提炼]]为几条原则：先倾听，[[distinguish|区分]]事实与猜测，绝不[[exploit|利用]]患者的信任。解释应当[[precede|先于]]每项陌生操作。志愿者学习[[fetch|取来]]物资、使用[[broom|扫把]]，以及[[demonstrate|展示]]洗手步骤。他们可以[[measure|测量]]等候时间，但要理解某人为何不来就诊，则需要更深的[[insight|洞察力]]。规则应当[[orient|引导]]工作人员面向服务，而不是[[oppress|压迫]]求助的人。"},{"en":"A fierce storm tested the plan. A former military driver joined a rescue team, while the nurses dealt with an acute shortage of supplies. Lin's remarkable calm helped everyone accomplish their tasks. Outside, volunteers found an injured dog and took it to a vet; a family later offered to adopt it. At the next children's workshop, its recovery prompted a discussion of what makes a dog a mammal and why nutrition matters.","zh":"一场[[fierce|强烈的]]风暴考验了这项计划。一位有[[military|军事]]运输经历的司机加入[[rescue|救援]]队，护士们则处理物资[[acute|严重的]]短缺。林护士[[remarkable|非凡的]]镇定帮助所有人[[accomplish|完成]]任务。在外面，志愿者发现一只受伤的狗，将它送往兽医处，后来一个家庭表示愿意[[adopt|收养]]它。在下一次儿童活动中，它的康复引发了关于狗为何属于[[mammal|哺乳动物]]以及[[nutrition|营养]]为何重要的讨论。"},{"en":"Lin stayed to witness the opening of the expanded clinic. The most striking change was its relationship with the village. No team could reverse every illness, but this extraordinary shared effort was a milestone. She could leave knowing that the service would continue to evolve.","zh":"林护士留下来[[witness|见证]]扩建后的诊所开放。最[[striking|显著的]]变化是诊所与村庄的[[relationship|关系]]。没有哪个团队能[[reverse|逆转]]所有疾病，但这次[[extraordinary|不平常的]]共同努力是一个[[milestone|里程碑]]。她可以安心离开，因为这项服务还会继续[[evolve|逐渐发展]]。"}]},"8":{"title":"The Troupe","paras":[{"en":"The new executive of a small theater inherited unpaid bills and a mass of complaints. The former manager had tried to dictate every decision, treating volunteers with contempt. She chose to disclose the accounts instead. Accurate arithmetic showed a narrow margin between survival and closure. To sustain the theater, she would invest in costume production only after checking costs. The town's census suggested a young audience, giving her the impetus to introduce affordable family shows.","zh":"一家小剧院的新任[[executive|高管]]接手了一堆未付账单和一[[mass|大堆]]投诉。[[former|以前的]]经理试图[[dictate|支配]]每项决定，对志愿者充满[[contempt|轻视]]。她则选择[[disclose|公开]]账目。[[accurate|准确的]][[arithmetic|计算]]表明，维持运营与倒闭之间只有很小的资金[[margin|差额]]。为了[[sustain|保持]]剧院运转，她决定核实成本之后，才为[[costume|戏服]][[production|生产]][[invest|投入]]资金。小镇的[[census|人口普查]]显示有不少年轻观众，这给了她[[introduce|引进]]平价家庭演出的[[impetus|动力]]。"},{"en":"The actors chose a story about a tiny parasite that threatened a kingdom. Its villain tried to rob travelers, while a mortal wound nearly killed the hero. Children might misunderstand the ending, so the director asked for clarity. He would delete a confusing speech and propose a simpler scene. An experienced actor helped the cast grasp the plot and comprehend each character's motives. They wanted to impress families through honest storytelling, not betray their trust with frightening advertisements.","zh":"演员们选择了一个微小[[parasite|寄生虫]]威胁王国的故事。反派企图[[rob|抢劫]]旅人，英雄则因一处[[mortal|致命的]]伤口险些丧命。孩子们可能[[misunderstand|误解]]结局，因此导演要求提高表达的[[clarity|清晰度]]。他准备[[delete|删除]]一段令人困惑的台词，并[[propose|提出]]一个更简单的场景。一位资深演员帮助大家[[grasp|理解]]情节、[[comprehend|理解]]各角色的动机。他们希望用真诚的故事给家庭观众[[impress|留下深刻印象]]，而不是用吓人的广告[[betray|背叛]]观众的信任。"},{"en":"Rehearsals exposed practical problems. The stage configuration made it difficult to retrieve props, and faulty lighting apparatus could disrupt a scene. The director used his experience to arrange clear paths and allocate storage spaces. Nobody could block an exit. He welcomed rational criticism but would oppose reckless changes on opening night. Cooperation became the norm, and the formation of a reliable team mattered more than applause. Even actors addicted to praise began listening to quieter colleagues.","zh":"排练暴露出实际问题。舞台[[configuration|布局]]让人难以[[retrieve|取回]]道具，有故障的照明[[apparatus|设备]]也可能[[disrupt|使场景中断]]。导演凭借[[experience|经验]][[arrange|安排]]畅通路线，[[allocate|分配]]储物空间。任何人都不得[[block|阻碍]]出口通行。他欢迎[[rational|合理的]]批评，但会[[oppose|反对]]首演当晚[[reckless|鲁莽的]]变动。合作成了[[norm|准则]]，可靠团队的[[formation|形成]]比掌声更重要。就连那些对赞美[[addicted|入迷的]]演员，也开始倾听不太出声的同事。"},{"en":"Before the first show, a snack of bread and butter offered welcome refreshment. Music helped soothe the nervous cast, although their anxiety did not entirely vanish. Outside noise remained a menace, so volunteers closed the street-facing windows. Every young child had an adult to accompany them. When laughter filled the room, the troupe felt its first triumph: it had created recreation the town could afford and a theater worth returning to.","zh":"首场演出前，抹着[[butter|黄油]]的面包作为[[snack|小吃]]，提供了受欢迎的[[refreshment|茶点]]。音乐帮助[[soothe|安抚]]紧张的演员，尽管他们的焦虑并未完全[[vanish|消失]]。外面的噪声仍是一个[[menace|威胁]]，所以志愿者关上了临街窗户。每个年幼的孩子都有成年人[[accompany|陪同]]。当笑声充满大厅时，剧团感受到了第一次[[triumph|成功]]：他们创造了小镇居民负担得起的[[recreation|娱乐]]，以及一座值得再次光临的剧院。"}]},"9":{"title":"Dry Season","paras":[{"en":"Despite a humid spring, drought returned to the valley. A graph showed a sharp decline in the volume of water stored behind the dam. Vast fields were turning brown, and local farmers faced a dilemma: reduce planting or abandon their land. Maya, a slim young farmer, called an emergency meeting. No household was absent. People were keen to act, but a previous lawsuit made some accuse their neighbors before hearing the facts.","zh":"[[despite|尽管]]春季[[humid|温暖潮湿]]，[[drought|干旱]]还是再次降临山谷。一张[[graph|图表]]显示，大坝后储水的[[volume|体积]]急剧[[decline|下降]]。[[vast|大片的]]田野逐渐枯黄，[[local|本地的]]农民面临[[dilemma|困境]]：减少播种，还是[[abandon|放弃]]土地。身材[[slim|苗条的]]年轻农民玛雅召集了一场讨论[[emergency|紧急情况]]的会议。没有任何一家[[absent|缺席]]。大家都[[keen|热衷于]]采取行动，但[[previous|先前的]]一场[[lawsuit|诉讼]]让一些人还没听清事实，就开始[[accuse|指责]]邻居。"},{"en":"Maya asked them to rank needs, record every expense, and specify each farm's share. The ultimate aim was adequate water for essential crops and animals. An up-to-date survey would help them develop a fair plan and eliminate waste. They would blend practical experience with expert advice, rather than let advertisements mislead them about a miracle breed of cattle. A visiting teacher offered to enlighten families about reading the figures, making a dull meeting useful.","zh":"玛雅请大家把需求[[rank|分等级]]，记录每项[[expense|费用]]，并[[specify|详述]]每个农场的份额。[[ultimate|最终的]]目标是让基本作物和牲畜获得[[adequate|足够的]]水。一份[[up-to-date|最新的]]调查将帮助他们[[develop|完善]]公平方案，并[[eliminate|消除]]浪费。他们会把实践经验与专家建议[[blend|融合]]，而不让宣传神奇牛[[breed|品种]]的广告[[mislead|误导]]自己。一位来访教师愿意[[enlighten|启发]]各家理解数据，使这场[[dull|无聊的]]会议变得有用。"},{"en":"Next they had to raise money for deliveries and agree on a route. Drivers would obey the schedule, and volunteers would count containers at each stop. At one farm, a worker fell when a slack rope slipped. Maya called an ambulance and helped him lean against a wall while they waited. The accident showed why equipment checks were critical. A conspicuous silver sign now marked the collection point, and anyone noticing damage had to contact the coordinator.","zh":"接下来，他们必须为送水[[raise|筹款]]，并商定一条[[route|固定路线]]。司机将[[obey|遵从]]时间安排，志愿者则在每站[[count|清点]]水桶。在一个农场，一根[[slack|松弛的]]绳子滑脱，一名工人摔倒。玛雅叫了[[ambulance|救护车]]，帮助他[[lean|倚靠]]在墙边等候。这次事故说明设备检查为何如此[[critical|关键]]。如今，一块[[conspicuous|显著的]][[silver|银色的]]标志牌标明了取水点；发现设备损坏的人必须[[contact|联系]]协调员。"},{"en":"Volunteers continued to observe conditions and segregate damaged containers from usable ones. A peculiar smell in one tank prompted another inspection before distribution. Such caution helped prevent a second catastrophe. Fair payments could motivate drivers, but shared progress gave families optimism. They could derive hope from seedlings beginning to thrive. They no longer expected one rainfall to solve everything; they began to aspire to a system that would survive the next dry season.","zh":"志愿者继续[[observe|观察]]情况，将损坏的容器与可用容器[[segregate|分开]]。一个水箱中的[[peculiar|怪异的]]气味促使他们在分发前再次检查。这种谨慎帮助避免另一场[[catastrophe|灾难]]。公平的报酬能够[[motivate|激励]]司机，共同取得的进展则给各家带来了[[optimism|乐观]]。他们可以从开始[[thrive|茁壮成长]]的幼苗中[[derive|获得]]希望。他们不再指望一场雨解决所有问题，而开始[[aspire|渴望]]建立一套能够撑过下一个旱季的供水制度。"}]},"10":{"title":"After the Storm","paras":[{"en":"A tropical storm threatened to destroy an entire coastal village. Families escaped alive, but the school and mill were badly damaged. A network of neighbors began to organize relief and respond to calls for help. Their initiative was to integrate local knowledge with outside assistance. By custom, people brought wood to the meeting hall, but a loose wire could ignite it, so volunteers moved it to a separate store. Some survivors later needed therapy to recover from the shock.","zh":"一场[[tropical|热带的]]风暴威胁着要[[destroy|毁灭]][[entire|整个]]海滨村庄。各家[[alive|活着]]逃了出来，但学校和磨坊严重受损。邻里组成的[[network|网络]]开始[[organize|组织]]救援，[[respond|回应]]求助。他们的[[initiative|倡议]]是把本地经验与外来援助[[integrate|整合]]起来。按照[[custom|习俗]]，人们把[[wood|木头]]带到议事厅，但松脱的电线可能将它[[ignite|点燃]]，于是志愿者把木头移到单独的库房。一些幸存者后来需要接受[[therapy|治疗]]，才能从惊吓中恢复。"},{"en":"In the subsequent weeks, fatigue tested everyone's patience. The mill owner still faced a mortgage, and few loans were available. A considerate merchant offered to deliver grain on credit. The council had to terminate an unreliable building contract and accept a penalty, but a generous donation helped bolster the repair fund. People learned to embrace assistance without surrendering control of the project. Keeping decisions public was crucial to trust.","zh":"在[[subsequent|随后的]]几周，[[fatigue|疲劳]]考验着每个人的耐心。磨坊主仍背负一笔以房产作[[mortgage|抵押]]的贷款，而新的贷款几乎不可[[available|获得]]。一位[[considerate|考虑周到的]][[merchant|商人]]愿意赊账[[deliver|运送]][[grain|粮食]]。村委会不得不[[terminate|结束]]一份不可靠的施工合同，接受相应[[penalty|处罚]]，但一笔[[generous|慷慨的]]捐款帮助[[bolster|增强]]了维修资金实力。人们学会[[embrace|欣然接受]]援助，同时保留对项目的控制权。公开决策对信任至关[[crucial|重要]]。"},{"en":"Rebuilding meant improving infrastructure, not merely replacing walls. Engineers helped invent a simple device for sorting reusable bricks. A modern mill would complement the farms, while neat storage rooms would protect supplies. The road had to ascend above the low ground. External advisers assessed the risks inherent in that location, and national funding awaited a vote in the senate. Meanwhile, residents replanted vegetation before exposed slopes could dry out and young plants wither.","zh":"重建意味着改善[[infrastructure|基础设施]]，而不只是重新砌墙。工程师帮助[[invent|发明]]了一种分选可再用砖块的简单装置。一座[[modern|现代的]]磨坊将为农场提供[[complement|补充支持]]，[[neat|整洁的]]库房则保护物资。道路必须[[ascend|上升]]到低洼地带之上。[[external|外部的]]顾问评估了该地点[[inherent|固有的]]风险，国家拨款则等待[[senate|参议院]]投票。与此同时，居民重新种植[[vegetation|草木]]，避免裸露坡地干燥后幼苗[[wither|枯萎]]。"},{"en":"The school faculty held a seminar to revise the evacuation plan. Respectful etiquette helped parents discuss disagreements, and everyone accepted one fundamental rule: warnings came before property. The school kept its typical courtyard design, with similar gathering points in each section. When experts forecast further rain, families knew where to go. The village could finally celebrate its new status as a working cooperative. At the harbor, a priest came to bless the supply boat before its next voyage: rebuilding was becoming an ordinary shared responsibility.","zh":"学校的[[faculty|全体教师]]举行了一次[[seminar|研讨会]]，共同[[revise|修改]]疏散计划。尊重他人的[[etiquette|礼节]]帮助家长讨论分歧，所有人都接受了一条[[fundamental|基础的]]规则：收到警报后的行动优先于保护财产。学校保留了[[typical|典型的]]庭院设计，各区域设置[[similar|类似的]]集合点。当专家[[forecast|预测]]又有降雨时，各家知道该去哪里。村庄终于可以[[celebrate|庆祝]]合作社投入运作这一新[[status|状况]]。在港口，一位牧师赶来为补给船的下一次[[voyage|航程]][[bless|祝福]]：重建正成为大家日常共同承担的责任。"}]},"11":{"title":"Field Survey","paras":[{"en":"Our survey headquarters occupied a school near the border. Beyond a bend in the road lay desolate hills where indigenous families kept sheep. A pilot study suggested that repeated floods were forcing people to settle on higher ground. We wanted a comprehensive picture of the population's needs, but could not overlook ordinary daily problems while focusing on extraordinary acts of courage during disasters. Transport costs might escalate before our funding agreements could expire, so the first plan was straightforward: listen, record, and check.","zh":"我们的调查[[headquarters|总部]]设在[[border|边界]]附近的一所学校里。道路的一个[[bend|拐弯]]之外是[[desolate|荒凉的]]山地，[[indigenous|土生土长的]]家庭在那里饲养[[sheep|绵羊]]。一项[[pilot|试点的]]研究表明，反复发生的洪水迫使人们到高处[[settle|定居]]。我们想[[comprehensive|全面地]]了解这里的[[population|人口]]需求，但不能只关注灾难中[[extraordinary|非凡的]]英勇事迹而[[overlook|忽视]][[ordinary|普通的]]日常问题。资金协议尚未[[expire|到期]]，运输成本就可能持续[[escalate|上涨]]，所以最初的计划很[[straightforward|简单]]：倾听、记录、核实。"},{"en":"Trust was the first obstacle. Prejudice and a sinister rumor about stolen information had created antagonism. We had to be patient and sensitive on every occasion, rather than insist on answers. An intelligent local teacher helped us adapt the interviews and explain that no village would be excluded. The team would not exclude anyone unable to read, either. A rigid hierarchy might deter honest replies, so residents spoke directly to the researchers.","zh":"信任是第一个障碍。[[prejudice|偏见]]以及一则关于信息被窃取的[[sinister|阴险的]]谣言，引发了[[antagonism|对抗情绪]]。我们必须在每个[[occasion|场合]]保持[[patient|耐心]]和[[sensitive|体贴]]，而不是[[insist|坚决要求]]回答。一位[[intelligent|聪明的]]本地教师帮助我们[[adapt|调整适应]]访谈，并解释任何村庄都不会被遗漏。团队也不会[[exclude|把不识字的人排除在外]]。严格的[[hierarchy|等级制度]]可能[[deter|阻止]]人们坦诚回应，因此居民直接与研究人员交谈。"},{"en":"Health workers joined us to assess access to care. They recorded any reported symptom, such as loss of appetite, and asked whether families could obtain even a basic pill locally. Flood damage could impair services long after the water fell. We documented the death toll and the enormous costs in the aftermath, without claiming that a short survey could explain every illness. A satellite connection would enable us to send consistent records to a global relief fund each evening.","zh":"医务人员加入团队，[[assess|评估]]当地获得医疗服务的条件。他们记录居民报告的各种[[symptom|症状]]，例如[[appetite|食欲]]下降，并询问各家能否在当地获得哪怕最基本的一片[[pill|药片]]。洪水退去很久后，灾害损伤仍可能[[impair|削弱]]服务能力。我们记录[[toll|死亡人数]]和灾后[[aftermath|创伤]]带来的[[enormous|巨大]]开支，但不声称简短调查能够解释每种疾病。[[satellite|卫星]]连接将[[enable|使我们能够]]每晚向一个[[global|全球的]]救援基金发送格式[[consistent|一致的]]记录。"},{"en":"Checking forms was tedious, but we would not compress interviews so much that their meaning was lost. Nor could we dilute difficult findings to please officials. As teams learned to merge their results, the work found a rhythm, almost like parts of a symphony coming together. Spontaneous offers of accommodation helped ensure that our final expenses did not exceed the budget. Before winter forced us to retreat, villagers could envisage a clinic on higher ground, supported by evidence they had helped collect.","zh":"核对表格很[[tedious|单调乏味]]，但我们不会把访谈[[compress|压缩]]到失去原意的程度，也不能为取悦官员而[[dilute|冲淡]]令人不安的发现。随着各组学会[[merge|合并]]结果，工作逐渐形成[[rhythm|节奏]]，仿佛一部[[symphony|交响乐]]的不同声部汇合。居民[[spontaneous|自发的]]住宿援助帮助控制了费用，最终开支没有[[exceed|超过]]预算。在冬季迫使我们[[retreat|撤退]]之前，村民已经能够[[envisage|设想]]一所建在高处的诊所，而依据正是他们协助收集的资料。"}]},"12":{"title":"Clean Streets","paras":[{"en":"Commerce brought crowds to the market, but a surge in litter threatened its potential. A humble street cleaner was the first to assert that sanitation deserved as much attention as sales. After an overnight shift he stayed awake long enough to explain how accidents occur when waste blocks a footpath. Considerable numbers of residents agreed. The council decided to initiate a trial, with an emphasis on practical help rather than negative messages blaming shopkeepers.","zh":"[[commerce|商业]]为市场带来人群，但垃圾的[[surge|激增]]威胁着市场的[[potential|潜力]]。一位[[humble|谦逊的]]清洁工首先[[assert|坚称]]，[[sanitation|公共卫生]]应当与销售一样受到重视。他值完夜班后又坚持[[awake|清醒]]了一会儿，向大家解释垃圾堵住人行道时事故如何[[occur|发生]]。[[considerable|相当多的]]居民表示赞同。市议会决定[[initiate|发起]]试点，把[[emphasis|强调的重点]]放在提供实际帮助上，而不是用[[negative|负面的]]信息责怪商户。"},{"en":"The team wrote a handbook explaining legal duties with pictures that illiterate workers could understand. Manual collection would continue in narrow lanes, while each vehicle followed a planned sequence of stops. Workers should not deviate from the route without reporting a problem. To ascertain where bins were needed, volunteers would input observations on their phones. The trial exposed multiple difficulties, including an obstacle nobody had expected: new bins left too little room for wheelchairs. It was wise to amend the layout before extending the scheme.","zh":"团队编写了一本[[handbook|手册]]，用[[illiterate|不识字的]]工人也能看懂的图画解释[[legal|法律的]]责任。窄巷里继续实行[[manual|人工的]]收集，每辆[[vehicle|车辆]]则按计划的[[sequence|顺序]]停靠。工人若未报告问题，就不应[[deviate|偏离]]路线。为了[[ascertain|弄清]]哪里需要垃圾桶，志愿者将用手机[[input|输入]]观察记录。[[multiple|多种多样的]]困难陆续出现，其中一个意外的[[obstacle|障碍]]是：新垃圾桶给轮椅留下的通行空间太小。在扩大项目之前先[[amend|修改]]布局，是[[wise|明智的]]做法。"},{"en":"A calendar helped school visits coincide with quieter trading hours. Pupils learned why a discarded cigarette could start a fire. The council would divide the market into zones and give each segment ample collection time. Services must not discriminate against poorer streets or depend entirely on volunteers. Some merchants continued to disapprove of the fee, but meetings allowed them to influence the plan. The council would not indulge repeated dumping, yet neither would it allow a single mistake to become an eternal label of blame.","zh":"一张[[calendar|日历]]帮助学校参观时间与市场较清闲的时段[[coincide|同时发生]]。学生了解了随意丢弃的[[cigarette|香烟]]为何可能引起火灾。市议会将把市场[[divide|分开]]成几个区域，给每个[[segment|部分]]安排[[ample|足够的]]清运时间。服务不能[[discriminate|歧视]]较贫困的街道，也不能完全[[depend|依赖]]志愿者。一些商户仍然[[disapprove|不赞成]]收费，但他们能够通过会议[[influence|影响]]方案。市议会不会[[indulge|纵容]]反复倾倒垃圾，也不会[[allow|允许]]一次错误变成[[eternal|永久的]]责备标签。"},{"en":"An intermediate review helped aggregate the results. Quantities could fluctuate with the season, and one counting slip needed correction. We could not suppose that cleaner streets alone proved every intervention useful. Still, the major improvement was visible: blocked paths reopened, and residents began to admire the workers they had ignored. Neighboring markets likewise asked to attempt a similar project. Reliable service could undo years of neglect; broken promises would quickly erode that trust.","zh":"一次[[intermediate|中期的]]检查帮助[[aggregate|汇集]]结果。垃圾数量会随季节[[fluctuate|波动]]，一处计数[[slip|差错]]也需要纠正。我们不能[[suppose|假定]]街道更干净就证明每项[[intervention|干预]]都有效。但[[major|主要的]]改善清晰可见：堵塞的道路重新畅通，居民开始[[admire|赞赏]]过去被忽视的工人。邻近市场[[likewise|同样地]]要求[[attempt|尝试]]类似项目。可靠的服务能够[[undo|消除]]多年疏于管理的影响；失信则会迅速[[erode|侵蚀]]这种信任。"}]},"13":{"title":"The Rocket Hall","paras":[{"en":"A metropolitan museum offered to buy a retired rocket from our town. The proposed contract created controversy: was this heritage public property or merely a commodity? Our director asked an attorney to evaluate the terms, then chose to reject the offer. The town would preserve the bulk of the collection in a new hall. My companion, an active volunteer with liberal views, welcomed the decision but warned that enthusiasm alone could not pay the bills.","zh":"一家[[metropolitan|大城市的]]博物馆提出购买我们小镇的一枚退役[[rocket|火箭]]。拟议中的[[contract|合同]]引发了[[controversy|争议]]：这份[[heritage|遗产]]究竟是公共[[property|财产]]，还是仅仅一件[[commodity|商品]]？馆长请[[attorney|律师]][[evaluate|评估]]条款，随后选择[[reject|拒绝]]交易。小镇将在新展馆中保存[[bulk|大部分]]藏品。我的[[companion|同伴]]是一位思想[[liberal|开明的]]、工作[[active|积极的]]志愿者，她欢迎这项决定，但提醒大家，光靠热情无法支付账单。"},{"en":"Traffic was another factor. A pedestrian crossing could improve access, provided the council approved it. The director asked us to recommend a route and obtain cost estimates. A local levy remained an option, but residents were restless about higher taxes. Their objections helped prompt a cheaper design. Rather than let the project stagnate, we agreed to postpone a decorative pyramid at the entrance and spend the money on access. The mayor would declare the opening date only when the site was ready.","zh":"交通是另一个[[factor|因素]]。[[provided|如果]]市议会批准，增设一条[[pedestrian|行人]]通道就能改善通行。馆长请我们[[recommend|推荐]]路线并[[obtain|获得]]成本估算。地方[[levy|征税]]仍是一种[[option|选择]]，但居民因税负可能增加而[[restless|坐立不安]]。他们的反对[[prompt|促使]]设计降低成本。为了不让项目[[stagnate|停滞]]，我们同意[[postpone|推迟]]建设入口处的装饰性[[pyramid|金字塔]]，把钱用于通行设施。市长只有在场地准备妥当后，才会[[declare|宣布]]开放日期。"},{"en":"Inside, researchers tried to construct a coherent account of the space program. Each label needed precise dates and clear language instead of obscure technical terms. Engineers' testimony explained the process required to launch a rocket, including the role of oxygen. A failed mission showed how a small error could lead to disaster. An exhibit about one scientist's suicide was handled with care, without turning personal suffering into spectacle. We wanted visitors to ponder the human cost as well as the glamour of exploration.","zh":"馆内，研究人员努力为航天计划建立[[coherent|连贯的]]叙述。每张[[label|标签]]都需要[[precise|精确的]]日期和清楚的语言，而不是[[obscure|费解的]]技术术语。工程师的[[testimony|证词]]解释了[[launch|发射]][[rocket|火箭]]所需的[[process|过程]]，包括[[oxygen|氧气]]的作用。一次失败的任务说明，小错误如何可能造成[[disaster|灾难]]。涉及一位科学家[[suicide|自杀]]的展览内容经过慎重处理，避免把个人痛苦变成猎奇材料。我们希望观众既能看到探索的[[glamour|魅力]]，也能[[ponder|仔细思考]]其中人的代价。"},{"en":"The director's intellectual rival helped review the research as a favour. Neither could possess every answer, but disagreement improved the exhibition. One panel explored a paradox: technology could expand knowledge while creating new dangers. This philosophy challenged visitors who preferred to worship machines without questioning them. The rocket's size could still stagger a child, yet the final message was simple: curiosity required responsibility. Visitors were welcome to ask questions, but not to intrude into the workshop. Even those who would hate a conventional lecture stayed to talk.","zh":"馆长在[[intellectual|智识]]讨论中的[[rival|竞争对手]]也给予[[favour|帮助]]，协助审查[[research|研究]]。两人都不可能[[possess|拥有]]所有答案，但分歧改善了展览。一块展板探讨了一个[[paradox|悖论]]：技术能够扩展知识，同时也会制造新的危险。这种[[philosophy|哲学]]思考挑战了那些只愿[[worship|崇拜]]机器、不愿提问的观众。[[rocket|火箭]]的体积仍能[[stagger|使孩子震惊]]，但最后传达的信息很简单：好奇心需要责任感。欢迎观众提问，但不得[[intrude|闯入]]工作室。就连那些会[[hate|讨厌]]常规讲座的人，也留下来交谈。"}]},"14":{"title":"The Community Garden","paras":[{"en":"Our community hoped to convert an empty garage and the land behind it into a garden. The idea was lofty, but funds were limited. A local institution agreed to employ two gardeners, provided residents helped with management. When neighbors began to gather for the first workday, the enthusiasm was tremendous. A closet became the tool store, and gray walls provided space for paintings. The garden
