<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  color-scheme:light dark;
  --bg:#f2f2f7; --card:#fff; --text:#1c1c1e; --text2:#6e6e73;
  --sep:rgba(60,60,67,.16);
  --bar-bg:rgba(242,242,247,.85);
  --blue:#007aff; --blue-tint:rgba(0,122,255,.12);
  --red:#ff3b30;
  --zebra-a:#ffffff; --zebra-b:#e6e6e6;
  --press-bg:#d7d7dc;
  --tbl-line:#999999; --tbl-border:#000000;
  /* PDF 字体: Segoe UI(西文)+SimSun(中文); Apple 回退: SF + Songti SC */
  --font-tbl:"PdfTable","Segoe UI","SimSun",-apple-system,BlinkMacSystemFont,
             "Songti SC","STSong","Songti TC","PingFang SC",
             "Helvetica Neue",Arial,sans-serif;
  /* PDF 字号 11.05pt, 行高 22.75pt; ×(46px/22.75pt)≈22px */
  --fs-tbl:22px;
  --badge1-bg:rgba(120,120,128,.14); --badge1-fg:#6e6e73;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000; --card:#1c1c1e; --text:#f2f2f7; --text2:#98989d;
    --sep:rgba(84,84,88,.5);
    --blue:#0a84ff; --blue-tint:rgba(10,132,255,.2);
    --red:#ff6961;
    --zebra-a:#1c1c1e; --zebra-b:#2c2c2e;
    --press-bg:#3a3a3c;
    --tbl-line:rgba(84,84,88,.65); --tbl-border:#8e8e93;
    --badge1-bg:rgba(120,120,128,.28); --badge1-fg:#a1a1a6;
  }
}
html{background:var(--bg)}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;touch-action:manipulation;
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}

/* ---------- 顶栏 ---------- */
#topbar{
  position:sticky;top:0;z-index:15;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top) + 8px) clamp(18px,4vw,56px) 10px;
  background:var(--bar-bg);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep);
}
#topbar h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.01em}
#sub{display:block;font-size:12px;color:var(--text2);margin-top:3px}
.icon-btn{
  width:38px;height:38px;border-radius:50%;border:none;padding:0;
  background:var(--blue-tint);color:var(--blue);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.icon-btn svg{display:block}
.icon-btn:active{transform:scale(.94)}
.icon-btn.on{background:var(--blue);color:#fff}
.topbar-actions{display:flex;align-items:center;gap:10px}

/* ---------- 提示条 ---------- */
#banner{
  background:rgba(255,159,10,.16);padding:10px clamp(18px,4vw,56px);font-size:13px;line-height:1.45;
  border-bottom:.5px solid var(--sep);cursor:pointer;
}

/* ---------- PDF 对应字体（unicode-range 分段映射） ----------
   PDF 原文：西文 Segoe UI + 中文 SimSun（宋体），11.05pt，regular
   Apple 对应：西文 SF / Helvetica Neue + 中文 Songti SC（宋体）
   分段映射可保证中西文各自使用对应字体，而非统一 fallback */
@font-face{
  font-family:"PdfTable";
  src:local("Segoe UI"),local("SF Pro Text"),local("Helvetica Neue");
  unicode-range:U+0000-024F,U+0250-02FF,U+0300-036F,U+1E00-1EFF,U+2000-206F,U+2100-214F;
}
@font-face{
  font-family:"PdfTable";
  src:local("SimSun"),local("Songti SC"),local("STSong"),local("Songti TC"),local("Noto Serif CJK SC");
  unicode-range:U+3000-303F,U+3400-4DBF,U+4E00-9FFF,U+FF00-FFEF;
}

/* ---------- 单词表格：完全还原 PDF 结构 ----------
   PDF 实测参数（fitz 解析，A4 595.3×841.9pt）：
     · 左右外框竖线：#000000，0.72pt，2 条、贯穿整表
     · 横分割线：#999999，0.72pt（表顶 + 每行之间 + 表底）
     · 行底色：#FFFFFF / #E6E6E6 交错；行高 22.75pt；表宽 459.3pt
     · 字体：Segoe UI（西文）+ SimSun（中文）；11.05pt；regular（全篇无粗体）
   线宽换算：0.72pt / 22.75pt ≈ 3.2% → 行高 46px 时 ≈ 1.5px。
   字号换算：11.05pt × (46 / 22.75) ≈ 22px → --fs-tbl
   左列宽度：最长单词 notwithstanding 158px + 角标 ≈42px + 间距 ≈ 240px 下限
   实现：竖线画在 .tbl 容器（与 PDF 的 2 条竖线一一对应）；
         横线画在每行底部（+首行顶部），用渐变绘制以保证亚像素精度。 */
#list{
  max-width:1180px;margin:0 auto;
  padding:0 clamp(18px,4vw,56px) calc(60px + env(safe-area-inset-bottom));
}
.tbl{position:relative}
/* 表格线统一用渐变背景绘制（与 PDF 一致：0.72pt ≈ 1.5px）：
   · 左右竖线：#000，每行各画 1.5px，叠加成贯穿 Unit 的竖线
   · 行间横线：#999
   与上下边线同机制绘制，保证各 DPR 下粗细表现一致 */
.row{
  display:grid;grid-template-columns:clamp(240px,24%,300px) 1fr;height:46px;
  font-family:var(--font-tbl);font-size:var(--fs-tbl);font-weight:400;
  background-color:var(--zebra-a);
  background-image:
    linear-gradient(var(--tbl-border),var(--tbl-border)),
    linear-gradient(var(--tbl-border),var(--tbl-border)),
    linear-gradient(var(--tbl-line),var(--tbl-line));
  background-size:1.5px 100%,1.5px 100%,100% 1.5px;
  background-position:left top,right top,left bottom;
  background-repeat:no-repeat;
  cursor:pointer;-webkit-user-select:none;user-select:none;overflow:hidden;
}
/* 每 50 词一个 Unit：区块之间留空，左上标注 Unit N + 下方装饰断线 */
.page-sep{
  position:relative;
  height:34px;display:flex;align-items:flex-start;justify-content:flex-start;
  padding:6px 0 0 2px;
  background:transparent;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
  font-size:13px;font-weight:600;letter-spacing:.05em;color:var(--text2);
}
/* Unit 标签下方的短横线：一条短实线，与标签左对齐，长度适中 */
.page-sep::after{
  content:"";position:absolute;left:2px;bottom:8px;width:44px;height:1.5px;
  background:var(--tbl-line);border-radius:1px;
}
/* Unit 首行：顶部边线（#000，1.5px，与侧边同粗细）+ 左右竖线 + 底部行线 */
.unit-body>.row:first-child{
  background-image:
    linear-gradient(var(--tbl-border),var(--tbl-border)),
    linear-gradient(var(--tbl-border),var(--tbl-border)),
    linear-gradient(var(--tbl-border),var(--tbl-border)),
    linear-gradient(var(--tbl-line),var(--tbl-line));
  background-size:1.5px 100%,1.5px 100%,100% 1.5px,100% 1.5px;
  background-position:left top,right top,left top,left bottom;
}
/* Unit 末行：底部边线（#000，1.5px，与侧边同粗细）+ 左右竖线 */
.unit-body>.row:last-child{
  background-image:
    linear-gradient(var(--tbl-border),var(--tbl-border)),
    linear-gradient(var(--tbl-border),var(--tbl-border)),
    linear-gradient(var(--tbl-border),var(--tbl-border));
  background-size:1.5px 100%,1.5px 100%,100% 1.5px;
  background-position:left top,right top,left bottom;
}
/* 窄屏(手机):左列收窄、字号收小(平板横屏不受影响) */
@media (max-width:600px){
  :root{--fs-tbl:17px}
  .row{grid-template-columns:minmax(150px,40%) 1fr}
}
.row.alt{background-color:var(--zebra-b)}
.row:active{background-color:var(--press-bg)}
/* 展开时不变色：保留斑马纹底色，仅由右列内容的出现表明展开状态 */
/* 默认显示模式：所有行直接显示释义（滚动懒加载填充）；点词可临时隐藏自测 */
body.defshow .row .cell-d{display:flex}
body.defshow .row.dhide .cell-d{display:none}
.cell-w{display:flex;align-items:center;gap:8px;padding:0 12px;min-width:0}
.cell-w .w{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 点击次数默认隐藏（顶栏按钮切换 body.showcounts 后显示） */
.badge{
  display:none;flex:0 0 auto;margin-left:auto;min-width:34px;text-align:center;font-size:13px;font-weight:600;
  padding:2px 7px;border-radius:10px;background:var(--badge1-bg);color:var(--badge1-fg);
}
body.showcounts .badge:not(:empty){display:inline-block}
.cell-d{display:none;align-items:center;gap:8px;padding:0 8px 0 12px;min-width:0}
.row.open .cell-d{display:flex;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.d-flow{flex:1 1 auto;display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden}
.d-phon{flex:0 0 auto;color:var(--text2)}
.d-defs{flex:0 1 auto;display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden}
.def-line{display:flex;align-items:baseline;gap:5px;min-width:0}
.def-line .def{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{
  flex:0 0 auto;font-size:14px;font-weight:700;color:var(--blue);background:var(--blue-tint);
  border-radius:6px;padding:1px 7px;
}
.d-meta{flex:0 1 auto;min-width:0;font-size:12.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif}
.speak{
  flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;
  background:var(--blue-tint);color:var(--blue);
  display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;
}
.speak svg{width:17px;height:17px}
.speak:active{transform:scale(.92)}

/* ---------- 统计面板（底部弹层） ---------- */
#sheet-scrim{
  position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;
  opacity:0;pointer-events:none;transition:opacity .28s;
}
body.sheet-open #sheet-scrim{opacity:1;pointer-events:auto}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--bg);border-radius:18px 18px 0 0;
  max-height:86vh;max-height:86dvh;display:flex;flex-direction:column;
  transform:translateY(110%);transition:transform .32s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -10px 40px rgba(0,0,0,.2);
}
body.sheet-open #sheet{transform:none}
.s-head{display:flex;flex:0 0 auto;align-items:center;justify-content:space-between;padding:14px 18px 6px}
.s-head h2{margin:0;font-size:17px;font-weight:700}
.s-done{border:none;background:none;color:var(--blue);font-size:16px;font-weight:600;cursor:pointer;padding:6px 2px}
.s-body{flex:1 1 auto;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 18px 12px}
.s-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 14px}
.s-card{background:var(--card);border-radius:14px;padding:12px 10px;text-align:center}
.s-num{font-size:22px;font-weight:700;letter-spacing:-.02em}
.s-lab{font-size:12px;color:var(--text2);margin-top:3px}
.chips{display:flex;gap:8px;margin:4px 0 10px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.chip{
  flex:0 0 auto;border:none;background:var(--card);color:var(--text);
  font-size:14px;font-weight:600;padding:7px 14px;border-radius:16px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.chip.on{background:var(--blue);color:#fff}
.chips-lab{font-size:12px;color:var(--text2);margin:8px 0 2px}
.s-cap{font-size:12px;color:var(--text2);margin:2px 0 8px;line-height:1.5}
.r-row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:.5px solid var(--sep);cursor:pointer}
.r-row:active{background:rgba(120,120,128,.1)}
.r-idx{flex:0 0 26px;font-size:13px;color:var(--text2);text-align:right}
.r-w{flex:1 1 auto;font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-c{flex:0 0 auto;font-size:13px;font-weight:700;color:var(--text2);min-width:34px;text-align:right}
.r-t{flex:0 0 auto;font-size:12px;color:var(--text2);min-width:40px;text-align:right}
.r-empty{padding:26px 0;text-align:center;color:var(--text2);font-size:14px}
.s-foot{
  flex:0 0 auto;border-top:.5px solid var(--sep);
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:12px;background:var(--bg);
}
.switch-line{display:flex;align-items:center;justify-content:space-between;font-size:14px;cursor:pointer}
.switch{position:relative;flex:0 0 auto;width:50px;height:30px}
.switch input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:2}
.switch .knob{position:absolute;inset:0;border-radius:15px;background:rgba(120,120,128,.32);transition:background .2s}
.switch .knob::before{
  content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;
  background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .2s;
}
.switch input:checked + .knob{background:#34c759}
.switch input:checked + .knob::before{transform:translateX(20px)}
.s-actions{display:flex;gap:10px}
.s-btn{
  flex:1 1 0;border:none;border-radius:12px;background:var(--card);color:var(--text);
  font-size:14px;font-weight:600;padding:11px 0;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.s-btn:active{transform:scale(.97)}
.s-btn.danger{color:var(--red)}
.s-btn.primary{background:var(--blue);color:#fff}

/* ---------- 导入 / 导出浮层 ---------- */
#io{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.45)}
body.io-open #io{display:flex}
.io-card{
  width:min(560px,100%);max-height:86vh;max-height:86dvh;background:var(--bg);border-radius:18px;
  padding:18px;display:flex;flex-direction:column;gap:10px;
}
.io-card h3{margin:0;font-size:17px}
.io-hint{margin:0;font-size:12.5px;color:var(--text2);line-height:1.5}
#io-text{
  width:100%;flex:1 1 auto;min-height:180px;resize:none;border-radius:12px;border:.5px solid var(--sep);
  background:var(--card);color:var(--text);
  font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:10px;
}
.io-btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.io-btns .s-btn{flex:0 0 auto;padding:11px 18px}

/* ---------- Toast ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));z-index:70;
  transform:translateX(-50%) translateY(16px);opacity:0;pointer-events:none;
  background:rgba(28,28,30,.92);color:#fff;font-size:13.5px;
  padding:9px 16px;border-radius:20px;max-width:80vw;text-align:center;
  transition:opacity .25s,transform .25s;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-color-scheme:dark){#toast{background:rgba(235,235,245,.95);color:#000}}
</style>
</head>

<header id="topbar">
  <div>
    <h1>1500词</h1>
    <span id="sub">加载中…</span>
  </div>
  <div class="topbar-actions">
    <button id="btn-counts" class="icon-btn" aria-label="显示点击次数" title="显示/隐藏点击次数">

    </button>
    <button id="btn-defshow" class="icon-btn" aria-label="释义默认隐藏；点击展开全部" title="默认显示/隐藏释义">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
    </button>

      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 20v-9M12 20V4M19 20v-6"/></svg>
    </button>

</header>

<div id="banner" hidden>当前打开方式无法保存点击记录（例如「文件」预览）。建议通过 Safari 打开本页，或用统计面板中的「导出数据」备份。</div>

<div id="listwrap">
  <main id="list"><div class="tbl" id="tbl"></div></main>
</div>

<div id="sheet-scrim"></div>

</section>

<div id="io">

    <div class="io-btns" id="io-btns"></div>
  </div>
</div>

<div id="toast"></div>

:1386,"word":"expert","phonetic":"ˈekspɜːrt","segs":[{"pos":"n.","def":"专家"},{"pos":"adj.","def":"内行的"}]},{"id":1387,"word":"tactic","phonetic":"ˈtæktɪk","segs":[{"pos":"n.","def":"策略；战术"}]},{"id":1388,"word":"dropout","phonetic":"ˈdrɑːpaʊt","segs":[{"pos":"n.","def":"辍学者"}]},{"id":1389,"word":"sacred","phonetic":"ˈseɪkrɪd","segs":[{"pos":"adj.","def":"神圣的"}]},{"id":1390,"word":"restrict","phonetic":"rɪˈstrɪkt","segs":[{"pos":"v.","def":"限制，妨碍"}]},{"id":1391,"word":"minor","phonetic":"ˈmaɪnər","segs":[{"pos":"adj.","def":"较小的"}]},{"id":1392,"word":"ancestor","phonetic":"ˈænsestər","segs":[{"pos":"n.","def":"祖先"}]},{"id":1393,"word":"conceive","phonetic":"kənˈsiːv","segs":[{"pos":"v.","def":"想象；构想；怀孕"}]},{"id":1394,"word":"concrete","phonetic":"ˈkɒŋkriːt","segs":[{"pos":"adj.","def":"具体的"},{"pos":"n.","def":"混凝土"}]},{"id":1395,"word":"compose","phonetic":"kəmˈpoʊz","segs":[{"pos":"v.","def":"组成；写"}]},{"id":1396,"word":"communication","phonetic":"kəˌmjuːnɪˈkeɪʃən","segs":[{"pos":"n.","def":"沟通，交流"}]},{"id":1397,"word":"clockwise","phonetic":"ˈklɑːkwaɪz","segs":[{"pos":"adj.","def":"顺时针方向的"}]},{"id":1398,"word":"vulnerable","phonetic":"ˈvʌlnərəbəl","segs":[{"pos":"adj.","def":"脆弱的，易受伤的"}]},{"id":1399,"word":"reluctant","phonetic":"rɪˈlʌktənt","segs":[{"pos":"adj.","def":"不情愿的，勉强的"}]},{"id":1400,"word":"vertical","phonetic":"ˈvɜːrtɪkəl","segs":[{"pos":"adj.","def":"垂直的；纵向的"}]},{"id":1401,"word":"coastal","phonetic":"ˈkoʊstəl","segs":[{"pos":"adj.","def":"海岸的"}]},{"id":1402,"word":"relentless","phonetic":"rɪˈlentləs","segs":[{"pos":"adj.","def":"不懈的；无情的"}]},{"id":1403,"word":"ideology","phonetic":"ˌaɪdiˈɑːlədʒi","segs":[{"pos":"n.","def":"意识形态，思想体系"}]},{"id":1404,"word":"ensure","phonetic":"ɪnˈʃʊr","segs":[{"pos":"v.","def":"确保"}]},{"id":1405,"word":"automobile","phonetic":"ˈɔːtəməbiːl","segs":[{"pos":"n.","def":"汽车"}]},{"id":1406,"word":"delight","phonetic":"dɪˈlaɪt","segs":[{"pos":"v.","def":"使高兴"},{"pos":"n.","def":"高兴"}]},{"id":1407,"word":"satisfaction","phonetic":"ˌsætɪsˈfækʃən","segs":[{"pos":"n.","def":"满意"}]},{"id":1408,"word":"expectation","phonetic":"ˌekspekˈteɪʃən","segs":[{"pos":"n.","def":"期望"}]},{"id":1409,"word":"adventure","phonetic":"ədˈventʃər","segs":[{"pos":"n.","def":"冒险"}]},{"id":1410,"word":"lazy","phonetic":"ˈleɪzi","segs":[{"pos":"adj.","def":"懒惰的"}]},{"id":1411,"word":"sincere","phonetic":"sɪnˈsɪr","segs":[{"pos":"adj.","def":"真诚的，诚实的"}]},{"id":1412,"word":"context","phonetic":"ˈkɑːntekst","segs":[{"pos":"n.","def":"上下文，背景"}]},{"id":1413,"word":"allege","phonetic":"əˈledʒ","segs":[{"pos":"v.","def":"断言；声称"}]},{"id":1414,"word":"vital","phonetic":"ˈvaɪtəl","segs":[{"pos":"adj.","def":"至关重要的"}]},{"id":1415,"word":"loop","phonetic":"luːp","segs":[{"pos":"n.","def":"圈；循环"},{"pos":"v.","def":"使成环"}]},{"id":1416,"word":"enhance","phonetic":"ɪnˈhæns","segs":[{"pos":"v.","def":"提高，增强"}]},{"id":1417,"word":"seize","phonetic":"siːz","segs":[{"pos":"v.","def":"抓住；夺取"}]},{"id":1418,"word":"aggressive","phonetic":"əˈɡresɪv","segs":[{"pos":"adj.","def":"侵略的；有进取心的"}]},{"id":1419,"word":"dissertation","phonetic":"ˌdɪsərˈteɪʃən","segs":[{"pos":"n.","def":"专业论文"}]},{"id":1420,"word":"surveillance","phonetic":"sərˈveɪləns","segs":[{"pos":"n.","def":"监视"}]},{"id":1421,"word":"headline","phonetic":"ˈhedlaɪn","segs":[{"pos":"n.","def":"标题；大字标题"}]},{"id":1422,"word":"stare","phonetic":"ster","segs":[{"pos":"v.","def":"凝视，盯"}]},{"id":1423,"word":"signal","phonetic":"ˈsɪɡnəl","segs":[{"pos":"n.","def":"信号"},{"pos":"v.","def":"预示"}]},{"id":1424,"word":"liberate","phonetic":"ˈlɪbəreɪt","segs":[{"pos":"v.","def":"释放；解放"}]},{"id":1425,"word":"internal","phonetic":"ɪnˈtɜːrnəl","segs":[{"pos":"adj.","def":"内部的"}]},{"id":1426,"word":"communicate","phonetic":"kəˈmjuːnɪkeɪt","segs":[{"pos":"v.","def":"沟通"}]},{"id":1427,"word":"consistent","phonetic":"kənˈsɪstənt","segs":[{"pos":"adj.","def":"一致的，持续的"}]},{"id":1428,"word":"ensure","phonetic":"ɪnˈʃʊr","segs":[{"pos":"v.","def":"确保，保证"}]},{"id":1429,"word":"hide","phonetic":"haɪd","segs":[{"pos":"v.","def":"隐藏"}]},{"id":1430,"word":"refute","phonetic":"rɪˈfjuːt","segs":[{"pos":"v.","def":"驳斥，反驳"}]},{"id":1431,"word":"overcome","phonetic":"ˌoʊvərˈkʌm","segs":[{"pos":"v.","def":"克服，解决"}]},{"id":1432,"word":"remnant","phonetic":"ˈremnənt","segs":[{"pos":"n.","def":"残余部分，剩余部分"}]},{"id":1433,"word":"dominate","phonetic":"ˈdɑːmɪneɪt","segs":[{"pos":"v.","def":"支配，占主导"}]},{"id":1434,"word":"damage","phonetic":"ˈdæmɪdʒ","segs":[{"pos":"n.","def":"伤害"},{"pos":"v.","def":"损害"}]},{"id":1435,"word":"deficient","phonetic":"dɪˈfɪʃənt","segs":[{"pos":"adj.","def":"缺乏的；不足的"}]},{"id":1436,"word":"renovate","phonetic":"ˈrenəveɪt","segs":[{"pos":"v.","def":"翻新，修复"}]},{"id":1437,"word":"stock","phonetic":"stɑːk","segs":[{"pos":"n.","def":"股票，库存"},{"pos":"v.","def":"储存"}]},{"id":1438,"word":"ladder","phonetic":"ˈlædər","segs":[{"pos":"n.","def":"梯子"}]}]}</script>
<script>
(function () {
  'use strict';

  var DATA;
  try {
    DATA = JSON.parse(document.getElementById('app-data').textContent);
  } catch (e) {
    document.body.innerHTML = '<p style="padding:24px;font:16px/1.6 -apple-system,sans-serif">这是模板文件，请先运行 build_app.py 生成正式 HTML。</p>';
    return;
  }
  var WORDS = DATA.words;
  var TOTAL = WORDS.length;
  var byId = {};
  WORDS.forEach(function (w) { byId[w.id] = w; });

  var GROUP = 50;                 // 每 50 词一页
  var PAGES = Math.ceil(TOTAL / GROUP);
  var ROW_H = 46, SEP_H = 34;     // 行高 / 页分隔带高度（与 CSS 保持一致）

  /* ================= 存储 ================= */
  var LS_CLICKS = 'kaoyan1500.clicks.v1';
  var LS_AUTO = 'kaoyan1500.autospeak.v1';
  var LS_DEFSHOW = 'kaoyan1500.defaultshow.v1';
  var LS_COUNTS = 'kaoyan1500.showcounts.v1';
  var memClicks = null;

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  var lsOK = (function () {
    if (!lsSet('__t', '1')) return false;
    try { localStorage.removeItem('__t'); } catch (e) {}
    return true;
  })();
  var showCounts = lsGet(LS_COUNTS) === '1';

  var clicks = {};
  (function () {
    var s = lsGet(LS_CLICKS);
    if (s) { try { clicks = JSON.parse(s) || {}; } catch (e) { clicks = {}; } }
    memClicks = clicks;
  })();
  function persist() {
    lsSet(LS_CLICKS, JSON.stringify(clicks));
    memClicks = clicks;
  }

  /* ================= 工具 ================= */
  function fmtDate(ts) {
    if (!ts) return '';
    var d = new Date(ts), n = new Date();
    if (d.toDateString() === n.toDateString()) return '今天';
    var y = new Date(n.getTime() - 86400000);
    if (d.toDateString() === y.toDateString()) return '昨天';
    return (d.getMonth() + 1) + '-' + d.getDate();
  }
  function stamp() {
    var d = new Date(), p = function (x) { return (x < 10 ? '0' : '') + x; };
    return '' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate());
  }
  var toastEl = document.getElementById('toast');
  var toastTimer = 0;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1700);
  }

  /* ================= 表格 ================= */
  var listEl = document.getElementById('list');
  var tblEl = document.getElementById('tbl');
  var subEl = document.getElementById('sub');
  var rowRefs = {};
  var frag = document.createDocumentFragment();
  var speakSvg = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M15.8 8.7a4.4 4.4 0 010 6.6M18.4 6a7.8 7.8 0 010 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>';

  function makePageSep(unitNo) {
    var sep = document.createElement('div');
    sep.className = 'page-sep';
    var s = document.createElement('span');
    s.textContent = 'Unit ' + unitNo;
    sep.appendChild(s);
    return sep;
  }
  var unitBody = null;
  WORDS.forEach(function (w, i) {
    if (i % GROUP === 0) {
      frag.appendChild(makePageSep(i / GROUP + 1));
      unitBody = document.createElement('div');
      unitBody.className = 'unit-body';
      frag.appendChild(unitBody);
    }
    var row = document.createElement('div');
    row.className = 'row' + (i % 2 ? ' alt' : '');
    row.dataset.id = w.id;

    // 左列：单词 + 点击角标
    var cw = document.createElement('div');
    cw.className = 'cell-w';
    var t = document.createElement('span');
    t.className = 'w';
    t.textContent = w.word;
    var b = document.createElement('span');
    b.className = 'badge';
    cw.appendChild(t);
    cw.appendChild(b);

    // 右列：音标 + 发音按钮 + 释义（默认隐藏，随展开填充）
    var cd = document.createElement('div');
    cd.className = 'cell-d';
    row.appendChild(cw);
    row.appendChild(cd);
    unitBody.appendChild(row);
    rowRefs[w.id] = { row: row, badge: b, cellW: cw, cellD: cd, filled: false };
  });
  tblEl.appendChild(frag);

  function refreshBadge(id) {
    var ref = rowRefs[id];
    if (!ref) return;
    var rec = clicks[id];
    if (rec && rec.c > 0) {
      ref.badge.textContent = '×' + rec.c;
    } else {
      ref.badge.textContent = '';
      ref.badge.className = 'badge';
    }
  }
  function refreshAllBadges() { for (var k in rowRefs) refreshBadge(k); }

  function computeStats() {
    var seen = 0, tc = 0;
    for (var k in clicks) {
      var c = (clicks[k] && clicks[k].c) || 0;
      if (c > 0) { seen++; tc += c; }
    }
    return { seen: seen, total: tc };
  }
  function updateSub() {
    var base = '共 ' + TOTAL + ' 词 · ' + PAGES + ' 个 Unit';
    if (!showCounts) { subEl.textContent = base; return; }
    var s = computeStats();
    subEl.textContent = base + ' · 已查 ' + s.seen + ' · 点击 ' + s.total;
  }

  /* ================= 发音 ================= */
  var voices = [];
  function pickVoice() {
    try { if (!voices.length) voices = window.speechSynthesis.getVoices() || []; } catch (e) { voices = []; }
    var i, v;
    for (i = 0; i < voices.length; i++) {
      v = voices[i];
      if (/^en[-_](US|GB)/i.test(v.lang) && /Samantha|Alex|Ava|Daniel|Karen|Moira|Google/i.test(v.name)) return v;
    }
    for (i = 0; i < voices.length; i++) { v = voices[i]; if (/^en[-_]US/i.test(v.lang)) return v; }
    for (i = 0; i < voices.length; i++) { v = voices[i]; if (/^en/i.test(v.lang)) return v; }
    return null;
  }
  function speak(text) {
    if (!('speechSynthesis' in window)) { toast('当前环境不支持朗读'); return; }
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = 0.9; u.pitch = 1; u.volume = 1;
      var v = pickVoice();
      if (v) u.voice = v;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  if ('speechSynthesis' in window) {
    try {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = function () {
        try { voices = window.speechSynthesis.getVoices() || []; } catch (e) {}
      };
    } catch (e) {}
  }
  var LS_AUTO_VAL = lsGet(LS_AUTO) === '1';
  var autoSpeak = LS_AUTO_VAL;
  var chkAuto = document.getElementById('chk-auto');
  chkAuto.checked = autoSpeak;
  chkAuto.addEventListener('change', function () {
    autoSpeak = chkAuto.checked;
    lsSet(LS_AUTO, autoSpeak ? '1' : '0');
  });

  /* ================= 行内展开 / 收起（支持多个单词同时展开） ================= */
  function fillDetail(ref, w) {
    if (ref.filled) return;
    var cd = ref.cellD;

    // 左：音标 + 释义（单行流式，超出省略，保证行高不变）
    var flow = document.createElement('div');
    flow.className = 'd-flow';
    var ph = document.createElement('span');
    ph.className = 'd-phon';
    ph.textContent = '[' + w.phonetic + ']';
    flow.appendChild(ph);

    var defs = document.createElement('div');
    defs.className = 'd-defs';
    w.segs.forEach(function (s) {
      var line = document.createElement('div');
      line.className = 'def-line';
      if (s.pos) {
        var p = document.createElement('span');
        p.className = 'pos';
        p.textContent = s.pos;
        line.appendChild(p);
      }
      var d = document.createElement('span');
      d.className = 'def';
      d.textContent = s.def;
      line.appendChild(d);
      defs.appendChild(line);
    });
    flow.appendChild(defs);

    // 右：发音按钮 + 计数
    var sp = document.createElement('button');
    sp.className = 'speak';
    sp.type = 'button';
    sp.setAttribute('aria-label', '朗读');
    sp.innerHTML = speakSvg;
    sp.addEventListener('click', function (e) {
      e.stopPropagation();   // 发音按钮不触发行折叠
      speak(w.word);
    });

    var meta = document.createElement('div');
    meta.className = 'd-meta';
    ref.meta = meta;

    cd.appendChild(flow);
    cd.appendChild(sp);
    cd.appendChild(meta);
    ref.filled = true;
  }

  function updateMeta(ref, id) {
    if (!ref.meta) return;
    if (!showCounts) { ref.meta.textContent = ''; return; }
    var r = clicks[id] || { c: 0, t: 0 };
    ref.meta.textContent = r.t ? ('点击 ' + r.c + ' 次 · ' + fmtDate(r.t)) : '';
  }

  function countClick(id) {
    var rec = clicks[id];
    if (!rec) { rec = clicks[id] = { c: 0, t: 0 }; }
    rec.c += 1;
    rec.t = Date.now();
    persist();
    refreshBadge(id);
    updateSub();
    var ref = rowRefs[id];
    if (ref) updateMeta(ref, id);
  }

  function expand(id, opts) {
    opts = opts || {};
    var w = byId[id];
    var ref = rowRefs[id];
    if (!w || !ref) return;

    if (opts.count !== false) countClick(id);

    fillDetail(ref, w);
    updateMeta(ref, id);
    ref.row.classList.add('open');

    if (!opts.silent && autoSpeak) speak(w.word);
  }

  function collapseRow(id) {
    var ref = rowRefs[id];
    if (!ref) return;
    ref.row.classList.remove('open');
  }

  function collapseAll() {
    var opened = document.querySelectorAll('.row.open');
    for (var i = 0; i < opened.length; i++) opened[i].classList.remove('open');
    var hidden = document.querySelectorAll('.row.dhide');
    for (var j = 0; j < hidden.length; j++) hidden[j].classList.remove('dhide');
  }

  /* ================= 默认显示 / 隐藏释义（顶栏开关） ================= */
  var defaultShow = lsGet(LS_DEFSHOW) === '1';
  var btnDefShow = document.getElementById('btn-defshow');
  var SVG_EYE = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  var SVG_EYE_OFF = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

  function applyDefShowBtn() {
    btnDefShow.classList.toggle('on', defaultShow);
    btnDefShow.innerHTML = defaultShow ? SVG_EYE : SVG_EYE_OFF;
    btnDefShow.setAttribute('aria-label',
      defaultShow ? '释义默认显示；点击收起全部' : '释义默认隐藏；点击展开全部');
  }

  /* 仅填充可视范围内的行（惰性渲染；坐标含每 50 词一个的 Unit 留白） */
  var AVG = ROW_H + SEP_H / GROUP;
  function rowTop(i) { return SEP_H * (Math.floor(i / GROUP) + 1) + ROW_H * i; }
  function rowIndexAt(y) {
    if (y <= SEP_H) return 0;
    var i = Math.floor((y - SEP_H) / AVG);
    if (i < 0) i = 0;
    if (i > TOTAL - 1) i = TOTAL - 1;
    while (i > 0 && rowTop(i) > y) i--;
    while (i < TOTAL - 1 && rowTop(i + 1) <= y) i++;
    return i;
  }
  function fillVisible() {
    if (!defaultShow) return;
    var tr = tblEl.getBoundingClientRect();
    var yTop = -tr.top;
    var first = rowIndexAt(yTop) - 6;
    var last = rowIndexAt(yTop + window.innerHeight) + 6;
    if (first < 0) first = 0;
    if (last > WORDS.length - 1) last = WORDS.length - 1;
    for (var i = first; i <= last; i++) {
      var w = WORDS[i];
      var ref = rowRefs[w.id];
      if (ref && !ref.filled) {
        fillDetail(ref, w);
        updateMeta(ref, w.id);
      }
    }
  }

  var visPending = false;
  function onScrollVis() {
    if (visPending || !defaultShow) return;
    visPending = true;
    requestAnimationFrame(function () { visPending = false; fillVisible(); });
  }
  window.addEventListener('scroll', onScrollVis, { passive: true });
  window.addEventListener('resize', onScrollVis, { passive: true });

  function setDefaultShow(on) {
    defaultShow = on;
    lsSet(LS_DEFSHOW, on ? '1' : '0');
    document.body.classList.toggle('defshow', on);
    applyDefShowBtn();
    if (on) {
      fillVisible();
      toast('已显示全部释义 · 点单词可临时隐藏自测');
    } else {
      collapseAll();
      toast('已切换为点击查看释义');
    }
  }

  btnDefShow.addEventListener('click', function () { setDefaultShow(!defaultShow); });

  /* ================= 点击次数显示开关（顶栏） ================= */
  var btnCounts = document.getElementById('btn-counts');
  function applyCountsBtn() {
    btnCounts.classList.toggle('on', showCounts);
    btnCounts.setAttribute('aria-label', showCounts ? '隐藏点击次数' : '显示点击次数');
  }
  function setShowCounts(on) {
    showCounts = on;
    lsSet(LS_COUNTS, on ? '1' : '0');
    document.body.classList.toggle('showcounts', on);
    applyCountsBtn();
    refreshAllBadges();
    updateSub();
    for (var k in rowRefs) { if (rowRefs[k].filled) updateMeta(rowRefs[k], Number(k)); }
    toast(on ? '已显示点击次数' : '已隐藏点击次数');
  }
  btnCounts.addEventListener('click', function () { setShowCounts(!showCounts); });

  listEl.addEventListener('click', function (e) {
    var row = e.target.closest('.row');
    if (!row) return;
    var id = Number(row.dataset.id);
    if (defaultShow) {
      /* 默认显示模式下：点词隐藏自测，再点显示并计一次点击 */
      var ref = rowRefs[id];
      if (ref && !ref.filled) { fillDetail(ref, byId[id]); updateMeta(ref, id); }
      if (row.classList.contains('dhide')) {
        row.classList.remove('dhide');
        countClick(id);
        if (autoSpeak) speak(byId[id].word);
      } else {
        row.classList.add('dhide');
      }
      return;
    }
    if (row.classList.contains('open')) collapseRow(id);
    else expand(id);
  });

  /* ================= 统计面板 ================= */
  var sheet = document.getElementById('sheet');
  var sheetScrim = document.getElementById('sheet-scrim');
  var cardsEl = document.getElementById('s-cards');
  var capEl = document.getElementById('s-cap');
  var chipsEl = document.getElementById('chips');
  var rankEl = document.getElementById('rank');
  var sheetOpen = false;
  var filter = 'seen';
  var CAP = {
    seen: '按点击次数排序；点击越多说明越不熟，可直接点词条打开。',
    unseen: '还没点过的单词，点词条开始学习。',
    ge2: '点击 ≥2 次的单词。',
    ge3: '点击 ≥3 次的单词，重点复习。'
  };
  var TIME_LABEL = { all: '全部时间', today: '今天', '7d': '近 7 天', '30d': '近 30 天' };
  var timeFilter = 'all';
  var chipsTimeEl = document.getElementById('chips-time');

  /* 时间过滤：依据最近一次点击时间 */
  function inTimeRange(rec) {
    if (timeFilter === 'all') return true;
    var t = (rec && rec.t) || 0;
    if (!t) return false;
    if (timeFilter === 'today') {
      var d = new Date(t), n = new Date();
      return d.toDateString() === n.toDateString();
    }
    if (timeFilter === '7d') return Date.now() - t <= 7 * 86400000;
    if (timeFilter === '30d') return Date.now() - t <= 30 * 86400000;
    return true;
  }
  /* 概览卡：开启时间筛选时只统计范围内单词（次数为词累计点击） */
  function computeStatsRange() {
    if (timeFilter === 'all') return computeStats();
    var seen = 0, tc = 0;
    for (var k in clicks) {
      var r = clicks[k];
      if (!r || !r.c) continue;
      if (!inTimeRange(r)) continue;
      seen++; tc += r.c;
    }
    return { seen: seen, total: tc };
  }

  function renderSummary() {
    var s = computeStatsRange();
    var pct = TOTAL ? s.seen / TOTAL * 100 : 0;
    var pctStr = pct >= 10 ? pct.toFixed(0) : pct >= 1 ? pct.toFixed(1) : pct > 0 ? pct.toFixed(2) : '0';
    cardsEl.innerHTML =
      '<div class="s-card"><div class="s-num">' + s.seen + '</div><div class="s-lab">已查单词</div></div>' +
      '<div class="s-card"><div class="s-num">' + s.total + '</div><div class="s-lab">总点击</div></div>' +
      '<div class="s-card"><div class="s-num">' + pctStr + '%</div><div class="s-lab">覆盖率</div></div>';
  }

  function renderRank() {
    capEl.textContent = (CAP[filter] || '') +
      (timeFilter !== 'all' ? '（时间筛选：' + TIME_LABEL[timeFilter] + '；依据最近一次点击）' : '');
    var arr = WORDS.filter(function (w) {
      var rec = clicks[w.id];
      var c = (rec && rec.c) || 0;
      if (filter === 'unseen') return c === 0;
      if (filter === 'seen' && c <= 0) return false;
      if (filter === 'ge2' && c < 2) return false;
      if (filter === 'ge3' && c < 3) return false;
      return inTimeRange(rec);
    });
    if (filter === 'seen' || filter === 'ge2' || filter === 'ge3') {
      arr.sort(function (a, b) {
        var ca = clicks[a.id] || { c: 0, t: 0 }, cb = clicks[b.id] || { c: 0, t: 0 };
        return cb.c - ca.c || cb.t - ca.t || a.id - b.id;
      });
    }
    rankEl.innerHTML = '';
    if (!arr.length) {
      var empty = document.createElement('div');
      empty.className = 'r-empty';
      empty.textContent = (timeFilter !== 'all' && filter !== 'unseen')
        ? '该时间范围内没有符合条件的记录'
        : (filter === 'seen' ? '还没有点击记录，去列表里点几个单词吧' : '没有符合条件的单词');
      rankEl.appendChild(empty);
      return;
    }
    var f = document.createDocumentFragment();
    arr.forEach(function (w, i) {
      var rec = clicks[w.id] || { c: 0, t: 0 };
      var row = document.createElement('div');
      row.className = 'r-row';
      row.dataset.id = w.id;
      var idx = document.createElement('span');
      idx.className = 'r-idx';
      idx.textContent = (filter === 'seen' || filter === 'ge2' || filter === 'ge3') ? String(i + 1) : '';
      var wd = document.createElement('span');
      wd.className = 'r-w';
      wd.textContent = w.word;
      var cEl = document.createElement('span');
      cEl.className = 'r-c';
      cEl.textContent = rec.c > 0 ? '×' + rec.c : '';
      var tEl = document.createElement('span');
      tEl.className = 'r-t';
      tEl.textContent = rec.c > 0 ? fmtDate(rec.t) : '';
      row.appendChild(idx); row.appendChild(wd); row.appendChild(cEl); row.appendChild(tEl);
      f.appendChild(row);
    });
    rankEl.appendChild(f);
  }

  function openSheet() {
    renderSummary();
    renderRank();
    document.body.classList.add('sheet-open');
    sheet.setAttribute('aria-hidden', 'false');
    sheetOpen = true;
  }
  function closeSheet() {
    document.body.classList.remove('sheet-open');
    sheet.setAttribute('aria-hidden', 'true');
    sheetOpen = false;
  }

  document.getElementById('btn-stats').addEventListener('click', openSheet);
  document.getElementById('sheet-done').addEventListener('click', closeSheet);
  sheetScrim.addEventListener('click', closeSheet);
  chipsEl.addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    filter = b.dataset.f;
    for (var i = 0; i < chipsEl.children.length; i++) {
      chipsEl.children[i].classList.toggle('on', chipsEl.children[i] === b);
    }
    renderRank();
  });
  chipsTimeEl.addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    timeFilter = b.dataset.t;
    for (var i = 0; i < chipsTimeEl.children.length; i++) {
      chipsTimeEl.children[i].classList.toggle('on', chipsTimeEl.children[i] === b);
    }
    renderSummary();
    renderRank();
  });
  rankEl.addEventListener('click', function (e) {
    var row = e.target.closest('.r-row');
    if (!row) return;
    var id = Number(row.dataset.id);
    closeSheet();
    rowRefs[id].row.scrollIntoView({ block: 'center' });
    expand(id);
  });

  /* ================= 导入 / 导出 ================= */
  var io = document.getElementById('io');
  var ioTitle = document.getElementById('io-title');
  var ioHint = document.getElementById('io-hint');
  var ioText = document.getElementById('io-text');
  var ioBtns = document.getElementById('io-btns');
  var ioOpen = false;
  io.addEventListener('click', function (e) { if (e.target === io && ioOpen) closeIO(); });

  function openIO(title, hint, text, buttons) {
    ioTitle.textContent = title;
    ioHint.textContent = hint;
    ioText.value = text;
    ioBtns.innerHTML = '';
    buttons.forEach(function (b) {
      var el = document.createElement('button');
      el.className = 's-btn' + (b.primary ? ' primary' : '');
      el.textContent = b.t;
      el.addEventListener('click', b.fn);
      ioBtns.appendChild(el);
    });
    document.body.classList.add('io-open');
    ioOpen = true;
  }
  function closeIO() {
    document.body.classList.remove('io-open');
    ioOpen = false;
  }

  function copyText(text, done) {
    function fallback() {
      var ok = false;
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        ok = document.execCommand('copy');
        ta.remove();
      } catch (e) { ok = false; }
      done(ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, fallback);
    } else fallback();
  }
  function download(name, text) {
    try {
      var blob = new Blob([text], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
      return true;
    } catch (e) { return false; }
  }
  function mergeClicks(obj) {
    var src = (obj && obj.clicks && typeof obj.clicks === 'object') ? obj.clicks : obj;
    if (!src || typeof src !== 'object') return -1;
    var n = 0;
    for (var k in src) {
      if (!/^\d{1,5}$/.test(k)) continue;
      var r = src[k];
      if (!r || typeof r !== 'object') continue;
      var c = Math.floor(Number(r.c));
      if (!isFinite(c) || c <= 0) continue;
      var t = Number(r.t) || 0;
      var cur = clicks[k];
      if (!cur) cur = clicks[k] = { c: 0, t: 0 };
      cur.c += c;
      if (t > cur.t) cur.t = t;
      n++;
    }
    if (n) { persist(); refreshAllBadges(); updateSub(); }
    return n;
  }

  document.getElementById('btn-export').addEventListener('click', function () {
    var payload = { app: 'kaoyan1500', version: 1, exportedAt: new Date().toISOString(), clicks: clicks };
    var text = JSON.stringify(payload, null, 1);
    openIO('导出数据',
      '数据只保存在本机浏览器。换设备或清理浏览器数据前建议先导出；把 JSON 传到新设备后用「导入数据」合并即可。',
      text,
      [
        { t: '复制', fn: function () { copyText(text, function (ok) { toast(ok ? '已复制到剪贴板' : '复制失败，请手动选择复制'); }); } },
        { t: '下载 .json', fn: function () { toast(download('clicks_' + stamp() + '.json', text) ? '已开始下载' : '下载不可用，请手动复制'); } },
        { t: '完成', primary: true, fn: closeIO }
      ]);
  });
  document.getElementById('btn-import').addEventListener('click', function () {
    openIO('导入数据',
      '粘贴此前导出的 JSON 内容后点「合并导入」。注意：同一份数据重复导入会重复累加次数。',
      '',
      [
        { t: '取消', fn: closeIO },
        {
          t: '合并导入', primary: true, fn: function () {
            var txt = ioText.value.trim();
            if (!txt) { toast('请先粘贴 JSON 内容'); return; }
            var obj;
            try { obj = JSON.parse(txt); } catch (e) { toast('JSON 解析失败'); return; }
            var n = mergeClicks(obj);
            if (n < 0) { toast('数据格式不正确'); return; }
            closeIO();
            toast('已合并 ' + n + ' 个词条');
            if (sheetOpen) { renderSummary(); renderRank(); }
          }
        }
      ]);
  });
  document.getElementById('btn-clear').addEventListener('click', function () {
    if (!confirm('确定清空所有点击记录？此操作不可撤销（建议先导出备份）。')) return;
    clicks = {};
    persist();
    refreshAllBadges();
    updateSub();
    renderSummary();
    renderRank();
    toast('已清空');
  });

  /* ================= 其它 ================= */
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (ioOpen) closeIO();
    else if (sheetOpen) closeSheet();
    else collapseAll();
  });

  var banner = document.getElementById('banner');
  var LS_TIP = 'kaoyan1500.homescreen-tip.v1';
  banner.addEventListener('click', function () {
    banner.hidden = true;
    if (banner.dataset.kind === 'tip') lsSet(LS_TIP, '1');
  });

  refreshAllBadges();
  updateSub();
  applyDefShowBtn();
  applyCountsBtn();
  if (showCounts) document.body.classList.add('showcounts');
  if (defaultShow) {
    document.body.classList.add('defshow');
    requestAnimationFrame(function () { fillVisible(); });
  }

  var ua = navigator.userAgent;
  var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isSafari = /Safari\//.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
  var standalone = window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);

  if (!lsOK) {
    banner.textContent = '当前打开方式无法保存点击记录（例如「文件」预览）。建议通过 Safari 打开本页，或用统计面板中的「导出数据」备份。';
    banner.dataset.kind = 'warn';
    banner.hidden = false;
  } else if (isIOS && isSafari && !standalone && lsGet(LS_TIP) !== '1') {
    banner.textContent = '💡 点「分享 → 添加到主屏幕」，即可全屏离线使用、记录长期保留。点此关闭提示。';
    banner.dataset.kind = 'tip';
    banner.hidden = false;
  }
})();
</script>
</body>
</html>
