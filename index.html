  function collapseAll() {
    /* Esc：清除展开动画态，并把所有行恢复到当前模式默认显隐状态 */
    var opened = document.querySelectorAll('.row.open');
    for (var i = 0; i < opened.length; i++) opened[i].classList.remove('open');
    applyModeToRows();
  }

  /* ================= 显示模式（顶栏三态开关） =================
     三态含义（按表格两列划分，两列宽度始终保留）：
       left  = 仅左侧：只显示英文单词（隐藏右列音标+词性+翻译）
       right = 仅右侧：只显示音标+词性+翻译（隐藏单词文字，左列宽度保留）
       both  = 两侧一起（全部显示）
     模式循环：left → right → both → left …
     图标：左块实心=仅左侧（单词） / 右块实心=仅右侧（音标+词性+翻译） / 双块实心=两侧一起 */
  var DEFMODE_KEY = lsGet(LS_DEFMODE) || '';
  var defmode = (DEFMODE_KEY === 'left' || DEFMODE_KEY === 'right' || DEFMODE_KEY === 'both') ? DEFMODE_KEY :
                (DEFMODE_KEY === 'en' ? 'left' : DEFMODE_KEY === 'zh' ? 'right' :
                 (lsGet(LS_DEFSHOW) === '1' ? 'both' : 'left'));   /* 默认：仅左侧（英文单词） */
  var btnDefShow = document.getElementById('btn-defshow');
  /* 图标：用「左块/右块」直观表达哪一侧显示 */
  var SVG_LEFT = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="8" height="14" rx="1.5" fill="currentColor" stroke="none"/><rect x="13" y="5" width="8" height="14" rx="1.5"/></svg>';

  /* 仅填充可视范围内的行（惰性渲染）
     按「实际几何位置」测量，不再用固定行高公式推算：
     手机竖屏下释义会换行、行高不统一，固定公式会算错位置导致可视行漏填（空白行）。
     两遍处理：先只读测量（避免读写交替触发反复布局），再统一写入。 */
  var FILL_MARGIN = 400;   // 视口外预填范围（px），滚动时基本看不到正在填充
  function fillVisible() {
    if (!defmode) return 0;
    var box = listWrapEl.getBoundingClientRect();     /* 滚动容器的可视区域 */
    var lo = box.top - FILL_MARGIN, hi = box.bottom + FILL_MARGIN;
    var todo = null;
    var kids = tblEl.children;                    // page-sep 与 unit-body 交替
    for (var i = 0; i < kids.length; i++) {
      var unit = kids[i];
      if (!unit.classList.contains('unit-body')) continue;
      var ur = unit.getBoundingClientRect();
      if (ur.bottom < lo || ur.top > hi) continue;   // 整个 Unit 不在范围内
      var rows = unit.children;
      for (var j = 0; j < rows.length; j++) {
        var el = rows[j];
        var rr = el.getBoundingClientRect();
        if (rr.bottom < lo || rr.top > hi) continue;
        var ref = rowRefs[Number(el.dataset.id)];
        if (ref && !ref.filled) (todo || (todo = [])).push(ref, byId[Number(el.dataset.id)]);
      }
    }
    if (!todo) return 0;
    for (var k = 0; k < todo.length; k += 2) fillDetail(todo[k], todo[k + 1]);

    left = Math.max(M, Math.min(left, vw - pr.width - M));

    var above = btnTop - pr.height - 10 >= M;
    var top = above ? (btnTop - pr.height - 10) : (btnBottom + 10);
    if (top + pr.height > vh - M) top = Math.max(M, vh - pr.height - M);
    popEl.classList.toggle('above', above);

  function escHtml(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* 用本 Unit 词表生成一个「长词优先」的正则：能正确处理 up-to-date 这类带连字符的词，
     也能在 judge's 这种所有格里命中 judge。 */
  function buildWordRegex(map) {
    var keys = Object.keys(map).sort(function (a, b) { return b.length - a.length; });
    if (!keys.length) return null;
    var body = keys.map(function (k) { return k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|');
    return new RegExp('\\b(?:' + body + ')\\b', 'gi');
  }

  /* 把段落里属于本 Unit 的单词包成可点的 <span class="art-w">（其余文字原样转义输出） */
  function markUnitWords(text, map) {
    var re = buildWordRegex(map);
    if (!re) return escHtml(text);
    var out = '', last = 0, m;
    while ((m = re.exec(text))) {
      var id = map[m[0].toLowerCase()];
      if (id === undefined) continue;
      out += escHtml(text.slice(last, m.index));
      out += '<span class="art-w" data-id="' + id + '">' + escHtml(m[0]) + '</span>';
      last = m.index + m[0].length;
    }
    return out + escHtml(text.slice(last));
  }

  /* 译文里的 [[word|中文]] 标注 → 带下划线的 span（不标蓝） */
  function markZhWords(text, map) {
    var out = '', last = 0, m;
    var re = /\[\[([A-Za-z][A-Za-z'\u2019]*)\|([^\]]*)\]\]/g;
    while ((m = re.exec(text))) {

  /* ================= 云同步（GitHub 私有仓库，自动） =================
     原理：把 syncDoc 存到仓库里的一个 JSON 文件；打开页面 / 数据变化时
     自动「拉取 → 合并 → 需要时回传」，两台设备通过该文件汇合。
     冲突：回传带 SHA；若另一台刚写过 → 重拉合并后重试（最多 3 次）。
     Token 只存本机，仅用于读写该仓库。 */
  var ghCfg = (function () {
    var d = { repo: '', path: 'progress.json', branch: 'main', token: '', auto: true };
    try {
      var s = lsGet(LS_GH);
      if (s) { var o = JSON.parse(s); for (var k in o) { if (o[k] !== undefined) d[k] = o[k]; } }
    } catch (e) {}
    return d;
  })();
  var syncBusy = false, syncTimer = null, syncDirty = false, dirtySeq = 0, syncLastOk = 0, syncErr = '';

  function saveGhCfg() { lsSet(LS_GH, JSON.stringify(ghCfg)); }
  function setSyncStatus(kind, msg) {
    var el = document.getElementById('sync-status');
    if (!el) return;
    el.className = 'sync-status' + (kind === 'ok' ? ' ok' : kind === 'err' ? ' err' : '');
    if (kind === 'run') { el.textContent = '同步中…'; return; }
    if (kind === 'err') { el.textContent = '同步失败：' + (msg || ''); return; }
    if (kind === 'ok') { el.textContent = '已同步 ' + new Date(syncLastOk).toTimeString().slice(0, 5); return; }
    if (!ghCfg.token || !ghCfg.repo) { el.textContent = '未配置（数据仅存本机）'; return; }
    el.textContent = ghCfg.auto ? '自动同步已开启' : '已配置（手动同步）';
  }
  /* 本地数据变化：只标记「待上传」，**不在每次点击后立刻提交**。
     真正上传的时机：
       ① 切到后台 / 关闭页面时（主要）—— 一次学习会话通常只产生 1 个提交
       ② 距首次变化满 FALLBACK_MS 兜底一次（防止长时间停在前台一直不落盘）
       ③ 手动点「保存并同步」
     加上内容指纹比对，内容没变时不会产生空提交。 */
  var FALLBACK_MS = 300000;   // 兜底上传间隔（5 分钟）
  function markSyncDirty() {
    syncDirty = true;
    dirtySeq++;
    if (!ghCfg.auto || !ghCfg.token || !ghCfg.repo) return;
    if (syncTimer) return;    // 已有兜底定时器 → 让它到点再传
    syncTimer = setTimeout(function () { syncTimer = null; doSync(false); }, FALLBACK_MS);
  }
  /* 立即落盘（切后台 / 关闭页面时调用） */
  function flushSync() {
    if (syncTimer) { clearTimeout(syncTimer); syncTimer = null; }
    if (syncDirty) doSync(false);
  }
  function b64encStr(s) {
    var b = new TextEncoder().encode(s), bin = '';
    for (var i = 0; i < b.length; i++) bin += String.fromCharCode(b[i]);
    return btoa(bin);
  }
  function b64decStr(s) {
    var bin = atob(s), b = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(b);
  }
  function ghFileUrl() {
    return 'https://api.github.com/repos/' + ghCfg.repo + '/contents/' +
      encodeURIComponent(ghCfg.path) + '?ref=' + encodeURIComponent(curBranch());
  }
  function ghHeaders() {
    var h = {
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    };
    if (ghCfg.token) h['Authorization'] = 'Bearer ' + ghCfg.token;   // 无 Token 时可读公开文件
    return h;
  }
  function ghErrText(status) {
    if (status === 401) return 'Token 无效或已过期';
    if (status === 403) return '权限不足（需 Contents 读写）或触发限流';
    if (status === 404) return '仓库/文件不存在或 Token 无权访问';
    if (status === 409 || status === 422) return '写入被拒（若仓库为空：请先在仓库里添加一个 README 生成默认分支）';
    return 'HTTP ' + status;
  }
  /* 失败时尽量带上 GitHub 返回的具体原因（便于诊断） */
  function ghFail(r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      var m = ghErrText(r.status);
      if (j && j.message) m += ' ｜ ' + String(j.message).slice(0, 80);
      throw new Error(m);
    });
  }
  /* 运行时探明的「真实默认分支」（配置写 main、仓库实际是 master 时自动纠正） */
  var branchOverride = null;
  function curBranch() { return branchOverride || ghCfg.branch; }
  function ghDefaultBranch() {
    return fetch('https://api.github.com/repos/' + ghCfg.repo, { headers: ghHeaders(), cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { return (j && j.default_branch) || ''; })
      .catch(function () { return ''; });
  }
  function ghPull() {
    return fetch(ghFileUrl() + '&_=' + Date.now(), { headers: ghHeaders(), cache: 'no-store' })
      .then(function (r) {
        if (r.status === 404) return { doc: null, sha: null };   // 文件还没有 → 首次写入
        if (!r.ok) return ghFail(r);
        return r.json().then(function (j) {
          var doc = null;
          try { doc = JSON.parse(b64decStr(String(j.content || '').replace(/\s/g, ''))); } catch (e) { doc = null; }
          return { doc: doc, sha: j.sha };
        });
      });
  }
  /* 写入云端文件。失败时按序自救：
       ① 不带 branch 重试（空仓库：让 GitHub 用默认分支自动创建）
       ② 查询仓库真实默认分支（配置写 main、实际是 master）后重试
       ③ 重新拉取合并后用新 sha 重试（另一台设备刚写过） */
  /* 冲突后重新拉取 → 合并 → 用新 sha 重试。
     若拉到的新 sha 与刚被拒的 sha 完全相同，说明「读取拿到的是旧数据」（常见于旧版 SW
     把 api.github.com 的响应缓存住了），再重试也是白费 → 直接给出可操作的提示。 */
  function ghResyncRetry(sha, tries) {
    return ghPull().then(function (res) {
      if (sha && res.sha === sha) {
        throw new Error('云端读取仍返回旧数据（读取被缓存）：请完全关闭页面重新打开后再同步');
      }
      if (res.doc) {
        syncDoc = mergeDocs(syncDoc, res.doc);
        persistSyncDoc();
        applyDoc();
        refreshAfterSync();
      }
      return ghPut(res.sha, (tries | 0) + 1, false);
    });
  }
  function ghPut(sha, tries, noBranch) {
    var body = {
      message: 'sync ' + new Date().toISOString().slice(0, 16).replace('T', ' '),
      content: b64encStr(JSON.stringify(syncDoc))
    };
    if (!noBranch) body.branch = curBranch();
    if (sha) body.sha = sha;
    return fetch(ghFileUrl(), { method: 'PUT', headers: ghHeaders(), body: JSON.stringify(body) })
      .then(function (r) {
        if (r.ok) return true;
        if ((r.status === 409 || r.status === 422) && (tries | 0) < 4) {
          if (!noBranch && !sha) return ghPut(null, (tries | 0) + 1, true);        // ①
          if (!branchOverride) {
            return ghDefaultBranch().then(function (b) {                            // ②
              if (b && b !== curBranch()) {
                branchOverride = b;
                ghCfg.branch = b;
                saveGhCfg();
                return ghPut(sha, (tries | 0) + 1, false);
              }
              return ghResyncRetry(sha, tries);                                     // ③
            });
          }
          return ghResyncRetry(sha, tries);                                         // ③
        }
        return ghFail(r);
      });
  }
  function refreshAfterSync() {
    refreshAllBadges();
    updateSub();
    refreshFavCount();

    /* 收藏视图下同步到新的收藏集合 → 重建表格（尽量保持滚动位置）。
       但本次会话里刚取消的行的带 .unfav-pending：有它在就先不重建，
       否则 2.5s 后的自动同步会把它立刻删掉，违背「下次进来才消失」的预期。 */
    if (favOnly && !tblEl.querySelectorAll('.row.unfav-pending').length) {

  /* 内容指纹（与键顺序无关）：用于判断"真的变了"才提交，避免空提交 */
  function docSig(d) {
    var f = d.favs || {}, ids = Object.keys(f).sort(), i;
    var favs = [];
    for (i = 0; i < ids.length; i++) {
      var e = f[ids[i]] || [0, 0];
      favs.push(ids[i] + ':' + (e[0] ? 1 : 0) + ':' + (Number(e[1]) || 0));
    }
    var devs = Object.keys(d.dev || {}).sort(), parts = [];
    for (i = 0; i < devs.length; i++) {
      var b = d.dev[devs[i]] || {}, cl = b.clicks || {}, ws = Object.keys(cl).sort(), seg = [];
      for (var j = 0; j < ws.length; j++) {
        var r = cl[ws[j]] || [0, 0];
        seg.push(ws[j] + ':' + (Number(r[0]) || 0) + ':' + (Number(r[1]) || 0));
      }
      parts.push(devs[i] + '#' + (Number(b.t) || 0) + '#' + seg.join(','));
    }
    return hash32((Number(d.clicksResetAt) || 0) + '|' + favs.join(',') + '|' + parts.join('|'));

  function netErrText(e) {
    var m = (e && e.message) || String(e || '');

      if (!res.doc || docSig(syncDoc) !== remoteSig) {

        return ghPut(res.sha, 0);

  });

  var banner = document.getElementById('banner');
  var LS_TIP = 'kaoyan1500.homescreen-tip.v1';
  banner.addEventListener('click', function () {
    banner.hidden = true;
    if (banner.dataset.kind === 'tip') lsSet(LS_TIP, '1');
  });

  syncTopbarH();
  buildTable();                     /* 首次渲染（全部单词） */
  applyDefShowBtn();
  applyCountsBtn();
  refreshFavCount();
  updateSub();
  if (showCounts) document.body.classList.add('showcounts');
  requestAnimationFrame(function () {
    syncTopbarH();
    fillVisible();
    measureUnits();
    updateNavActive();
  });

  /* 云同步：已配置则启动时自动拉取一次；切后台时落盘，回到前台时再拉一次 */
  setSyncStatus('idle');
  if (ghCfg.token && ghCfg.repo) {
    setTimeout(function () { doSync(false); }, 900);
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') doSync(false);
    else flushSync();
  });
  window.addEventListener('pagehide', flushSync);

  var ua = navigator.userAgent;
  var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isSafari = /Safari\//.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
  var standalone = window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);

  if (!lsOK) {
    banner.textContent = '当前打开方式无法保存点击记录（例如「文件」预览）。建议通过 Safari 打开本页，或用统计面板中的「导出数据」备份。';
    banner.dataset.kind = 'warn';
    banner.hidden = false;
  } else if (isIOS && isSafari && !standalone && lsGet(LS_TIP) !== '1') {
    banner.textContent = '💡 点「分享 → 添加到主屏幕」，即可全屏离线使用、记录长期保留。点此关闭提示。';
    banner.dataset.kind = 'tip';
    banner.hidden = false;
  }
})();
</script>
</body>
</html>
